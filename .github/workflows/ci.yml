# Lint, typecheck, test, and run the migrations against a real Postgres.
#
# The database is the point. Half of what this repository gets wrong is only
# wrong against Postgres: a partial unique index, a cursor comparison losing
# microseconds, a transaction that does not roll back. A suite that mocks the
# database would have passed while every one of those was broken.
#
# pgvector rather than plain postgres:17, because migration 0001 creates the
# extension and a stock image cannot.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run in flight for the same ref. Nothing here is
  # worth finishing for a commit that has already been replaced.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: offload
          POSTGRES_PASSWORD: offload
          POSTGRES_DB: offload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U offload"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      # localhost is not decoration: test/setup.ts refuses to run against
      # anything else, because these tests truncate tables.
      DATABASE_URL: postgres://offload:offload@localhost:5432/offload_test
      API_URL: http://localhost:4701
      WEB_URL: http://localhost:4700
      COOKIE_DOMAIN: localhost
      # A throwaway. Nothing signed with it leaves this runner, and no real
      # secret is needed to prove the code works.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      EMAIL_FROM: ci@offload.club
      # Another throwaway, and it has to be here rather than absent: the worker
      # posts model results back through one internal endpoint and the schema
      # requires 32 characters, so the whole run dies at db:migrate without it.
      INTERNAL_SERVICE_TOKEN: ci-only-internal-token-not-used-anywhere-else-0123456789
      # RESEND_API_KEY is deliberately absent, which selects the in-memory
      # mailer. CI must not be one typo away from mailing a real person.

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Known advisories are Dependabot's job, switched on 2026-09-22 with the
      # actions above pinned to commits so it can bump them. `pnpm audit --prod`
      # was tried here and cannot tell the development tree from the one that
      # ships under a hoisted node_modules, so it would have gone red on vitest.

      # Generated from the design system's CSS, and nothing that imports a
      # token compiles without it.
      - run: pnpm tokens

      - run: pnpm lint

      # What lint and the compiler both wave through: a utility class the
      # theme has no rule for, a CSS module class defined nowhere, and an icon
      # name that is not in the set. Each renders as nothing and fails nothing.
      # They read the generated preset, so they run after `pnpm tokens`.
      - run: node .claude/scripts/dead-classes.mjs
      - run: node .claude/scripts/dead-css.mjs
      - run: node .claude/scripts/dead-icons.mjs

      - run: pnpm typecheck

      # Migrations first and on their own, so a broken migration fails as a
      # broken migration rather than as forty confusing test failures.
      - run: pnpm db:migrate

      # Against the schema the migrations just produced, with the volumes the
      # admin waitlist page actually pages through.
      - run: pnpm db:seed

      - run: pnpm test

      # The agent plane, which `pnpm test` cannot see.
      #
      # It has no package.json, so turbo has never included it, and until 013
      # its seven test files ran in no gate at all: not in CI, not in the
      # pre-commit hook, nowhere. 013 puts the embedder, retrieval and the
      # answering turn in this plane, and QUAL-1 does not mean much when the
      # tests covering a criterion are never executed.
      #
      # `pytest -q` and nothing else: the suite loads its own environment
      # through tests/conftest.py, and the live Voyage test skips itself here
      # because CI has no key.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.5.x"
      - run: uv sync --frozen
        working-directory: apps/agent
      - run: uv run pytest -q
        working-directory: apps/agent
      - run: uv run ruff check .
        working-directory: apps/agent

      - run: pnpm build

      # The web's content security policy, against the built app: every script
      # in every page carries the nonce its header names. `pnpm test` skips it
      # because it builds and starts the app. A page that ships prerendered
      # passes every other gate here and runs none of its scripts in a browser.
      - run: pnpm -C apps/web exec vitest run test/csp-built.test.ts
        env:
          WEB_CSP_TEST: "1"
