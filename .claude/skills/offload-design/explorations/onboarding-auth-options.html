<script type="text/babel">
const {Icon,IconButton,Button,Badge,Chip,Logo,TextField,Switch,Toast,TabBar,AppBar}=window.OffloadDesignSystem_dc4a89;
const W=390,H=720,S=212/390;

/* Every screen is drawn at 390x720 and scaled into a 212px column, so the type and hit
   targets are the real ones. Chrome is the iOS kit's; Android is the same flow with the
   Material bars, which is a mechanical swap. */
function Screen({children,bar,back,style}){
  return (
    <div style={{width:212,height:Math.round(H*S),overflow:"hidden",borderRadius:16,
      border:"1px solid var(--border-hairline)",background:"var(--surface-page)"}}>
      <div style={{width:W,height:H,transform:"scale("+S+")",transformOrigin:"top left",display:"flex",
        flexDirection:"column",background:"var(--surface-page)",...style}}>
        <div style={{height:44,flex:"0 0 auto",display:"flex",alignItems:"flex-end",justifyContent:"space-between",
          padding:"0 22px 6px",font:"var(--weight-medium) 13px/1 var(--font-core)",fontVariantNumeric:"tabular-nums"}}>
          <span>9:41</span><span style={{display:"flex",gap:5,color:"var(--text-primary)"}}>
            <Icon name="signal" size={13}/><Icon name="battery-full" size={13}/></span>
        </div>
        {bar!==false?(
          <AppBar title={bar||undefined} border={false}
            left={back?<IconButton icon="chevron-left" label={back}/>:null}/>
        ):null}
        {children}
      </div>
    </div>
  );
}
function Body({children,style}){
  return <div style={{flex:1,minHeight:0,padding:"0 22px",display:"flex",flexDirection:"column",...style}}>{children}</div>;
}
function Title({children,sub}){
  return (
    <div style={{padding:"6px 0 18px"}}>
      <div style={{font:"var(--text-title-1)",letterSpacing:"var(--tracking-title)"}}>{children}</div>
      {sub?<div style={{font:"var(--text-body-role)",color:"var(--text-secondary)",marginTop:8,lineHeight:1.45}}>{sub}</div>:null}
    </div>
  );
}
/* The kit's composer, geometry and controls included: 48pt pill, always the blue border,
   camera, mic and send. `typed` shows the state where send is live. */
function Composer({placeholder="Dump anything",typed,bare}){
  return (
    <div style={{padding:bare?0:"var(--space-4) var(--gutter-screen) var(--space-5)"}}>
      <div style={{display:"flex",alignItems:"center",gap:"var(--space-3)",minHeight:48,
        padding:"0 var(--space-3) 0 var(--space-6)",borderRadius:"var(--radius-pill)",
        background:"var(--surface-input)",border:"1px solid var(--border-focus)"}}>
        <span style={{flex:1,minWidth:0,font:"var(--text-body-role)",letterSpacing:"var(--tracking-body)",
          whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",
          color:typed?"var(--text-primary)":"var(--text-tertiary)"}}>{typed||placeholder}</span>
        <span style={{display:"flex",alignItems:"center",gap:"var(--space-2)",flex:"0 0 auto"}}>
          <IconButton icon="camera" label="Photo" size="sm"/>
          <IconButton icon="mic" label="Voice note" size="sm"/>
          <IconButton icon="arrow-up" label="Send" size="sm" variant={typed?"primary":"quiet"}
            tone={typed?"attention":undefined}/>
        </span>
      </div>
    </div>
  );
}
function Turn({from,text,chips}){
  const you=from==="you";

}

/* ---------------- the sign-in screens ---------------- */

      </Foot>

}

/* ---------------- flow A: dump first, account when it has to sync ---------------- */

        </div>

}
function A2(){

}
function A3(){

    <Screen bar={false}>
      <Body style={{justifyContent:"flex-end"}}>
        <Turn from="you" text="Oak brackets, 30cm, matte black, sale ends Friday"/>
        <Turn text="Kept. I made a thing for the bookshelf and put Friday on it." chips={["Bookshelf build"]}/>

    </Screen>

}
function A4(){
  return (
    <Screen bar={false}>
      <div style={{padding:"0 22px"}}>
        <div style={{font:"var(--text-title-1)",letterSpacing:"var(--tracking-title)",paddingTop:6}}>Today</div>
        <div style={{fontSize:14,color:"var(--text-secondary)",marginTop:4}}>Tue 11 Aug · sunset 19:15</div>
      </div>
      <Body style={{paddingTop:14}}>
        <Row icon="check" title="Order the oak brackets" meta="Bookshelf build · sale ends Friday" tint/>
        <Row icon="lasso" title="Bookshelf build" meta="1 thing · just you"/>
        <div style={{marginTop:"auto",paddingBottom:14}}>

/* ---------------- flow B: three screens, then sign in ---------------- */

      <Body>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:8}}>

            {[1,2,3].map(i=><span key={i} style={{width:i===n?18:6,height:6,borderRadius:99,
              background:i===n?"var(--ink-950)":"var(--ink-200)"}}/>)}
          </span>
          <span style={{font:"var(--weight-medium) 14px/1 var(--font-core)",color:"var(--text-secondary)"}}>Skip</span>
        </div>
        <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}>{art}</div>
        <div style={{paddingBottom:18}}>
          <div style={{font:"var(--text-title-1)",letterSpacing:"var(--tracking-title)"}}>{title}</div>
          <div style={{font:"var(--text-body-role)",color:"var(--text-secondary)",marginTop:8,lineHeight:1.45}}>{sub}</div>

}

        .map((t,i)=><span key={t} style={{alignSelf:i%2?"flex-end":"flex-start",padding:"10px 14px",borderRadius:16,
          background:"var(--surface-fill)",font:"var(--text-body-sm-role)",color:"var(--text-secondary)"}}>{t}</span>)}

}

    <div style={{width:"100%",display:"flex",flexDirection:"column",gap:10}}>
      {[["lasso","Lisbon trip","4 things"],["bookmark","Bookshelf build","2 things"],["cloudy","Read later","23 things"]]
        .map(([i,t,m])=>(
        <span key={t} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:16,

          <span style={{width:32,height:32,borderRadius:9,background:"var(--surface-fill)",display:"flex",
            alignItems:"center",justifyContent:"center",color:"var(--text-secondary)"}}><Icon name={i} size={15}/></span>
          <span style={{flex:1,font:"var(--weight-medium) 15px/1 var(--font-core)"}}>{t}</span>

/* ---------------- flow C: sign in, one question, in ---------------- */
function C2(){
  return (
    <Screen bar={false}>
      <Body>
        <Title sub="Whatever is loudest. One line is enough, and you can change your mind later.">

        <div style={{padding:"14px 16px",borderRadius:18,background:"var(--surface-input)",

}
function C3(){
  return (
    <Screen bar={false}>
      <div style={{padding:"0 22px"}}>
        <div style={{font:"var(--text-title-1)",letterSpacing:"var(--tracking-title)",paddingTop:6}}>Today</div>
        <div style={{fontSize:14,color:"var(--text-secondary)",marginTop:4}}>One thing in here, nothing needs you yet</div>

      <Body style={{paddingTop:14}}>
        <Row icon="lasso" title="Lisbon trip" meta="Made from what you said · just you"/>
        <div style={{marginTop:16,padding:"16px 18px",borderRadius:18,background:"var(--surface-accent-soft)"}}>

function Step({cap,note,children}){
  return <div className="step">{children}<p className="cap"><b>{cap}</b>{note}</p></div>;
}
function Flow({name,tag,note,spec,children}){
  return (
    <div className="flow">
      <div className="fname">{name}<u>{tag}</u></div>
      <p className="fnote">{note}</p>
      <div className="strip">{children}</div>
      <ul className="spec">{spec.map(s=><li key={s} dangerouslySetInnerHTML={{__html:s}}/>)}</ul>
    </div>
  );
}

function App(){
  return (
    <>
      <h1>Getting in, and the first five minutes</h1>
      <p className="lede">Two decisions, drawn at real size: how you sign in, and what the app asks of you
        before it is useful. Screens are the iOS kit's chrome; Android is the same flow with the Material bars,
        which is a mechanical swap, and the web version reuses whichever sign-in you pick. Nothing here is
        wired, it is a set of candidates to react to.</p>

      <div className="sechead"><h2>1 · How you get in</h2><u>pick one, the other two become fallbacks</u></div>
      <div className="strip" style={{marginBottom:14}}>
        <Step cap="Passkey first" note="Face or fingerprint, no password to invent. Email link is the way in on a borrowed device.">
          <PasskeyScreen/></Step>
        <Step cap="Email link only" note="One field, no passwords anywhere. Slowest first run: you leave the app to fetch the link.">
          <EmailScreen/></Step>
        <Step cap="Apple and Google" note="Fastest tap, most familiar. Costs two SDKs and an account-linking case when someone switches.">
          <ProviderScreen/></Step>
      </div>
      <ul className="spec" style={{marginBottom:42}}>
        <li><b>Recommendation:</b> passkey first with the email link underneath. It matches offload's promise of nothing to remember, and it is the only one with no password reset flow at all.</li>
        <li>Whichever wins, sign-in is one screen. No account type to choose, no name asked for before you have used anything.</li>
      </ul>

      <div className="sechead"><h2>2 · The first five minutes</h2><u>three shapes</u></div>

      <Flow name="A · Dump first, account when it has to sync" tag="4 screens, 0 before value"
        note="The app opens on the composer. You dump something, offload answers, and only then does it ask for an account, because that is the first moment an account buys you anything."
        spec={["<b>Buys</b> the product's own argument: it proves what offload does before asking for anything.",
          "<b>Costs</b> a local-only state and a migration when the account is made, plus an answer to \"what if they never sign in\".",
          "<b>Notifications</b> are asked for after the first thing lands, in context, not on a cold screen."]}>
        <Step cap="1 · Open" note="No splash, no carousel. The composer and three examples of what a dump looks like."><A1/></Step>
        <Step cap="2 · Dump something" note="Offload answers in its own voice and shows the thing it made."><A2/></Step>
        <Step cap="3 · The ask" note="A sheet, at the moment it matters, with a way to decline that is not a dead end."><A3/></Step>
        <Step cap="4 · In" note="Today, built from what you dumped, with the toast confirming where it went."><A4/></Step>
      </Flow>

      <Flow name="B · Three screens, then sign in" tag="4 screens, value after"
        note="The conventional shape: what it is, how it sorts, when it will reach you, then the account. Every screen is skippable, and the third one carries the notification ask."
        spec={["<b>Buys</b> the chance to explain the model, which matters because \"dump anything\" is unusual enough to need one sentence.",
          "<b>Costs</b> three screens before anything is yours, and the well-known fact that most people skip them.",
          "<b>Weakness:</b> asking for notifications on a cold screen is the lowest-consent moment in the whole flow."]}>
        <Step cap="1 · What it is" note="Everything in one place, in any order."><Intro n={1} title="Dump anything" sub="Half a thought, a photo, a voice note. No folders, no tidying." art={<ArtDump/>}/></Step>
        <Step cap="2 · What it does" note="It sorts what you dumped into things."><Intro n={2} title="offload sorts it" sub="Related bits end up together, with the dates and the money attached." art={<ArtSort/>}/></Step>
        <Step cap="3 · When it speaks" note="The permission ask, framed as a promise about volume."><Intro n={3} title="It only interrupts when it matters" sub="Deadlines and answers you are waiting on. Nothing else." art={<ArtNudge/>}/></Step>
        <Step cap="4 · Sign in" note="The screen you picked in section 1."><PasskeyScreen/></Step>
      </Flow>

      <Flow name="C · Sign in, one question, in" tag="3 screens, one thing asked"
        note="One question after sign-in, in offload's voice, and the answer becomes the first thing in the app. The account exists before anything is stored, so there is no local-only state to migrate."
        spec={["<b>Buys</b> a non-empty first screen without a tour, and one honest piece of context offload can actually use.",
          "<b>Costs</b> the risk of the blank-page moment: a question is harder to answer than a prompt is to copy.",
          "<b>Notifications</b> are asked for on the first thing offload wants to tell you about, days later."]}>
        <Step cap="1 · Sign in" note="Nothing before it."><PasskeyScreen/></Step>
        <Step cap="2 · One question" note="Free text, with five chips for anyone who stalls."><C2/></Step>
        <Step cap="3 · In, with something in it" note="The thing it made, and one line about what to do next."><C3/></Step>
      </Flow>

      <div className="sechead"><h2>What any of these still owes you</h2></div>
      <ul className="spec">
        <li><b>Second device.</b> Signing in where there is already data: merge, or replace, or keep both.</li>
        <li><b>Coming back.</b> The returning-user screen, which is not the same as the first-run one.</li>
        <li><b>Refusals.</b> Notifications denied, passkey cancelled, email link expired, offline on first run.</li>
        <li><b>Leaving.</b> Sign out, and delete everything, which the phone settings promise but no screen shows yet.</li>
        <li><b>The invited case.</b> Someone shares a thing with you before you have an account.</li>
      </ul>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
