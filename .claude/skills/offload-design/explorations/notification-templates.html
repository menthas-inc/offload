<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Notification templates</title>
<link rel="stylesheet" href="../styles.css?v=3">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js?v=20260921-avatar"></script>
<script>window.OFFLOAD_ICON_BASE="../assets/icons/"</script>
<style>
html,body{margin:0}
body{background:var(--surface-sunken);color:var(--text-primary);font:var(--text-body-role);letter-spacing:var(--tracking-body)}
#root{padding:34px 40px 90px;max-width:1180px;margin:0 auto}
a{color:var(--text-accent)}a:hover{color:var(--moss-700)}
h1{font:var(--text-title-1);letter-spacing:var(--tracking-title);margin:0 0 8px}
h2{font:var(--weight-semibold) 19px/1.2 var(--font-core);letter-spacing:-0.012em;margin:0}
.lede{font-size:15px;line-height:1.6;color:var(--text-secondary);max-width:76ch;margin:0 0 36px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 40px;align-items:start}
.colhead{display:flex;align-items:baseline;gap:10px;padding-bottom:9px;border-bottom:1px solid var(--ink-950);margin-bottom:4px}
.colhead u{text-decoration:none;font:var(--text-numeric-role);font-size:11px;color:var(--text-tertiary)}
.rowhead{grid-column:1 / -1;display:flex;align-items:center;gap:10px;margin-top:26px}
.rowhead b{font:var(--weight-medium) 15px/1.2 var(--font-core)}
.rowhead span{font-size:13px;color:var(--text-secondary)}
.stage{border-radius:20px;padding:22px;width:max-content;box-sizing:border-box;background:linear-gradient(160deg,#8E9AA8,#5F6B7A);display:flex;flex-direction:column;gap:12px}
.stage[data-plat="android"]{background:linear-gradient(160deg,#7C8878,#4E5A4C)}
.note{font-size:12.5px;line-height:1.5;color:var(--text-secondary);margin:8px 0 0}
.note b{color:var(--text-primary);font-weight:500}
.spec{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.spec li{font-size:12.5px;line-height:1.45;color:var(--text-secondary);padding-left:13px;position:relative}
.spec li:before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:99px;background:var(--ink-300)}
</style></head><body>
<div id="root"></div>
<script type="text/babel">
const {Icon,Logo,Badge}=window.OffloadDesignSystem_dc4a89;

/* ---------------- iOS ----------------
   A banner is one continuous-corner card of system material: icon, app name, time on the
   first line, then title and body. A collapsed banner cannot carry buttons, so actions
   sit in the expanded state as full-width rows under the content, split by hairlines. */
function IOSBanner({title,body,actions}){
  return (
    <div style={{width:390,borderRadius:22,overflow:"hidden",background:"rgba(255,255,255,0.82)",
      backdropFilter:"blur(20px) saturate(140%)",WebkitBackdropFilter:"blur(20px) saturate(140%)",
      boxShadow:"0 10px 24px -10px rgba(0,0,0,0.35)",color:"#0B0B0B"}}>
      <div style={{display:"flex",gap:11,padding:"13px 15px 14px"}}>
        <span style={{width:38,height:38,flex:"0 0 auto",borderRadius:9,background:"#0B0B0B",display:"flex",
          alignItems:"center",justifyContent:"center"}}><Logo variant="mark" size={22} tone="inverse"/></span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"baseline",gap:8}}>
            <span style={{flex:1,minWidth:0,font:"var(--weight-medium) 12px/1.2 var(--font-core)",
              letterSpacing:"0.04em",textTransform:"uppercase",color:"rgba(11,11,11,0.55)"}}>offload</span>
            <span style={{font:"var(--weight-regular) 12px/1.2 var(--font-core)",color:"rgba(11,11,11,0.5)",
              fontVariantNumeric:"tabular-nums",flex:"0 0 auto"}}>now</span>
          </div>
          <div style={{font:"var(--weight-semibold) 15px/1.3 var(--font-core)",marginTop:2}}>{title}</div>
          <div style={{font:"var(--weight-regular) 15px/1.35 var(--font-core)",marginTop:1,
            display:"-webkit-box",WebkitLineClamp:4,WebkitBoxOrient:"vertical",overflow:"hidden"}}>{body}</div>
        </div>
      </div>
      {actions&&actions.length?(
        <div style={{borderTop:"0.5px solid rgba(11,11,11,0.14)"}}>
          {actions.map((a,i)=>(
            <div key={a.label} style={{minHeight:44,display:"flex",alignItems:"center",justifyContent:"center",
              borderTop:i?"0.5px solid rgba(11,11,11,0.14)":"none",cursor:"pointer",
              font:"var(--weight-regular) 15px/1 var(--font-core)",
              color:a.destructive?"#C0392B":"#0B0B0B"}}>{a.label}</div>
          ))}
        </div>
      ):null}
    </div>
  );
}

/* ---------------- Android ----------------
   One surface-container card: the header line carries the small monochrome icon, the app
   name, the time and the expander; actions are text buttons in a row at the bottom of the
   same card, left aligned, sentence case, tinted with the app's accent. */
function AndroidNotification({title,body,actions,expandable=true}){
  return (
    <div data-platform="android" style={{width:360,boxSizing:"border-box",borderRadius:26,padding:"14px 16px 12px",
      background:"#ECEBE7",color:"#1B1B1A",boxShadow:"0 1px 2px rgba(0,0,0,0.28),0 4px 10px 2px rgba(0,0,0,0.14)"}}>
      <div style={{display:"flex",alignItems:"center",gap:7}}>
        <span style={{width:18,height:18,flex:"0 0 auto",borderRadius:99,background:"#3F6B4F",display:"flex",
          alignItems:"center",justifyContent:"center"}}><Logo variant="mark" size={12} tone="inverse"/></span>
        <span style={{font:"var(--weight-medium) 12.5px/1 var(--font-core)",color:"#5A5A57"}}>offload</span>
        <span style={{width:3,height:3,borderRadius:99,background:"#8A8A86"}}/>
        <span style={{font:"var(--weight-regular) 12.5px/1 var(--font-core)",color:"#5A5A57",
          fontVariantNumeric:"tabular-nums"}}>now</span>
        {expandable?<span style={{marginLeft:"auto",color:"#5A5A57",display:"flex"}}>
          <Icon name="chevron-down" size={16}/></span>:null}
      </div>
      <div style={{font:"var(--weight-medium) 15px/1.35 var(--font-core)",marginTop:7,whiteSpace:"nowrap",
        overflow:"hidden",textOverflow:"ellipsis"}}>{title}</div>
      <div style={{font:"var(--weight-regular) 14px/1.4 var(--font-core)",color:"#3A3A38",marginTop:2,
        display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden"}}>{body}</div>
      {actions&&actions.length?(
        <div style={{display:"flex",gap:4,marginTop:8,marginLeft:-10}}>
          {actions.map(a=>(
            <span key={a.label} style={{height:36,display:"inline-flex",alignItems:"center",padding:"0 10px",
              borderRadius:18,cursor:"pointer",font:"var(--weight-medium) 13.5px/1 var(--font-core)",
              color:a.destructive?"#C0392B":"#2440A8"}}>{a.label}</span>
          ))}
        </div>
      ):null}
    </div>
  );
}

function Row({label,note,ios,android,iosSpec,androidSpec}){
  return (
    <>
      <div className="rowhead"><b>{label}</b><span>{note}</span></div>
      <div>
        <div className="stage"><IOSBanner {...ios}/></div>
        <ul className="spec">{iosSpec.map(s=><li key={s}>{s}</li>)}</ul>
      </div>
      <div>
        <div className="stage" data-plat="android"><AndroidNotification {...android}/></div>
        <ul className="spec">{androidSpec.map(s=><li key={s}>{s}</li>)}</ul>
      </div>
    </>
  );
}

function App(){
  return (
    <>
      <h1>Notification templates</h1>
      <p className="lede">Three shapes on both platforms, in the same voice as the app: what offload noticed,
        and at most two things you can do about it without opening anything. The two columns are not the same
        drawing twice. iOS puts actions in the expanded banner as full-width rows, because a collapsed banner
        cannot carry a button; Android puts them as text buttons inside the card, where they are always visible.</p>

      <div className="grid">
        <div className="colhead"><h2>iOS</h2><u>banner, 390pt wide</u></div>
        <div className="colhead"><h2>Android</h2><u>notification shade, 360dp</u></div>

        <Row label="1 · Title and information" note="nothing to do, just worth knowing"
          ios={{title:"Ana answered",body:"She can only travel the 14th to the 17th. That is inside your window."}}
          android={{title:"Ana answered",body:"She can only travel the 14th to the 17th. That is inside your window."}}
          iosSpec={["Title is one line, semibold 15pt; the body wraps to four lines collapsed.",
            "App name and time sit on the first line, never inside the title.",
            "UNNotificationRequest with title and body. No category needed."]}
          androidSpec={["Header line: 18dp monochrome icon, app name, time, expander.",
            "Title one line, text clamped to two lines until expanded.",
            "NotificationCompat.Builder with setContentTitle and setContentText."]}/>

        <Row label="2 · One thing to do" note="the whole point of the notification is the action"
          ios={{title:"Brackets go up in price Friday",body:"Oak brackets, 30cm, matte black. You saved the link on Tuesday.",
            actions:[{label:"Order now"}]}}
          android={{title:"Brackets go up in price Friday",body:"Oak brackets, 30cm, matte black. You saved the link on Tuesday.",
            actions:[{label:"Order now"}]}}
          iosSpec={["The action only shows expanded: long press or pull down on the banner.",
            "Full width row, 44pt minimum, centred, hairline above.",
            "UNNotificationAction inside a registered UNNotificationCategory."]}
          androidSpec={["One text button, left aligned with the title, sentence case.",
            "36dp tall, tinted blue-700, the same accent as the navigation bar.",
            "addAction with a PendingIntent; no icon needed on Android 7+."]}/>

        <Row label="3 · Two things to do" note="an answer and a way out"
          ios={{title:"€214 to Ana for the flights",body:"You said you would sort it. Nothing has moved since Tuesday.",
            actions:[{label:"Mark as paid"},{label:"Remind me tomorrow"}]}}
          android={{title:"€214 to Ana for the flights",body:"You said you would sort it. Nothing has moved since Tuesday.",
            actions:[{label:"Mark as paid"},{label:"Tomorrow"}]}}
          iosSpec={["Two rows, stacked, in order of what you would most likely pick.",
            "A destructive action goes last and turns red.",
            "Four actions maximum, and only ever two here."]}
          androidSpec={["Two text buttons in one row; three is the platform maximum.",
            "Labels stay short so the row never wraps at 360dp.",
            "Order is left to right by likelihood, same as iOS top to bottom."]}/>
      </div>

      <div className="rowhead"><b>What holds across both</b></div>
      <p className="note" style={{maxWidth:"76ch"}}>
        The title says what happened, not what the app is. The body carries the detail offload already knows,
        so the notification is worth reading on its own. Actions are verbs, never <b>Yes</b> or <b>OK</b>. Nothing
        is animated: on both platforms the system owns the entrance, and neither lets an app time it.
      </p>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
