<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="offload app screen" description="Mobile app screen shell, bars, section, content rows, composer, tab bar" -->
<helmet><script src="./ds-base.js"></script><style>@keyframes offload-rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}</style></helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F8F8F8;font-family:'Instrument Sans','Helvetica Neue',Helvetica,sans-serif;padding:24px">
<div style="width:390px;height:844px;background:#FFFFFF;border:1px solid #DEDEDE;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 32px -8px rgba(11,11,11,0.12);position:relative">
<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 26px 4px;font-size:13px;font-weight:600;letter-spacing:-0.006em;color:#0B0B0B"><span>9:41</span><span style="display:flex;gap:4px;align-items:center"><span style="width:22px;height:11px;border:1px solid currentColor;border-radius:3px;padding:1px;display:flex"><i style="flex:1;background:currentColor;border-radius:1px"></i></span></span></div>
<header style="display:flex;align-items:center;gap:8px;min-height:52px;padding:0 20px;border-bottom:1px solid #EAEAEA">
<div style="flex:1;min-width:0;font-size:17px;font-weight:600;letter-spacing:-0.014em;color:#0B0B0B">{{ title }}</div>
<x-import component-from-global-scope="OffloadDesignSystem_dc4a89.IconButton" icon="bell" label="Activity" hint-size="40px,40px"></x-import>
<x-import component-from-global-scope="OffloadDesignSystem_dc4a89.IconButton" icon="settings" label="Settings" hint-size="40px,40px"></x-import>
</header>
<div style="display:flex;gap:6px;padding:12px 20px;overflow-x:auto;flex:0 0 auto">
<x-import component-from-global-scope="OffloadDesignSystem_dc4a89.Chip" selected="{{ true }}" hint-size="90px,30px">Everything</x-import>
<x-import component-from-global-scope="OffloadDesignSystem_dc4a89.Chip" hint-size="90px,30px">Lisbon trip</x-import>
<x-import component-from-global-scope="OffloadDesignSystem_dc4a89.Chip" hint-size="110px,30px">Bookshelf build</x-import>
</div>
<div style="flex:1;min-height:0;overflow-y:auto">
<div style="display:flex;align-items:baseline;justify-content:space-between;padding:16px 20px 8px"><span style="font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#9E9E9E">{{ sectionLabel }}</span><span style="font-size:13px;font-weight:500;color:#5C5C5C">3 things</span></div>
<x-import component-from-global-scope="OffloadDesignSystem_dc4a89.ListRow" title="Miradouro da Senhora do Monte" meta="Lisbon trip · from Safari" trailing="2m" chevron="{{ true }}" hint-size="100%,72px"></x-import>
<x-import component-from-global-scope="OffloadDesignSystem_dc4a89.ListRow" title="Oak brackets, 30cm, matte black" meta="Bookshelf build · voice note, 0:14" trailing="18m" chevron="{{ true }}" hint-size="100%,72px"></x-import>
<x-import component-from-global-scope="OffloadDesignSystem_dc4a89.ListRow" title="Tram 28 runs every 11 minutes" meta="Lisbon trip · from Messages" trailing="1h" chevron="{{ true }}" hint-size="100%,72px"></x-import>
<sc-if value="{{ showSuggestion }}" hint-placeholder-val="{{ true }}">
<div style="padding:20px">
<x-import component-from-global-scope="OffloadDesignSystem_dc4a89.Card" hint-size="100%,96px">
<div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:#3F6B4F;margin-bottom:6px"><x-import component-from-global-scope="OffloadDesignSystem_dc4a89.Icon" name="sparkles" size="{{ 16 }}" hint-size="16px,16px"></x-import>offload noticed something</div>
<div style="font-size:16px;line-height:1.45;letter-spacing:-0.006em;color:#0B0B0B">Five loose things look like one trip. Want a space for them?</div>
</x-import>
</div>
</sc-if>
</div>
<div style="padding:8px 20px 12px;border-top:1px solid #EAEAEA;background:rgba(255,255,255,0.92)">
<div style="display:flex;align-items:center;gap:6px;height:48px;padding:0 6px 0 16px;border-radius:999px;background:#F2F2F2">
<span style="flex:1;font-size:16px;letter-spacing:-0.006em;color:#9E9E9E">What's on your mind?</span>
<x-import component-from-global-scope="OffloadDesignSystem_dc4a89.IconButton" icon="camera" label="Photo" size="sm" hint-size="32px,32px"></x-import>
<x-import component-from-global-scope="OffloadDesignSystem_dc4a89.IconButton" icon="mic" label="Voice note" size="sm" hint-size="32px,32px"></x-import>
<x-import component-from-global-scope="OffloadDesignSystem_dc4a89.IconButton" icon="arrow-up" label="Send" size="sm" variant="quiet" hint-size="32px,32px"></x-import>
</div>
</div>
<x-import component-from-global-scope="OffloadDesignSystem_dc4a89.TabBar" items="{{ tabs }}" value="{{ tab }}" onChange="{{ setTab }}" hint-size="100%,64px"></x-import>
<div style="position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#C4C4C4"></div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:438,&quot;height&quot;:892},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;offload&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sectionLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Today&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showSuggestion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { tab: "home" };
  renderVals() {
    return {
      title: this.props.title ?? "offload",
      sectionLabel: this.props.sectionLabel ?? "Today",
      showSuggestion: this.props.showSuggestion ?? true,
      tab: this.state.tab,
      setTab: (v) => this.setState({ tab: v }),
      tabs: [
        { value: "home", label: "Home", icon: "house" },
        { value: "threads", label: "My threads", icon: "lasso" },
        { value: "memories", label: "Memories", icon: "cloudy" }
      ]
    };
  }
}

</script>
</body>
</html>
