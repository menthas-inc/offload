<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css?v=1786472643305"><style>body{margin:0;padding:0;background:var(--surface-page);color:var(--text-primary);font:var(--text-body-role)}.lbl{font:var(--text-numeric-role);font-size:11px;color:var(--text-tertiary)}</style></head><body><div data-ds-theme-root data-theme="light" style="background:var(--surface-page);color:var(--text-primary);padding:20px;min-height:100%;box-sizing:border-box"><div class="ds-theme-tg" role="group" aria-label="Theme" style="display:flex;border:1px solid var(--border-hairline);border-radius:var(--radius-pill);overflow:hidden;width:max-content;margin-bottom:14px">
<button type="button" data-set="light" aria-pressed="true" style="border:none;cursor:pointer;height:24px;padding:0 12px;font:var(--weight-medium) 11px/1 var(--font-core);background:var(--surface-inverse);color:var(--text-inverse)">Light</button>
<button type="button" data-set="dark" aria-pressed="false" style="border:none;cursor:pointer;height:24px;padding:0 12px;font:var(--weight-medium) 11px/1 var(--font-core);background:transparent;color:var(--text-secondary)">Dark</button>
</div><div style="display:flex;align-items:flex-end;gap:8px"><div><div style="width:var(--space-1);height:56px;background:var(--ink-900)"></div><div class="lbl" style="padding-top:6px">1</div></div><div><div style="width:var(--space-2);height:56px;background:var(--ink-900)"></div><div class="lbl" style="padding-top:6px">2</div></div><div><div style="width:var(--space-3);height:56px;background:var(--ink-900)"></div><div class="lbl" style="padding-top:6px">3</div></div><div><div style="width:var(--space-4);height:56px;background:var(--ink-900)"></div><div class="lbl" style="padding-top:6px">4</div></div><div><div style="width:var(--space-5);height:56px;background:var(--ink-900)"></div><div class="lbl" style="padding-top:6px">5</div></div><div><div style="width:var(--space-6);height:56px;background:var(--ink-900)"></div><div class="lbl" style="padding-top:6px">6</div></div><div><div style="width:var(--space-7);height:56px;background:var(--ink-900)"></div><div class="lbl" style="padding-top:6px">7</div></div><div><div style="width:var(--space-8);height:56px;background:var(--ink-900)"></div><div class="lbl" style="padding-top:6px">8</div></div><div><div style="width:var(--space-9);height:56px;background:var(--ink-900)"></div><div class="lbl" style="padding-top:6px">9</div></div><div><div style="width:var(--space-10);height:56px;background:var(--ink-900)"></div><div class="lbl" style="padding-top:6px">10</div></div><div><div style="width:var(--space-11);height:56px;background:var(--ink-900)"></div><div class="lbl" style="padding-top:6px">11</div></div><div><div style="width:var(--space-12);height:56px;background:var(--ink-900)"></div><div class="lbl" style="padding-top:6px">12</div></div></div></div><script>
(function(){
  var root=document.querySelector("[data-ds-theme-root]");
  document.querySelectorAll(".ds-theme-tg button").forEach(function(b){
    b.addEventListener("click",function(){
      var t=b.dataset.set;
      root.setAttribute("data-theme",t);
      document.documentElement.setAttribute("data-theme",t);
      document.querySelectorAll(".ds-theme-tg button").forEach(function(x){
        var on=x.dataset.set===t;
        x.setAttribute("aria-pressed",String(on));
        x.style.background=on?"var(--surface-inverse)":"transparent";
        x.style.color=on?"var(--text-inverse)":"var(--text-secondary)";
      });
    });
  });
})();
</script></body></html>
