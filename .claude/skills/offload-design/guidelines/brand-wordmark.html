<!-- @dsCard group="Brand" viewport="700x228" name="Mark & lockup" subtitle="A dot above an open vessel. One colour, always." -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css?v=1786472643305"><style>body{margin:0;padding:0;background:var(--surface-page);color:var(--text-primary)}.lbl{font:var(--text-numeric-role);font-size:11px;color:var(--text-tertiary)}.pane{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;padding:30px;font:600 30px/1 var(--font-core);letter-spacing:-0.03em}</style></head><body><div data-ds-theme-root data-theme="light" style="background:var(--surface-page);color:var(--text-primary);padding:20px;min-height:100%;box-sizing:border-box"><div class="ds-theme-tg" role="group" aria-label="Theme" style="display:flex;border:1px solid var(--border-hairline);border-radius:var(--radius-pill);overflow:hidden;width:max-content;margin-bottom:14px">
<button type="button" data-set="light" aria-pressed="true" style="border:none;cursor:pointer;height:24px;padding:0 12px;font:var(--weight-medium) 11px/1 var(--font-core);background:var(--surface-inverse);color:var(--text-inverse)">Light</button>
<button type="button" data-set="dark" aria-pressed="false" style="border:none;cursor:pointer;height:24px;padding:0 12px;font:var(--weight-medium) 11px/1 var(--font-core);background:transparent;color:var(--text-secondary)">Dark</button>
</div>
<div style="display:flex;align-items:stretch;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)">
<div class="pane" style="background:var(--paper);color:var(--ink-950)"><img src="../assets/mark.svg" width="32" height="32" alt=""><span>offload</span></div>
<div class="pane" style="background:var(--ink-950);color:var(--paper)"><img src="../assets/mark-inverse.svg" width="32" height="32" alt=""><span>offload</span></div>
</div>
<div class="lbl" style="padding-top:10px">mark 32px · gap = 0.34 × mark · wordmark Instrument Sans 600, -0.03em · clear space = the dot's diameter</div>
</div><script>
(function(){
  var root=document.querySelector("[data-ds-theme-root]");
  document.querySelectorAll(".ds-theme-tg button").forEach(function(b){
    b.addEventListener("click",function(){
      var t=b.dataset.set;
      root.setAttribute("data-theme",t);
      document.documentElement.setAttribute("data-theme",t);
      document.querySelectorAll(".ds-theme-tg button").forEach(function(x){
        var on=x.dataset.set===t;
        x.setAttribute("aria-pressed",String(on));
        x.style.background=on?"var(--surface-inverse)":"transparent";
        x.style.color=on?"var(--text-inverse)":"var(--text-secondary)";
      });
    });
  });
})();
</script></body></html>
