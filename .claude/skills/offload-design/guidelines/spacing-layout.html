<!-- @dsCard group="Spacing" viewport="700x218" name="Layout constants" subtitle="Screen gutter, row heights, bar heights, tap minimum" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css?v=1786472643305"><style>body{margin:0;padding:0;background:var(--surface-page);color:var(--text-primary);font:var(--text-body-role)}.lbl{font:var(--text-numeric-role);font-size:11px;color:var(--text-tertiary)}</style></head><body><div data-ds-theme-root data-theme="light" style="background:var(--surface-page);color:var(--text-primary);padding:20px;min-height:100%;box-sizing:border-box"><div class="ds-theme-tg" role="group" aria-label="Theme" style="display:flex;border:1px solid var(--border-hairline);border-radius:var(--radius-pill);overflow:hidden;width:max-content;margin-bottom:14px">
<button type="button" data-set="light" aria-pressed="true" style="border:none;cursor:pointer;height:24px;padding:0 12px;font:var(--weight-medium) 11px/1 var(--font-core);background:var(--surface-inverse);color:var(--text-inverse)">Light</button>
<button type="button" data-set="dark" aria-pressed="false" style="border:none;cursor:pointer;height:24px;padding:0 12px;font:var(--weight-medium) 11px/1 var(--font-core);background:transparent;color:var(--text-secondary)">Dark</button>
</div><div style="display:flex;flex-direction:column;gap:6px;font-size:14px">
<div style="display:flex;gap:14px;align-items:baseline"><span class="lbl" style="width:150px">--gutter-screen</span><span style="width:56px;font-variant-numeric:tabular-nums">20px</span><span style="color:var(--text-secondary)">left/right padding on every screen</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="lbl" style="width:150px">--row-height</span><span style="width:56px;font-variant-numeric:tabular-nums">56px</span><span style="color:var(--text-secondary)">single-line list row</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="lbl" style="width:150px">--row-height-lg</span><span style="width:56px;font-variant-numeric:tabular-nums">72px</span><span style="color:var(--text-secondary)">row with meta line</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="lbl" style="width:150px">--appbar-height</span><span style="width:56px;font-variant-numeric:tabular-nums">52px</span><span style="color:var(--text-secondary)">top bar</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="lbl" style="width:150px">--tabbar-height</span><span style="width:56px;font-variant-numeric:tabular-nums">64px</span><span style="color:var(--text-secondary)">bottom nav</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="lbl" style="width:150px">--tap-min</span><span style="width:56px;font-variant-numeric:tabular-nums">44px</span><span style="color:var(--text-secondary)">absolute minimum tap target</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="lbl" style="width:150px">--content-max</span><span style="width:56px;font-variant-numeric:tabular-nums">520px</span><span style="color:var(--text-secondary)">readable measure on wide screens</span></div></div></div><script>
(function(){
  var root=document.querySelector("[data-ds-theme-root]");
  document.querySelectorAll(".ds-theme-tg button").forEach(function(b){
    b.addEventListener("click",function(){
      var t=b.dataset.set;
      root.setAttribute("data-theme",t);
      document.documentElement.setAttribute("data-theme",t);
      document.querySelectorAll(".ds-theme-tg button").forEach(function(x){
        var on=x.dataset.set===t;
        x.setAttribute("aria-pressed",String(on));
        x.style.background=on?"var(--surface-inverse)":"transparent";
        x.style.color=on?"var(--text-inverse)":"var(--text-secondary)";
      });
    });
  });
})();
</script></body></html>
