<!-- @dsCard group="Brand" viewport="700x208" name="Mark at size" subtitle="64 · 40 · 28 · 20 · 16px, and the app icon" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css?v=1786472643305"><style>body{margin:0;padding:0;background:var(--surface-page)}.r{display:flex;align-items:flex-end;gap:34px}.c{display:flex;flex-direction:column;align-items:center;gap:10px}.lbl{font:var(--text-numeric-role);font-size:11px;color:var(--text-tertiary)}</style></head><body><div data-ds-theme-root data-theme="light" style="background:var(--surface-page);color:var(--text-primary);padding:20px;min-height:100%;box-sizing:border-box"><div class="ds-theme-tg" role="group" aria-label="Theme" style="display:flex;border:1px solid var(--border-hairline);border-radius:var(--radius-pill);overflow:hidden;width:max-content;margin-bottom:14px">
<button type="button" data-set="light" aria-pressed="true" style="border:none;cursor:pointer;height:24px;padding:0 12px;font:var(--weight-medium) 11px/1 var(--font-core);background:var(--surface-inverse);color:var(--text-inverse)">Light</button>
<button type="button" data-set="dark" aria-pressed="false" style="border:none;cursor:pointer;height:24px;padding:0 12px;font:var(--weight-medium) 11px/1 var(--font-core);background:transparent;color:var(--text-secondary)">Dark</button>
</div>
<div class="r">
<div class="c"><img src="../assets/mark.svg" width="64" height="64" alt=""><span class="lbl">64</span></div><div class="c"><img src="../assets/mark.svg" width="40" height="40" alt=""><span class="lbl">40</span></div><div class="c"><img src="../assets/mark.svg" width="28" height="28" alt=""><span class="lbl">28</span></div><div class="c"><img src="../assets/mark.svg" width="20" height="20" alt=""><span class="lbl">20</span></div><div class="c"><img src="../assets/mark.svg" width="16" height="16" alt=""><span class="lbl">16</span></div>
<div class="c"><img src="../assets/app-icon.svg" width="64" height="64" alt=""><span class="lbl">app icon</span></div>
<div class="c" style="align-items:flex-start;max-width:210px"><span class="lbl" style="line-height:1.5">16px is the floor. Below it, drop the mark and set the wordmark alone.</span></div>
</div>
</div><script>
(function(){
  var root=document.querySelector("[data-ds-theme-root]");
  document.querySelectorAll(".ds-theme-tg button").forEach(function(b){
    b.addEventListener("click",function(){
      var t=b.dataset.set;
      root.setAttribute("data-theme",t);
      document.documentElement.setAttribute("data-theme",t);
      document.querySelectorAll(".ds-theme-tg button").forEach(function(x){
        var on=x.dataset.set===t;
        x.setAttribute("aria-pressed",String(on));
        x.style.background=on?"var(--surface-inverse)":"transparent";
        x.style.color=on?"var(--text-inverse)":"var(--text-secondary)";
      });
    });
  });
})();
</script></body></html>
