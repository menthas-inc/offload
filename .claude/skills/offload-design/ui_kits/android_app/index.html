<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>offload, Android</title>

<style>
@keyframes offload-rec-pulse{0%,100%{opacity:1}50%{opacity:.25}}
/* Material motion: shared axis X for hierarchy, fade through between peers, and the tick
   that draws itself. Emphasized decelerate for entrances, standard for the fade. */
@keyframes a-in-x{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes a-in-x-back{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
@keyframes a-through-in{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.no-bar::-webkit-scrollbar{display:none}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--surface-sunken);padding:16px 0}
/* The Material surface roles, derived from offload's own neutrals so the brand still owns
   the palette. Containers step up from the page; nothing is moss-tinted. */
[data-platform="android"]{
  --a-surface:var(--surface-page);
  --a-c-low:#F6F5F2;--a-c:#ECEBE7;--a-c-high:#E4E3DE;
  --a-outline:#DEDDD8;--a-on:#1B1B1A;--a-on-var:#5A5A57;--a-on-quiet:#8A8A86;
  /* Material's shape scale replaces offload's radii inside the Android kit. */
  --radius-xs:4px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:28px;
  --radius-card:12px;--radius-sheet:28px;--radius-field:8px;
  --appbar-height:64px;--row-height:56px;--row-height-lg:72px;
}
[data-platform="android"][data-theme="dark"]{
  --a-c-low:#232220;--a-c:#2A2927;--a-c-high:#333230;
  --a-outline:#3A3937;--a-on:#EDEDED;--a-on-var:#B3B3B3;--a-on-quiet:#8B8B87;
}
</style>
