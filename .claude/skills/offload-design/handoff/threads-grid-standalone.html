document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html data-theme=\"light\"><head><meta charset=\"utf-8\"><title>My threads, for approval<\u002Ftitle>\n<style>/* offload webfonts. Two faces only, served as static instances from assets/fonts, the same\n   five files and the same five rules the web app declares (22 September 2026). Instrument Sans\n   is the whole interface; Literata is the voice offload speaks in. Numerals use Instrument Sans\n   with tabular figures, so there is no third face.\n   Static instances lose two things the variable CDN files had: Instrument Sans has no 700, so\n   anything asking for bold resolves to 600; and Literata has no optical size axis, so the\n   display sizes of the serif are drawn from the text master until the variable file is in. */\n@font-face{font-family:\"Instrument Sans\";src:url(\"2c363fa9-1a7d-4f92-b448-b9a9b8ad9de9\") format(\"truetype\");font-weight:400;font-style:normal;font-display:swap}\n@font-face{font-family:\"Instrument Sans\";src:url(\"f73a726c-072d-4de3-8f54-7b0284362469\") format(\"truetype\");font-weight:500;font-style:normal;font-display:swap}\n@font-face{font-family:\"Instrument Sans\";src:url(\"410a6ece-ee40-460c-9cfc-7e3f6bbedb8c\") format(\"truetype\");font-weight:600 700;font-style:normal;font-display:swap}\n@font-face{font-family:\"Literata\";src:url(\"e6ac3bd5-2cdb-4d2a-8d29-8cf5154d3416\") format(\"truetype\");font-weight:400;font-style:normal;font-display:swap}\n@font-face{font-family:\"Literata\";src:url(\"139cf2be-0bd8-45f4-85c6-c43293d4c5d4\") format(\"truetype\");font-weight:500 700;font-style:normal;font-display:swap}\n\n:root{\n  /* Base neutrals, pure achromatic. offload is black on white; grey does the work. */\n  --paper:#FFFFFF;\n  --ink-50:#F8F8F8;\n  --ink-100:#F2F2F2;\n  --ink-150:#EAEAEA;\n  --ink-200:#DEDEDE;\n  --ink-300:#C4C4C4;\n  --ink-400:#9E9E9E;\n  --ink-500:#7A7A7A;\n  --ink-600:#5C5C5C;\n  --ink-700:#3A3A3A;\n  --ink-800:#232323;\n  --ink-900:#141414;\n  --ink-950:#0B0B0B;\n\n  /* Accent, moss. One accent only, used at low volume. */\n  --moss-50:#F2F6F3;\n  --moss-100:#E4EDE7;\n  --moss-200:#C7DACD;\n  --moss-500:#4E8060;\n  --moss-600:#3F6B4F;\n  --moss-700:#2F5240;\n\n  /* Second accent, ink blue. Cool, so it never competes with moss.\n     One job: this needs you. Waiting, unresolved, or about to expire. */\n  --blue-50:#F4F7FF;\n  --blue-100:#E8EEFF;\n  --blue-200:#C9D6FA;\n  --blue-500:#4A68DE;\n  --blue-600:#3355D6;\n  --blue-700:#2440A8;\n  --blue-900:#1B2E7A;\n\n  /* Semantics, pitched at the same depth and saturation as the two accents,\n     so a warning sits beside moss and blue without looking washed out. */\n  --amber-100:#FFF1CC;\n  --amber-600:#F0A81E;\n  --amber-700:#7A4E02;\n  --amber-on:#0B0B0B; /* text colour on --amber-600, ink, never white */\n  --text-on-solid:#FFFFFF; /* text on moss/blue/clay fills, identical in both themes */\n  --clay-100:#FBE6E1;\n  --clay-200:#F3C6BC;\n  --clay-600:#C0392B;\n  --clay-700:#93261A;\n\n  /* Semantic aliases, always prefer these in components. */\n  --text-primary:var(--ink-950);\n  --text-secondary:var(--ink-600);\n  --text-tertiary:#6E6E6E; /* 4.5:1 on every light surface; --ink-400 was 2.55 and failed */\n  --text-inverse:var(--paper);\n  --text-accent:var(--moss-600);\n  --text-attention:var(--blue-600);\n  --text-on-attention:var(--blue-900);\n  --text-link:var(--ink-950);\n  --text-danger:var(--clay-600);\n\n  --surface-page:#FAF9F7;\n  --surface-raised:var(--paper);\n  /* The phone's bottom plate and a raised conversation: the ground the prism\n     field sits on, and by definition the colour its veil is made of. Kept as\n     one token so the two can never disagree. */\n  --surface-plate:var(--paper);\n  /* Today's prism field and the frosted plate (19 October 2026). */\n  --today-field-alpha:0.35; /* @kind other */\n  --glass-tint-rgb:255 255 255;--glass-tint-top:0.45;--glass-tint-mid:0.55;--glass-tint-base:0.85;--glass-sheet:0.80; /* @kind other */\n  --surface-sunken:var(--ink-50);\n  --surface-card:var(--paper);\n  --surface-fill:var(--ink-100);\n  --surface-fill-strong:var(--ink-150);\n  --surface-inverse:var(--ink-950);\n  --surface-accent-soft:var(--moss-50);\n  --surface-attention-soft:var(--blue-100);\n  --surface-attention:var(--blue-600);\n  /* Amber has meant \"offload noticed this\" since the kits drew a Noticed\n     memory, and had no alias to say so: every use reached for the ramp, which\n     the rules forbid and the lint file could not catch because there was\n     nothing to point at. 015's rail is the second surface to need it, so the\n     alias is the fix rather than a third literal. */\n  --surface-noticed:var(--amber-600);\n  /* 023's date chip: the two soft grounds a row's nearness is drawn on. Amber\n     rather than blue for soon, because blue is the attention colour and would\n     read as offload asking for something; clay for late, the pair a failure\n     already uses. Minted because the ramps had no alias and code may not\n     consume a ramp. */\n  --surface-noticed-soft:var(--amber-100);\n  --surface-danger-soft:var(--clay-100);\n  /* The one solid clay: the confirm button of a destructive dialog and the phones' destructive\n     pill (034, 035). Clay 600 in both themes, so --text-on-solid holds at 5.4:1; hover goes darker\n     in both, since dark's --clay-700 is a light tint for text. */\n  --surface-danger:var(--clay-600);--surface-danger-hover:#93261A;\n  --surface-scrim:rgba(11,11,11,0.35);\n  --surface-scrim-soft:rgba(11,11,11,0.16);\n  --surface-chrome:var(--surface-raised);\n  --surface-input:var(--ink-100);\n  --surface-chrome-strong:var(--surface-raised);\n\n  --border-hairline:var(--ink-150);\n  --border-strong:#8C8C8C; /* 3:1 on every light surface: fields, checkboxes, outlined buttons */\n  --border-focus:var(--blue-500);\n  --border-accent:var(--moss-200);\n  --border-attention:var(--blue-200);\n  --border-danger:var(--clay-200);\n  /* The edge of a raised cell that has to read at 49px. Light leans on the drop shadow and\n     takes the hairline; dark has no drop shadow, so the edge carries the card alone and\n     needs a step more. One alias so the two themes cannot drift apart by hand. */\n  --border-lift:var(--border-hairline);\n  /* A day, or a thing, carrying something that needs an answer. The ink amber in each\n     scope rather than the fill: --amber-600 as a 1px ring on paper measures 2.03:1. */\n  --border-decision:var(--amber-700);\n  /* The ink-weight counterpart to --surface-noticed, for a mark offload noticed drawn on a\n     raised surface rather than as a fill: --surface-noticed measures 2.03:1 on paper. Sits\n     beside its surface token the way --text-accent sits beside --surface-accent-soft. */\n  --text-noticed:var(--amber-700);\n  /* The plane a photo is shown on, over whatever was on screen. Not --surface-scrim, which\n     is 0.35 and dims what is behind it: this is a surface in its own right. Light dims\n     towards ink and reads as depth. Dark is OPAQUE, because a translucent plane in dark has\n     nowhere to go: --surface-page at 92% over --surface-page measures 1.00:1, and even the\n     darkest value reaches only 1.11:1. What says a viewer is open there is that the screen\n     behind it is gone. */\n  --surface-viewer:color-mix(in srgb,var(--surface-inverse) 90%,transparent);\n\n  --state-hover:rgba(11,11,11,0.04);\n  --state-press:rgba(11,11,11,0.08);\n  --state-selected:var(--ink-100);\n  --state-disabled-text:var(--ink-400);\n  --state-disabled-surface:var(--ink-100);\n\n  /* Edges, 7 October 2026. The line a surface draws round itself so it can be found on a dark page.\n     Transparent in light, where the drop shadow and the paper do this already, so a component paints\n     its edge in both themes and light does not move. Dark sets each one. --edge-hue is the share of a\n     kind's or label's own hue in its ring, 0% here. */\n  --edge-card:transparent;--edge-well:transparent;--edge-noticed:transparent;--edge-danger:transparent;\n  --edge-accent:transparent;--edge-attention:transparent;--edge-hue:0%;--hue-ink-mix:78%;\n}\n\n\n/* Light, restated as a scope so a document can pin itself to it. Same values as\n   :root; needed because the semantic aliases resolve where they are declared. */\n[data-theme=\"light\"]{\n  --paper:#FFFFFF;\n  --ink-50:#F8F8F8;--ink-100:#F2F2F2;--ink-150:#EAEAEA;--ink-200:#DEDEDE;--ink-300:#C4C4C4;\n  --ink-400:#9E9E9E;--ink-500:#7A7A7A;--ink-600:#5C5C5C;--ink-700:#3A3A3A;--ink-800:#232323;\n  --ink-900:#141414;--ink-950:#0B0B0B;\n  --moss-50:#F2F6F3;--moss-100:#E4EDE7;--moss-200:#C7DACD;--moss-500:#4E8060;--moss-600:#3F6B4F;--moss-700:#2F5240;\n  --blue-50:#F4F7FF;--blue-100:#E8EEFF;--blue-200:#C9D6FA;--blue-500:#4A68DE;--blue-600:#3355D6;\n  --blue-700:#2440A8;--blue-900:#1B2E7A;\n  --amber-100:#FFF1CC;--amber-600:#F0A81E;--amber-700:#7A4E02;--amber-on:#0B0B0B;--text-on-solid:#FFFFFF;\n  --clay-100:#FBE6E1;--clay-200:#F3C6BC;--clay-600:#C0392B;--clay-700:#93261A;\n  --text-primary:var(--ink-950);--text-secondary:var(--ink-600);--text-tertiary:#6E6E6E; /* 4.5:1 on every light surface; --ink-400 was 2.55 and failed */\n  --text-inverse:var(--paper);--text-accent:var(--moss-600);--text-attention:var(--blue-600);\n  --text-on-attention:var(--blue-900);--text-link:var(--ink-950);--text-danger:var(--clay-600);\n  --surface-page:#FAF9F7;--surface-raised:var(--paper);--surface-plate:var(--paper);--surface-sunken:var(--ink-50);\n  --surface-card:var(--paper);--surface-fill:var(--ink-100);--surface-fill-strong:var(--ink-150);\n  --surface-inverse:var(--ink-950);--surface-accent-soft:var(--moss-50);\n  --surface-attention-soft:var(--blue-100);--surface-attention:var(--blue-600);\n  --surface-noticed:var(--amber-600);--surface-noticed-soft:var(--amber-100);--surface-danger-soft:var(--clay-100);\n  --surface-danger:var(--clay-600);--surface-danger-hover:#93261A;\n  --surface-scrim:rgba(11,11,11,0.35);--surface-scrim-soft:rgba(11,11,11,0.16);\n  --surface-chrome:var(--surface-raised);--surface-chrome-strong:var(--surface-raised);\n  --surface-input:var(--ink-100);\n  --border-hairline:var(--ink-150);--border-strong:#8C8C8C; /* 3:1 on every light surface: fields, checkboxes, outlined buttons */--border-focus:var(--blue-500);\n  --border-accent:var(--moss-200);--border-attention:var(--blue-200);--border-danger:var(--clay-200);\n  --border-lift:var(--border-hairline);--border-decision:var(--amber-700);--text-noticed:var(--amber-700);\n  --surface-viewer:color-mix(in srgb,var(--surface-inverse) 90%,transparent);\n  --state-hover:rgba(11,11,11,0.04);--state-press:rgba(11,11,11,0.08);\n  --state-selected:var(--ink-100);--state-disabled-text:var(--ink-400);--state-disabled-surface:var(--ink-100);\n  --edge-card:transparent;--edge-well:transparent;--edge-noticed:transparent;--edge-danger:transparent;\n  --edge-accent:transparent;--edge-attention:transparent;--edge-hue:0%;--hue-ink-mix:78%;\n  --shadow-1:0 1px 2px rgba(11,11,11,0.04);--shadow-2:0 4px 16px -4px rgba(11,11,11,0.08);\n  --shadow-3:0 12px 32px -8px rgba(11,11,11,0.12);--shadow-sheet:0 -8px 40px -12px rgba(11,11,11,0.14);\n  color-scheme:light;\n}\n\n/* Dark, charcoal with lifted surfaces. Applied by [data-theme=\"dark\"] on <html>,\n   or by the system setting when the app is left on Auto. Every alias is restated\n   so it resolves against these base values rather than the ones on :root. */\n[data-theme=\"dark\"]{\n  --paper:#191919;\n  --ink-50:#212121;--ink-100:#2B2B2B;--ink-150:#333333;--ink-200:#575757;--ink-300:#5C5C5C;\n  --ink-400:#767676;--ink-500:#969696;--ink-600:#B3B3B3;--ink-700:#C2C2C2;--ink-800:#D8D8D8;\n  --ink-900:#E4E4E4;--ink-950:#EDEDED;\n\n  /* The semantics do NOT shift with the theme: a moss chip is the same moss at\n     midnight as at noon. Only the tints (50/100) darken, because a tint is a\n     surface, and a surface has to belong to the page it sits on. */\n  --moss-50:#182E20;--moss-100:#1E3928;--moss-200:#2C5A3F;--moss-500:#4E8060;--moss-600:#3F6B4F;--moss-700:#80B994;\n  --blue-50:#161F42;--blue-100:#1E2A57;--blue-200:#334388;--blue-500:#4A68DE;--blue-600:#3355D6;\n  --blue-700:#8BA1F7;--blue-900:#D6DEFF;\n  --amber-100:#3E2E08;--amber-600:#F0A81E;--amber-700:#F6C86A;--amber-on:#0B0B0B;--text-on-solid:#FFFFFF;\n  --clay-100:#3E1915;--clay-200:#6B2A22;--clay-600:#C0392B;--clay-700:#F9A99E;\n\n  --text-primary:var(--ink-950);--text-secondary:var(--ink-600);--text-tertiary:#A0A0A0; /* 5.4:1 on the fill, 4.9:1 on the input (7 October) */\n  --text-inverse:#191919;--text-accent:#82BC97;--text-attention:#95A9F7;\n  --text-on-attention:#D6DEFF;--text-link:var(--ink-950);--text-danger:#F28679;\n\n  --surface-page:#1A1A19;--surface-raised:#232323;\n  --surface-plate:#0F0F11; /* = --prism-veil-rgb; the plate is darker than a card on purpose */\n  --today-field-alpha:0.26; /* @kind other */\n  --glass-tint-rgb:15 15 17;--glass-tint-top:0.55;--glass-tint-mid:0.65;--glass-tint-base:0.90;--glass-sheet:0.86; /* @kind other */\n  --surface-card:#232323;--surface-sunken:#0E0E0E;\n  --surface-fill:var(--ink-100);--surface-fill-strong:var(--ink-150);--surface-inverse:var(--ink-950);\n  --surface-accent-soft:var(--moss-50);--surface-attention-soft:var(--blue-100);\n  --surface-attention:var(--blue-600);--surface-noticed:var(--amber-600);--surface-noticed-soft:var(--amber-100);\n  --surface-danger-soft:var(--clay-100);--surface-danger:var(--clay-600);--surface-danger-hover:#A3301F;\n  --surface-scrim:rgba(0,0,0,0.55);\n  --surface-scrim-soft:rgba(0,0,0,0.50);\n  --surface-chrome:var(--surface-raised);--surface-chrome-strong:var(--surface-raised);\n  --surface-input:#2E2E2E;\n\n  /* 7 October: dark separates by edges (explorations/dark-contrast.html, option B). The hairline\n     is 1.61:1 on a card where it was 1.15, the lift 2.60:1 on the page where it was 1.94, and the\n     strong border 4.67:1. */\n  --border-hairline:#444444;--border-strong:#8C8C8C;--border-focus:var(--blue-500);\n  --border-accent:var(--moss-200);--border-attention:var(--blue-200);--border-danger:var(--clay-200);\n  --border-lift:#5C5C5C;--border-decision:var(--amber-700);--text-noticed:var(--amber-700);\n  --surface-viewer:var(--surface-plate); /* opaque: a mix of the page measures 1.00:1 against it */\n\n  --state-hover:rgba(255,255,255,0.06);--state-press:rgba(255,255,255,0.10);\n  --state-selected:var(--ink-100);--state-disabled-text:var(--ink-400);--state-disabled-surface:var(--ink-100);\n\n  /* Edges (7 October). A grouped list and a neutral chip take the lift; a well inside a list (a\n     tile, a search field, a segmented track) the hairline; a tinted surface the border of its own\n     hue. The soon and late rings are the chip's words at 38% over its ground, as hex because a\n     phone takes one colour. */\n  --edge-card:var(--border-lift);--edge-well:var(--border-hairline);--edge-noticed:#84682D;--edge-danger:#82423B;\n  --edge-accent:var(--border-accent);--edge-attention:var(--border-attention);--edge-hue:38%;--hue-ink-mix:50%;\n\n  /* Shadows do nothing on dark; surfaces separate by value instead. */\n  --shadow-1:none;--shadow-2:0 1px 0 rgba(255,255,255,0.04);--shadow-3:0 8px 28px rgba(0,0,0,0.6);\n  --shadow-sheet:0 -10px 34px -10px rgba(0,0,0,0.65);\n  color-scheme:dark;\n}\n\n/* Labels, 26 September 2026. Ten solids a person's label is drawn in, with --text-on-solid on\n   every one at 4.6:1 or better. Identical in both themes, as moss and blue are: on the dark page\n   they measure about 3.7:1, which clears the 3:1 a shape needs, and a label's words always sit on\n   the solid, never on the page. The hues keep clear of moss, blue, amber and clay. The number is\n   the order a new label takes the next free one in, spaced so the first three are far apart:\n   cerulean, rose, leaf, grape, copper, teal, fuchsia, olive, iris, jade.\n   --surface-accent is the solid accent as a surface, which two components paint (023). */\n:root,[data-theme=\"light\"],[data-theme=\"dark\"]{\n  --label-1:#0C7BB0;--label-2:#C6467B;--label-3:#5D7F00;--label-4:#8D5CC5;--label-5:#B25D25;\n  --label-6:#088285;--label-7:#AD4EAC;--label-8:#7D7616;--label-9:#6F67CB;--label-10:#06855A;\n  --surface-accent:var(--moss-600);\n}\n\n/* A glyph drawn on a well or beside a row: the app's iconOnWell, in both themes (1 October). */\n:root,[data-theme=\"light\"],[data-theme=\"dark\"]{--icon-on-well:var(--text-secondary)}\n\n/* A thread's ground: the tile on My threads and every ThreadIcon (29 October). Light is the label hue\n   at 0.9 of its lightness and 1.4 of its chroma, clipped to sRGB; dark is the hue at 52% into #1C1B19 in\n   oklch, keeping the label's hue. The glyph and text on it are #FFFFFF in both themes, 5.3:1 or more. */\n:root,[data-theme=\"light\"]{\n  --thread-ground-1:#006AB5;--thread-ground-2:#C8006A;--thread-ground-3:#467200;--thread-ground-4:#8532CE;--thread-ground-5:#B23800;\n  --thread-ground-6:#00777C;--thread-ground-7:#AB04AC;--thread-ground-8:#726500;--thread-ground-9:#6047D7;--thread-ground-10:#007B41;\n}\n[data-theme=\"dark\"]{\n  --thread-ground-1:#204B65;--thread-ground-2:#70334A;--thread-ground-3:#3C4D1D;--thread-ground-4:#533D6F;--thread-ground-5:#663D24;\n  --thread-ground-6:#204E4F;--thread-ground-7:#633662;--thread-ground-8:#4B4820;--thread-ground-9:#444272;--thread-ground-10:#20503A;\n}\n\n:root{\n  --font-core:\"Instrument Sans\",\"Helvetica Neue\",Helvetica,sans-serif;\n  /* The voice offload speaks in. Upright, low contrast, warm, easy to read\n     in a chat, not editorial. */\n  --font-quiet:\"Literata\",Georgia,serif;\n\n  --weight-regular:400;\n  --weight-medium:500;\n  --weight-semibold:600;\n\n  /* Larger text scales type and nothing else: every width, gutter, radius and\n     icon stays a literal pixel. Read this where a one-off literal has to move\n     with the type; the eight size tokens are overridden outright below. */\n  --type-scale:1;\n\n  /* Mobile-first scale. Sizes are literal px, not a ratio. */\n  --size-display:34px;\n  --size-title-1:26px;\n  --size-title-2:21px;\n  --size-title-3:17px;\n  --size-body:16px;\n  --size-body-sm:14px;\n  --size-label:13px;\n  --size-caption:12px;\n\n  --leading-display:1.06;\n  --leading-title:1.2;\n  --leading-body:1.45;\n  --leading-tight:1.3;\n\n  --tracking-display:-0.022em;\n  --tracking-title:-0.014em;\n  --tracking-body:-0.006em;\n  /* No uppercase role remains in the interface. Kept only for a rare tracked-out\n     wordmark or print setting; never for UI labels. */\n  --tracking-caps:0.08em;\n\n  /* Composite text roles */\n  --text-display:var(--weight-semibold) var(--size-display)/var(--leading-display) var(--font-core);\n  --text-title-1:var(--weight-semibold) var(--size-title-1)/var(--leading-title) var(--font-core);\n  --text-title-2:var(--weight-semibold) var(--size-title-2)/var(--leading-title) var(--font-core);\n  --text-title-3:var(--weight-medium) var(--size-title-3)/var(--leading-tight) var(--font-core);\n  --text-body-role:var(--weight-regular) var(--size-body)/var(--leading-body) var(--font-core);\n  --text-body-sm-role:var(--weight-regular) var(--size-body-sm)/var(--leading-tight) var(--font-core);\n  --text-label-role:var(--weight-medium) var(--size-label)/var(--leading-tight) var(--font-core);\n  --text-caption-role:var(--weight-regular) var(--size-caption)/var(--leading-tight) var(--font-core);\n  --text-quiet-role:var(--weight-regular) var(--size-body)/var(--leading-body) var(--font-quiet);\n  /* Numerals. No mono face, Instrument Sans with tabular figures, so\n     timestamps and counts hold their column. */\n  --text-numeric-role:var(--weight-regular) var(--size-caption)/var(--leading-tight) var(--font-core);\n}\n\n/* Larger text, the Settings choice. Whole pixels at 1.15 rather than calc() on\n   the base sizes: the token generator resolves values for clients that cannot\n   follow a var(), and React Native cannot parse a calc. Scoped without :root on\n   purpose, since the generator reads every :root block as the light theme and\n   would take these as the b
