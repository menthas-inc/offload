  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n  font-family: 'Literata';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"ce148fb9-8a2f-46a9-a5f5-fab1bb31e293\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek-ext */\n@font-face {\n  font-family: 'Literata';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"35b03328-1731-4cac-b147-8a8fdb7dcf5d\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font-face {\n  font-family: 'Literata';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"06ac3f3a-7c71-49b3-950e-8db040d835a7\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Literata';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"cfb32892-61f5-44b2-a747-a046c4717255\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Literata';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"5f3e5551-91ca-4311-a2b6-d19e20ff5291\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Literata';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"30cb9703-6a7d-49d3-a5cd-aa3cb5c8a443\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root{\n  /* Base neutrals, pure achromatic. offload is black on white; grey does the work. */\n  --paper:#FFFFFF;\n  --ink-50:#F8F8F8;\n  --ink-100:#F2F2F2;\n  --ink-150:#EAEAEA;\n  --ink-200:#DEDEDE;\n  --ink-300:#C4C4C4;\n  --ink-400:#9E9E9E;\n  --ink-500:#7A7A7A;\n  --ink-600:#5C5C5C;\n  --ink-700:#3A3A3A;\n  --ink-800:#232323;\n  --ink-900:#141414;\n  --ink-950:#0B0B0B;\n\n  /* Accent, moss. One accent only, used at low volume. */\n  --moss-50:#F2F6F3;\n  --moss-100:#E4EDE7;\n  --moss-200:#C7DACD;\n  --moss-500:#4E8060;\n  --moss-600:#3F6B4F;\n  --moss-700:#2F5240;\n\n  /* Second accent, ink blue. Cool, so it never competes with moss.\n     One job: this needs you. Waiting, unresolved, or about to expire. */\n  --blue-50:#F4F7FF;\n  --blue-100:#E8EEFF;\n  --blue-200:#C9D6FA;\n  --blue-500:#4A68DE;\n  --blue-600:#3355D6;\n  --blue-700:#2440A8;\n  --blue-900:#1B2E7A;\n\n  /* Semantics, pitched at the same depth and saturation as the two accents,\n     so a warning sits beside moss and blue without looking washed out. */\n  --amber-100:#FFF1CC;\n  --amber-600:#F0A81E;\n  --amber-700:#7A4E02;\n  --amber-on:#0B0B0B; /* text colour on --amber-600, ink, never white */\n  --text-on-solid:#FFFFFF; /* text on moss/blue/clay fills, identical in both themes */\n  --clay-100:#FBE6E1;\n  --clay-200:#F3C6BC;\n  --clay-600:#C0392B;\n  --clay-700:#93261A;\n\n  /* Semantic aliases, always prefer these in components. */\n  --text-primary:var(--ink-950);\n  --text-secondary:var(--ink-600);\n  --text-tertiary:#6E6E6E; /* 4.5:1 on every light surface; --ink-400 was 2.55 and failed */\n  --text-inverse:var(--paper);\n  --text-accent:var(--moss-600);\n  --text-attention:var(--blue-600);\n  --text-on-attention:var(--blue-900);\n  --text-link:var(--ink-950);\n  --text-danger:var(--clay-600);\n\n  --surface-page:#FAF9F7;\n  --surface-raised:var(--paper);\n  /* The phone's bottom plate and a raised conversation: the ground the prism\n     field sits on, and by definition the colour its veil is made of. Kept as\n     one token so the two can never disagree. */\n  --surface-plate:var(--paper);\n  --surface-sunken:var(--ink-50);\n  --surface-card:var(--paper);\n  --surface-fill:var(--ink-100);\n  --surface-fill-strong:var(--ink-150);\n  --surface-inverse:var(--ink-950);\n  --surface-accent-soft:var(--moss-50);\n  --surface-attention-soft:var(--blue-100);\n  --surface-attention:var(--blue-600);\n  /* Amber has meant \"offload noticed this\" since the kits drew a Noticed\n     memory, and had no alias to say so: every use reached for the ramp, which\n     the rules forbid and the lint file could not catch because there was\n     nothing to point at. 015's rail is the second surface to need it, so the\n     alias is the fix rather than a third literal. */\n  --surface-noticed:var(--amber-600);\n  --surface-scrim:rgba(11,11,11,0.32);\n  --surface-scrim-soft:rgba(11,11,11,0.16);\n  --surface-chrome:var(--surface-raised);\n  --surface-input:var(--ink-100);\n  --surface-chrome-strong:var(--surface-raised);\n\n  --border-hairline:var(--ink-150);\n  --border-strong:#8C8C8C; /* 3:1 on every light surface: fields, checkboxes, outlined buttons */\n  --border-focus:var(--blue-500);\n  --border-accent:var(--moss-200);\n  --border-attention:var(--blue-200);\n  --border-danger:var(--clay-200);\n  /* The edge of a raised cell that has to read at 49px. Light leans on the drop shadow and\n     takes the hairline; dark has no drop shadow, so the edge carries the card alone and\n     needs a step more. One alias so the two themes cannot drift apart by hand. */\n  --border-lift:var(--border-hairline);\n  /* A day, or a thing, carrying something that needs an answer. The ink amber in each\n     scope rather than the fill: --amber-600 as a 1px ring on paper measures 2.03:1. */\n  --border-decision:var(--amber-700);\n  /* The ink-weight counterpart to --surface-noticed, for a mark offload noticed drawn on a\n     raised surface rather than as a fill: --surface-noticed measures 2.03:1 on paper. Sits\n     beside its surface token the way --text-accent sits beside --surface-accent-soft. */\n  --text-noticed:var(--amber-700);\n  /* The plane a photo is shown on, over whatever was on screen. Not --surface-scrim, which\n     is 0.32 and dims what is behind it: this is a surface in its own right. Light dims\n     towards ink and reads as depth. Dark is OPAQUE, because a translucent plane in dark has\n     nowhere to go: --surface-page at 92% over --surface-page measures 1.00:1, and even the\n     darkest value reaches only 1.11:1. What says a viewer is open there is that the screen\n     behind it is gone. */\n  --surface-viewer:color-mix(in srgb,var(--surface-inverse) 90%,transparent);\n\n  --state-hover:rgba(11,11,11,0.04);\n  --state-press:rgba(11,11,11,0.08);\n  --state-selected:var(--ink-100);\n  --state-disabled-text:var(--ink-400);\n  --state-disabled-surface:var(--ink-100);\n}\n\n\n/* Light, restated as a scope so a document can pin itself to it. Same values as\n   :root; needed because the semantic aliases resolve where they are declared. */\n[data-theme=\"light\"]{\n  --paper:#FFFFFF;\n  --ink-50:#F8F8F8;--ink-100:#F2F2F2;--ink-150:#EAEAEA;--ink-200:#DEDEDE;--ink-300:#C4C4C4;\n  --ink-400:#9E9E9E;--ink-500:#7A7A7A;--ink-600:#5C5C5C;--ink-700:#3A3A3A;--ink-800:#232323;\n  --ink-900:#141414;--ink-950:#0B0B0B;\n  --moss-50:#F2F6F3;--moss-100:#E4EDE7;--moss-200:#C7DACD;--moss-500:#4E8060;--moss-600:#3F6B4F;--moss-700:#2F5240;\n  --blue-50:#F4F7FF;--blue-100:#E8EEFF;--blue-200:#C9D6FA;--blue-500:#4A68DE;--blue-600:#3355D6;\n  --blue-700:#2440A8;--blue-900:#1B2E7A;\n  --amber-100:#FFF1CC;--amber-600:#F0A81E;--amber-700:#7A4E02;--amber-on:#0B0B0B;--text-on-solid:#FFFFFF;\n  --clay-100:#FBE6E1;--clay-200:#F3C6BC;--clay-600:#C0392B;--clay-700:#93261A;\n  --text-primary:var(--ink-950);--text-secondary:var(--ink-600);--text-tertiary:#6E6E6E; /* 4.5:1 on every light surface; --ink-400 was 2.55 and failed */\n  --text-inverse:var(--paper);--text-accent:var(--moss-600);--text-attention:var(--blue-600);\n  --text-on-attention:var(--blue-900);--text-link:var(--ink-950);--text-danger:var(--clay-600);\n  --surface-page:#FAF9F7;--surface-raised:var(--paper);--surface-plate:var(--paper);--surface-sunken:var(--ink-50);\n  --surface-card:var(--paper);--surface-fill:var(--ink-100);--surface-fill-strong:var(--ink-150);\n  --surface-inverse:var(--ink-950);--surface-accent-soft:var(--moss-50);\n  --surface-attention-soft:var(--blue-100);--surface-attention:var(--blue-600);\n  --surface-noticed:var(--amber-600);\n  --surface-scrim:rgba(11,11,11,0.32);--surface-scrim-soft:rgba(11,11,11,0.16);\n  --surface-chrome:var(--surface-raised);--surface-chrome-strong:var(--surface-raised);\n  --surface-input:var(--ink-100);\n  --border-hairline:var(--ink-150);--border-strong:#8C8C8C; /* 3:1 on every light surface: fields, checkboxes, outlined buttons */--border-focus:var(--blue-500);\n  --border-accent:var(--moss-200);--border-attention:var(--blue-200);--border-danger:var(--clay-200);\n  --border-lift:var(--border-hairline);--border-decision:var(--amber-700);--text-noticed:var(--amber-700);\n  --surface-viewer:color-mix(in srgb,var(--surface-inverse) 90%,transparent);\n  --state-hover:rgba(11,11,11,0.04);--state-press:rgba(11,11,11,0.08);\n  --state-selected:var(--ink-100);--state-disabled-text:var(--ink-400);--state-disabled-surface:var(--ink-100);\n  --shadow-1:0 1px 2px rgba(11,11,11,0.04);--shadow-2:0 4px 16px -4px rgba(11,11,11,0.08);\n  --shadow-3:0 12px 32px -8px rgba(11,11,11,0.12);--shadow-sheet:0 -8px 40px -12px rgba(11,11,11,0.14);\n  color-scheme:light;\n}\n\n/* Dark, charcoal with lifted surfaces. Applied by [data-theme=\"dark\"] on <html>,\n   or by the system setting when the app is left on Auto. Every alias is restated\n   so it resolves against these base values rather than the ones on :root. */\n[data-theme=\"dark\"]{\n  --paper:#191919;\n  --ink-50:#212121;--ink-100:#232323;--ink-150:#2C2C2C;--ink-200:#383838;--ink-300:#4A4A4A;\n  --ink-400:#767676;--ink-500:#969696;--ink-600:#B3B3B3;--ink-700:#C2C2C2;--ink-800:#D8D8D8;\n  --ink-900:#E4E4E4;--ink-950:#EDEDED;\n\n  /* The semantics do NOT shift with the theme: a moss chip is the same moss at\n     midnight as at noon. Only the tints (50/100) darken, because a tint is a\n     surface, and a surface has to belong to the page it sits on. */\n  --moss-50:#182E20;--moss-100:#1E3928;--moss-200:#2C5A3F;--moss-500:#4E8060;--moss-600:#3F6B4F;--moss-700:#5A8E6C;\n  --blue-50:#161F42;--blue-100:#1E2A57;--blue-200:#334388;--blue-500:#4A68DE;--blue-600:#3355D6;\n  --blue-700:#5273E8;--blue-900:#D6DEFF;\n  --amber-100:#3E2E08;--amber-600:#F0A81E;--amber-700:#F6C86A;--amber-on:#0B0B0B;--text-on-solid:#FFFFFF;\n  --clay-100:#3E1915;--clay-200:#6B2A22;--clay-600:#C0392B;--clay-700:#F9A99E;\n\n  --text-primary:var(--ink-950);--text-secondary:var(--ink-600);--text-tertiary:#959595; /* 4.5:1 on every dark surface, including the input */\n  --text-inverse:#191919;--text-accent:#82BC97;--text-attention:#95A9F7;\n  --text-on-attention:#D6DEFF;--text-link:var(--ink-950);--text-danger:#F28679;\n\n  --surface-page:#1C1B19;--surface-raised:#212121;\n  --surface-plate:#0F0F11; /* = --prism-veil-rgb; the plate is darker than a card on purpose */\n  --surface-card:#212121;--surface-sunken:#101010;\n  --surface-fill:var(--ink-100);--surface-fill-strong:var(--ink-150);--surface-inverse:var(--ink-950);\n  --surface-accent-soft:var(--moss-50);--surface-attention-soft:var(--blue-100);\n  --surface-attention:var(--blue-600);--surface-noticed:var(--amber-600);--surface-scrim:rgba(0,0,0,0.55);\n  --surface-scrim-soft:rgba(0,0,0,0.50);\n  --surface-chrome:var(--surface-raised);--surface-chrome-strong:var(--surface-raised);\n  --surface-input:#2E2E2E;\n\n  --border-hairline:var(--ink-150);--border-strong:#777777;--border-focus:var(--blue-500);\n  --border-accent:var(--moss-200);--border-attention:var(--blue-200);--border-danger:var(--clay-200);\n  /* A step up from the hairline, because dark has no drop shadow: --shadow-1 is -align:left;font:var(--weight-semibold) 12px/1.3 var(--font-core);color:var(--text-tertiary);border-bottom:1px solid var(--ink-950);padding:0 18px 7px 0}\ntable.mx td{vertical-align:top;padding:9px 18px 9px 0;border-bottom:1px solid var(--border-hairline);color:var(--text-secondary);line-height:1.5}\ntable.mx td code{font-size:12px}\ntable.mx td.no{color:var(--text-danger)}\n.cell>.spec{max-width:390px}\n<\u002Fstyle>\n\n<\u002Fhead><body><div class=\"wrap\">\n\n<h1>Due dates, and the notifications that read them<\u002Fh1>\n<p class=\"lede\">Read off <code>main<\u002Fcode> at <code>b494d0e<\u002Fcode>, after 021 and the sharing work. Three questions in order: what carries a date today and who writes it, how a person sets one, and what offload says when the day comes. <b>Third pass. Every question this page raised has been answered<\u002Fb> and the answers are folded in and marked <span class=\"verdict yes\" style=\"vertical-align:middle\">settled<\u002Fspan>. What is left is a handoff, not a decision.<\u002Fp>\n<p class=\"lede\">The finding that shapes the rest: <b>the schema has carried dates since 001 and no person has ever been able to write one.<\u002Fb> Every date in the product was inferred by a model from something somebody dumped. There is no field, no picker, no gesture and no way to clear one on any of the three surfaces. Notifications are the forcing function, because a notification fires off a date, and a date nobody can correct is a notification nobody can stop.<\u002Fp>\n\n<div class=\"sechead\"><h2>1. What carries a date now<\u002Fh2><u>read off the schema, the tools and the clients<\u002Fu><\u002Fdiv>\n<p class=\"snote\">Four columns on <code>content<\u002Fcode>, the same four on <code>notes<\u002Fcode>, and one flag. Nothing here is new work; it is the ground the rest of the page stands on.<\u002Fp>\n<table class=\"mx\">\n<tbody><tr><th>Column<\u002Fth><th>What it means<\u002Fth><th>Who writes it<\u002Fth><th>What draws it<\u002Fth><\u002Ftr>\n<tr><td><code>due_at<\u002Fcode><\u002Ftd><td>The day a task is wanted by. Stored as a timestamp, but a bare day is filed at <b>noon UTC<\u002Fb> and must be drawn as a day.<\u002Ftd><td><code>add_content<\u002Fcode> at filing, <code>edit_content<\u002Fcode> since 019, and 018's asking-back question, which sets it <b>only when it is null<\u002Fb>.<\u002Ftd><td class=\"no\">The web Timeline, as the bare word <b>due<\u002Fb>. Widgets. <b>Not the thread's own rows.<\u002Fb><\u002Ftd><\u002Ftr>\n<tr><td><code>occurs_at<\u002Fcode><br><code>occurs_end_at<\u002Fcode><\u002Ftd><td>When an event happens, and when it stops. The pair is already a duration.<\u002Ftd><td>Same three writers, plus <code>create_event<\u002Fcode> reading it to write to Google.<\u002Ftd><td>Timeline, as a time or a range. The calendar. Widgets.<\u002Ftd><\u002Ftr>\n<tr><td><code>attrs.all_day<\u002Fcode><\u002Ftd><td>Set when the model wrote a bare day. 012's own column, reused, so a birthday does not land a day out for half the planet.<\u002Ftd><td>Derived on the server by <code>isBareDate<\u002Fcode>, never sent by a model.<\u002Ftd><td>Timeline, as <b>All day<\u002Fb>.<\u002Ftd><\u002Ftr>\n<tr><td><code>repeats<\u002Fcode><br><code>repeats_until<\u002Fcode><\u002Ftd><td>Day, weekday, week, two weeks, month, year. One row, drawn on every matching day. <b>Both are replaced by an RRULE<\u002Fb>, section 5.<\u002Ftd><td><code>add_content<\u002Fcode>, <code>add_note<\u002Fcode>. Not <code>edit_content<\u002Fcode>.<\u002Ftd><td>A collapsed row's note line, which says how often instead of naming the one date it happens to hold.<\u002Ftd><\u002Ftr>\n<tr><td><code>is_reminder<\u002Fcode><\u002Ftd><td>A flag on a task or an event, never a type.<\u002Ftd><td><code>add_content<\u002Fcode>, defaulting false. <b>Still only the model.<\u002Fb><\u002Ftd><td><b>The digest, and nothing else.<\u002Fb> Its own comment said nothing acts on it until notifications ship. Section 7 is that.<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<ul class=\"spec\">\n<li><b>Dates are only set when the dump states or implies one.<\u002Fb> That is principle 04, carried in the filing prompt, and it is why most rows have no date at all. It is a good rule and this work must not quietly overturn it.<\u002Fli>\n<li><b>A bare day is noon UTC, and that was a production bug once already.<\u002Fb> Midnight put Sunday brunch under Saturday for everybody west of Greenwich. <code>dates.ts<\u002Fcode> says plainly that noon is right from UTC-11 to UTC+11 and the complete answer is the account's timezone, <b>which the account does not have<\u002Fb>.<\u002Fli>\n<li><b>A date more than ten years out or five years back is refused<\u002Fb>, because a task due in 2126 is invisible rather than wrong-looking.<\u002Fli>\n<li><b>The thread's own content row draws no date.<\u002Fb> Not on the phones, not on web. A task due tomorrow and a task with no date are the same row. Section 4 cannot put a control on a date the row has never shown.<\u002Fli>\n<\u002Ful>\n\n<div class=\"sechead\"><h2>2. One field, called When<\u002Fh2><u>and the row's type decides what it writes<\u002Fu><\u002Fdiv>\n<p class=\"snote\">A person does not hold three date columns in their head. They hold one question, <i>when<\u002Fi>, and sometimes a second, <i>for how long<\u002Fi>. The row already knows which column that means.<\u002Fp>\n<table class=\"mx\">\n<tbody><tr><th>Row type<\u002Fth><th>When writes<\u002Fth><th>Duration<\u002Fth><th>The word on screen<\u002Fth><\u002Ftr>\n<tr><td><code>task<\u002Fcode><\u002Ftd><td><code>due_at<\u002Fcode><\u002Ftd><td>None offered.<\u002Ftd><td><b>Due<\u002Fb> Fri 25, or <b>Due<\u002Fb> Fri 25, 9:00<\u002Ftd><\u002Ftr>\n<tr><td><code>event<\u002Fcode><\u002Ftd><td><code>occurs_at<\u002Fcode><\u002Ftd><td><code>occurs_end_at<\u002Fcode>, offered only once an hour is set.<\u002Ftd><td>Fri 25, 7:00 pm<\u002Ftd><\u002Ftr>\n<tr><td>link, image, file, voice, location<\u002Ftd><td><code>due_at<\u002Fcode><\u002Ftd><td>None offered.<\u002Ftd><td><b>Due<\u002Fb> Fri 25<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<ul class=\"spec\">\n<li><b>Duration already exists and needs no column.<\u002Fb> <code>occurs_end_at<\u002Fcode> is the pair's other half and <code>create_event<\u002Fcode> already falls back to one hour when it is missing. The field offers Ends at, not a length, so the value written is the value stored.<\u002Fli>\n<li><b>A date with no hour stays all-day<\u002Fb>, which is <code>attrs.all_day<\u002Fcode> and the existing <code>isBareDate<\u002Fcode> path. Adding an hour clears it. This is the one part of the model a client can get wrong in a way nobody notices for months.<\u002Fli>\n<li><span class=\"verdict yes\">settled<\u002Fspan> <b>A due date may carry an hour, and <code>dates.ts<\u002Fcode>'s comment is now wrong.<\u002Fb> That comment says a due date has no time anybody expects to see. \"Call the clinic at 9\" and \"rent by Friday\" are both tasks, and the first one has an hour that matters, so the hour is optional on every type. <b>Code owes an amendment to that comment<\u002Fb>, not a new column: the value already fits.<\u002Fli>\n<li><b>The hour is what makes a row sub-day, and nothing else changes.<\u002Fb> An hour clears <code>attrs.all_day<\u002Fcode>; removing it sets it again. A task with an hour still sorts and reads as a task, and the digest still announces it in the morning rather than at the hour, which is section 7's rule.<\u002Fli>\n<li><b>Repeats is set in the same sheet<\u002Fb> and is the one recurrence control there is. It follows Google Calendar's preset list and Custom dialog, which <b>the current <code>repeats<\u002Fcode> column cannot hold<\u002Fb>, so it becomes an RRULE: see the last cell of section 5.<\u002Fli>\n<li><b>No new glyphs.<\u002Fb> Everything here uses <code>calendar<\u002Fcode>, <code>clock<\u002Fcode>, <code>bell<\u002Fcode>, <code>compass<\u002Fcode>, <code>check<\u002Fcode>, <code>chevron-down<\u002Fcode>, <code>chevron-right<\u002Fcode>, <code>x<\u002Fcode>, <code>sunrise<\u002Fcode> and <code>moon<\u002Fcode>, all of them already vendored. The set stays at 84.<\u002Fli>\n<\u002Ful>\n\n<div class=\"sechead\"><h2>3. Which clock<\u002Fh2><u>a default zone, a last-seen zone, and a strip when they disagree<\u002Fu><\u002Fdiv>\n<p class=\"snote\"><code>accounts<\u002Fcode> carries no timezone. Until it does, \"due today\" is a guess and a morning digest cannot pick an hour. The shape below is two columns rather than one, because a person who travels still wants rent on the day rent is due at home.<\u002Fp>\n<table class=\"mx\">\n<tbody><tr><th>Field<\u002Fth><th>Written by<\u002Fth><th>Read by<\u002Fth><\u002Ftr>\n<tr><td><code>time_zone<\u002Fcode>, the default<\u002Ftd><td>Set once at first run from the device. Editable in Settings, and by the strip below.<\u002Ftd><td>Everything that renders or schedules: the digest hour, \"due today\", <code>dates.ts<\u002Fcode>, and the prompt's <b>today<\u002Fb>.<\u002Ftd><\u002Ftr>\n<tr><td><code>last_seen_time_zone<\u002Fcode><\u002Ftd><td>Any authenticated request that carries the device's IANA zone. Written, never acted on.<\u002Ftd><td>Only the comparison. If it equals the default, nothing anywhere changes.<\u002Ftd><\u002Ftr>\n<tr><td><code>follow_device<\u002Fcode>, a preference<\u002Ftd><td>The Settings toggle. On by default.<\u002Ftd><td>Off means <code>last_seen_time_zone<\u002Fcode> is still recorded and never compared, so the strip can never appear.<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<div class=\"row\">\n<div class=\"cell\"><div class=\"tag m\"><b>Today, zones agree<\u002Fb><span>nothing appears, which is the common case<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:420px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar\"><span class=\"lead\"><span class=\"bc\"><i class=\"g i-list\"><\u002Fi><\u002Fspan><\u002Fspan><h4>Today<\u002Fh4><span class=\"tools\"><span class=\"bc\"><i class=\"g i-bell\"><\u002Fi><\u002Fspan><span class=\"bc\"><i class=\"g i-gear\"><\u002Fi><\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"body\">\n<div class=\"sh\"><div><b>To do<\u002Fb><em>3<\u002Fem><s><\u002Fs><\u002Fdiv><\u002Fdiv>\n<div class=\"r two\"><span class=\"grip\"><i class=\"g i-grip\"><\u002Fi><\u002Fspan><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Pay the rent<\u002Fspan><span class=\"wchip soon\"><i class=\"g i-cal\"><\u002Fi>Due Fri 25<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"r two\"><span class=\"grip\"><i class=\"g i-grip\"><\u002Fi><\u002Fspan><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Book the Istanbul stay<\u002Fspan><span class=\"wchip\"><i class=\"g i-cal\"><\u002Fi>Due Mon 28<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"r\"><span class=\"grip\"><i class=\"g i-grip\"><\u002Fi><\u002Fspan><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Ask Tom about the flights<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<ul class=\"spec\"><li>A row with no date shows nothing. <b>An empty dashed slot on every undated row would be a to-do list that nags<\u002Fb>, and principle 04 says a date nobody gave is not a date offload wants.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag m\"><b>Landed somewhere else<\u002Fb><span>the strip, once<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:420px\">\n<div class=\"sb\"><span>17:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar\"><span class=\"lead\"><span class=\"bc\"><i class=\"g i-list\"><\u002Fi><\u002Fspan><\u002Fspan><h4>Today<\u002Fh4><span class=\"tools\"><span class=\"bc\"><i class=\"g i-bell\"><\u002Fi><\u002Fspan><span class=\"bc\"><i class=\"g i-gear\"><\u002Fi><\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"body\">\n<div class=\"tstrip\"><span class=\"tl\"><span class=\"ti\"><i class=\"g i-comp\"><\u002Fi><\u002Fspan><span class=\"tt\">Showing times in <b>Lisbon<\u002Fb>. This phone says <b>Tokyo<\u002Fb>.<\u002Fspan><\u002Fspan><span class=\"ta\"><b>Use Tokyo<\u002Fb><b class=\"q\">Keep Lisbon<\u002Fb><\u002Fspan><\u002Fdiv>\n<div class=\"sh\"><div><b>To do<\u002Fb><em>3<\u002Fem><s><\u002Fs><\u002Fdiv><\u002Fdiv>\n<div class=\"r two\"><span class=\"grip\"><i class=\"g i-grip\"><\u002Fi><\u002Fspan><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Pay the rent<\u002Fspan><span class=\"wchip soon\"><i class=\"g i-cal\"><\u002Fi>Due Fri 25<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"r two\"><span class=\"grip\"><i class=\"g i-grip\"><\u002Fi><\u002Fspan><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Book the Istanbul stay<\u002Fspan><span class=\"wchip\"><i class=\"g i-cal\"><\u002Fi>Due Mon 28<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<span class=\"rec\">recommended<\u002Fspan>\n<ul class=\"spec\">\n<li><b>The two answers are inside the card, and tinted rather than filled.<\u002Fb> A pair of full-width buttons under the strip belongs to the screen, not to the sentence; these are the notification's own treatment, text buttons in <code>--text-accent<\u002Fcode> on the strip's ground, so they can only be read as answering the line above them.<\u002Fli>\n<li><b>Keep Lisbon is the quieter of the two<\u002Fb>, in <code>--text-secondary<\u002Fcode>, because it is the same as doing nothing and should not look like a decision.<\u002Fli>\n<li><b>It states the fact before it offers the change.<\u002Fb> The sentence is what is true right now, not a question, so ignoring it is a complete answer and the dates on the screen already mean what the first line says they mean.<\u002Fli>\n<li><b>Once per zone, not once per day.<\u002Fb> Keep Lisbon remembers the pair, so a two-week trip asks on arrival and stays quiet. A different zone asks again.<\u002Fli>\n<li><b>Use Tokyo rewrites the default<\u002Fb>, which is the honest reading: a person who says yes has moved, as far as the product is concerned, and they can move back the same way.<\u002Fli>\n<li><b>Names, not offsets.<\u002Fb> The IANA zone's city, because UTC+9 is not a thing anybody knows about themselves.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag m\"><b>Settings<\u002Fb><span>the one row that switches it off<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:420px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar hl\"><span class=\"lead\"><span class=\"bc\"><i class=\"g i-chev-l\"><\u002Fi><\u002Fspan><\u002Fspan><h4>Date and time<\u002Fh4><\u002Fdiv>\n<div class=\"body\">\n<div class=\"glab\">YOUR CLOCK<\u002Fdiv>\n<div class=\"sgroup\">\n<div class=\"srow\"><span class=\"txt\"><span class=\"t\">Time zone<\u002Fspan><span class=\"n\">Everything is shown and scheduled in this one.<\u002Fspan><\u002Fspan><span class=\"val\">Lisbon<\u002Fspan><span class=\"cv\"><i class=\"g i-chev-r\"><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"srow\"><span class=\"txt\"><span class=\"t\">Follow this device<\u002Fspan><span class=\"n\">Offer to switch when the phone is somewhere else.<\u002Fspan><\u002Fspan><span class=\"tog\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"glab\">WEEK<\u002Fdiv>\n<div class=\"sgroup\">\n<div class=\"srow\"><span class=\"txt\"><span class=\"t\">Starts on<\u002Fspan><\u002Fspan><span class=\"val\">Monday<\u002Fspan><span class=\"cv\"><i class=\"g i-chev-r\"><\u002Fi><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<ul class=\"spec\">\n<li><b>Follow this device off means the comparison never runs.<\u002Fb> Not that the strip is suppressed: the value is still recorded, so turning it back on works immediately, but nothing reads it.<\u002Fli>\n<li><b>Week starts on<\u002Fb> is here because the month grid in section 5 needs it and there is nowhere else it could live. Default from the device locale.<\u002Fli>\n<li>Reachable from Settings and from the strip's own long-term home. <b>One page, not a row on My account<\u002Fb>, because three settings on one subject is a page.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"sechead\"><h2>4. The date on a row<\u002Fh2><u>what it looks like, and what changes it<\u002Fu><\u002Fdiv>\n<p class=\"snote\">The mobile row's comment is explicit: <b>two controls, never three: edit, and one way out.<\u002Fb> It argues that Archive and Delete are two answers to one question. Any option that adds a third icon is arguing with a rule written after an evening of tidying a list, so it needs to win on more than convenience.<\u002Fp>\n<div class=\"rowlabel\">First, the chip itself<u>three states, and the middle one is the useful one<\u002Fu><\u002Fdiv>\n<div class=\"row\">\n<div class=\"cell\"><div class=\"tag m\"><b>Colour by nearness<\u002Fb><span>today is Tue 22<\u002Fspan><\u002Fdiv>\n<div class=\"crop\"><div class=\"chipset\">\n<div><span class=\"wchip late\"><i class=\"g i-cal\"><\u002Fi>Due Fri 18<\u002Fspan><span class=\"lb\"><b>Late.<\u002Fb> Anything before today.<\u002Fspan><\u002Fdiv>\n<div><span class=\"wchip soon\"><i class=\"g i-cal\"><\u002Fi>Due today<\u002Fspan><span class=\"lb\"><b>Soon.<\u002Fb> Today and the next three days.<\u002Fspan><\u002Fdiv>\n<div><span class=\"wchip soon\"><i class=\"g i-cal\"><\u002Fi>Due Fri 25<\u002Fspan><span class=\"lb\">Still soon, at three days out.<\u002Fspan><\u002Fdiv>\n<div><span class=\"wchip\"><i class=\"g i-cal\"><\u002Fi>Due Mon 28<\u002Fspan><span class=\"lb\"><b>Later.<\u002Fb> Everything past that.<\u002Fspan><\u002Fdiv>\n<div><span class=\"wchip\"><i class=\"g i-cal\"><\u002Fi>12 Nov<\u002Fspan><span class=\"lb\">Far out drops the weekday and gains the month.<\u002Fspan><\u002Fdiv>\n<div><span class=\"wchip soon\"><i class=\"g i-cal\"><\u002Fi>Due Fri 25<i class=\"g bl i-bell\"><\u002Fi><\u002Fspan><span class=\"lb\"><b>Proposed.<\u002Fb> This one is going in a digest.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<ul class=\"spec\">\n<li><b>Late is <code>--clay-100<\u002Fcode> with <code>--text-danger<\u002Fcode><\u002Fb>, the same pair the product already uses for a failure, because a date that has passed is the one state that wants finding.<\u002Fli>\n<li><b>Soon is amber, not blue.<\u002Fb> <code>--amber-100<\u002Fcode> with <code>--amber-700<\u002Fcode>, which is the rail's own decision colour: it lifts off a warm page without claiming anything is wrong. Blue is the product's attention colour and would read as offload asking for something.<\u002Fli>\n<li><b>Later is the plain fill<\u002Fb>, <code>--surface-fill<\u002Fcode> with <code>--text-secondary<\u002Fcode>. Most dated rows are here and they should be quiet: a list where every row is coloured has no colour.<\u002Fli>\n<li><b>Three days, stated.<\u002Fb> Today plus three, in the account's zone from section 3. A boundary nobody writes down becomes a boundary each surface computes differently.<\u002Fli>\n<li><b>A done row loses the colour entirely<\u002Fb> and keeps the plain chip, whatever its date. A ticked task that was late is not late, it is done.<\u002Fli>\n<li><span class=\"ask\">proposed, not asked for<\u002Fspan> <b>The bell mark is the answer to a gap the <code>is_reminder<\u002Fcode> decision opens.<\u002Fb> Section 7 gates the digest on a flag only the model writes, so without a mark the first a person hears of it is the notification, and the two rows that look identical on Tuesday behave differently on Friday. <b>Read-only: it reports the flag, it does not set it.<\u002Fb> A row without the bell is a date; a row with it is a date offload will say out loud.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rowlabel\">Then, what makes it changeable<u>three options<\u002Fu><\u002Fdiv>\n<div class=\"row\">\n<div class=\"cell\"><div class=\"tag m\"><b>A<\u002Fb><span>inside the edit sheet only<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:400px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar hl\"><span class=\"lead\"><span class=\"bc\"><i class=\"g i-chev-l\"><\u002Fi><\u002Fspan><\u002Fspan><h4>Lisbon trip<\u002Fh4><\u002Fdiv>\n<div class=\"body\">\n<div class=\"r two\"><span class=\"grip\"><i class=\"g i-grip\"><\u002Fi><\u002Fspan><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Pay the rent<\u002Fspan><span class=\"wchip soon\"><i class=\"g i-cal\"><\u002Fi>Due Fri 25<\u002Fspan><\u002Fspan><span class=\"tools\"><i class=\"g i-pencil\"><\u002Fi><i class=\"g i-trash\"><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"r two\"><span class=\"grip\"><i class=\"g i-grip\"><\u002Fi><\u002Fspan><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Book the Istanbul stay<\u002Fspan><span class=\"wchip\"><i class=\"g i-cal\"><\u002Fi>Due Mon 28<\u002Fspan><\u002Fspan><span class=\"tools\"><i class=\"g i-pencil\"><\u002Fi><i class=\"g i-trash\"><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"r\"><span class=\"grip\"><i class=\"g i-grip\"><\u002Fi><\u002Fspan><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Ask Tom about the flights<\u002Fspan><\u002Fspan><span class=\"tools\"><i class=\"g i-pencil\"><\u002Fi><i class=\"g i-trash\"><\u002Fi><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<span class=\"rec\">recommended<\u002Fspan>\n<ul class=\"spec\"><li><b>Nothing on the row changes except that it now shows its date.<\u002Fb> The pencil opens a sheet that has gained a When field, beside the title and the note.<\u002Fli><li>Reaches every row, dated or not, which is the thing B cannot do.<\u002Fli><li><b>One sheet holds every attribute of a row<\u002Fb>, so the next thing a row learns to carry has somewhere obvious to go. That is the argument that outlasts this feature.<\u002Fli><li>Costs a sheet open for a change as small as \"push it a day\", which is the price.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag i\"><b>B<\u002Fb><span>the date is the control<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:400px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar hl\"><span class=\"lead\"><span class=\"bc\"><i class=\"g i-chev-l\"><\u002Fi><\u002Fspan><\u002Fspan><h4>Lisbon trip<\u002Fh4><\u002Fdiv>\n<div class=\"body\">\n<div class=\"r two\"><span class=\"grip\"><i class=\"g i-grip\"><\u002Fi><\u002Fspan><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Pay the rent<\u002Fspan><span class=\"wchip soon\"><i class=\"g i-cal\"><\u002Fi>Due Fri 25<\u002Fspan><\u002Fspan><span class=\"tools\"><i class=\"g i-pencil\"><\u002Fi><i class=\"g i-trash\"><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"r two\"><span class=\"grip\"><i class=\"g i-grip\"><\u002Fi><\u002Fspan><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Book the Istanbul stay<\u002Fspan><span class=\"wchip\"><i class=\"g i-cal\"><\u002Fi>Due Mon 28<\u002Fspan><\u002Fspan><span class=\"tools\"><i class=\"g i-pencil\"><\u002Fi><i class=\"g i-trash\"><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"r two\"><span class=\"grip\"><i class=\"g i-grip\"><\u002Fi><\u002Fspan><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Ask Tom about the flights<\u002Fspan><span class=\"wchip none\"><i class=\"g i-cal\"><\u002Fi>Add a date<\u002Fspan><\u002Fspan><span class=\"tools\"><i class=\"g i-pencil\"><\u002Fi><i class=\"g i-trash\"><\u002Fi><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<span class=\"verdict no\">the dashed slot is the problem<\u002Fspan>\n<ul class=\"spec\"><li>One tap to change a date that exists, which is the common case and the nicest version of it.<\u002Fli><li><b>But an undated row has to grow an empty slot to be tappable<\u002Fb>, and that is a list of chores wearing a row of unanswered questions. Principle 04 spent real effort making offload not ask.<\u002Fli><li>The chip is <b>24px<\u002Fb> tall inside a 72px row, so the tap target has to extend past the ink, which is fine on a phone and cramped beside the web row's hover tools.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag i\"><b>C<\u002Fb><span>a third icon on the row<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:400px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar hl\"><span class=\"lead\"><span class=\"bc\"><i class=\"g i-chev-l\"><\u002Fi><\u002Fspan><\u002Fspan><h4>Lisbon trip<\u002Fh4><\u002Fdiv>\n<div class=\"body\">\n<div class=\"r two\"><span class=\"grip\"><i class=\"g i-grip\"><\u002Fi><\u002Fspan><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Pay the rent<\u002Fspan><span class=\"wchip soon\"><i class=\"g i-cal\"><\u002Fi>Due Fri 25<\u002Fspan><\u002Fspan><span class=\"tools\"><i class=\"g i-cal\"><\u002Fi><i class=\"g i-pencil\"><\u002Fi><i class=\"g i-trash\"><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"r two\"><span class=\"grip\"><i class=\"g i-grip\"><\u002Fi><\u002Fspan><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Book the Istanbul stay<\u002Fspan><span class=\"wchip\"><i class=\"g i-cal\"><\u002Fi>Due Mon 28<\u002Fspan><\u002Fspan><span class=\"tools\"><i class=\"g i-cal\"><\u002Fi><i class=\"g i-pencil\"><\u002Fi><i class=\"g i-trash\"><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"r\"><span class=\"grip\"><i class=\"g i-grip\"><\u002Fi><\u002Fspan><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Ask Tom about the flights<\u002Fspan><\u002Fspan><span class=\"tools\"><i class=\"g i-cal\"><\u002Fi><i class=\"g i-pencil\"><\u002Fi><i class=\"g i-trash\"><\u002Fi><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<span class=\"verdict no\">breaks the stated rule, and draws the calendar twice<\u002Fspan>\n<ul class=\"spec\"><li>The row now carries a handle, a checkbox, a title, a date with a calendar in it, and a calendar icon that is a different calendar. <b>Two calendars on one row that mean different things.<\u002Fb><\u002Fli><li>It is also the only option that pushes the title column narrow enough to clip ordinary titles at 390px.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"snote\" style=\"margin-top:26px\"><b>A.<\u002Fb> The row draws its date and does not act on it; the pencil is the single way in, and the sheet behind it holds everything about the row rather than a date field bolted to a rename. Nothing is added to the tool cluster, so the two-controls rule holds, and a row that has never had a date never asks for one.<\u002Fp>\n<div class=\"rowlabel\">So the edit sheet becomes the row's one sheet<u>title, note, when, repeats<\u002Fu><\u002Fdiv>\n<div class=\"row\">\n<div class=\"cell\"><div class=\"tag i\"><b>As the kit has it<\u002Fb><span>a rename, and nothing else<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:430px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar hl\"><span class=\"lead\"><span class=\"bc\"><i class=\"g i-chev-l\"><\u002Fi><\u002Fspan><\u002Fspan><h4>Lisbon trip<\u002Fh4><\u002Fdiv>\n<div class=\"body\"><div class=\"r two\"><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Pay the rent<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"scrim\"><\u002Fdiv>\n<div class=\"sheet\">\n<div class=\"grab\"><\u002Fdiv>\n<div class=\"st\">Edit<\u002Fdiv>\n<div class=\"prow\" style=\"box-shadow:none\"><span class=\"pl\">Pay the rent<\u002Fspan><\u002Fdiv>\n<div class=\"sfoot\"><span class=\"sbtn sec\"><span>Cancel<\u002Fspan><\u002Fspan><span class=\"sbtn pri\"><span>Save<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<ul class=\"spec\"><li>One text field. Every other fact about a row is the model's to write and nobody else's.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag m\"><b>Edit<\u002Fb><span>four rows, and the last two are new<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:430px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar hl\"><span class=\"lead\"><span class=\"bc\"><i class=\"g i-chev-l\"><\u002Fi><\u002Fspan><\u002Fspan><h4>Lisbon trip<\u002Fh4><\u002Fdiv>\n<div class=\"body\"><div class=\"r two\"><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Pay the rent<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"scrim\"><\u002Fdiv>\n<div class=\"sheet\">\n<div class=\"grab\"><\u002Fdiv>\n<div class=\"st\">Edit<\u002Fdiv>\n<div class=\"prow\"><span class=\"pl\">Pay the rent<\u002Fspan><\u002Fdiv>\n<div class=\"prow\"><span class=\"pl\" style=\"color:var(--text-tertiary)\">Add a note<\u002Fspan><\u002Fdiv>\n<div class=\"prow\"><i class=\"g i-cal\"><\u002Fi><span class=\"pl\">When<\u002Fspan><span class=\"pv\">Fri 25, 9:00<\u002Fspan><i class=\"g i-chev-r\"><\u002Fi><\u002Fdiv>\n<div class=\"prow\"><i class=\"g i-clock\"><\u002Fi><span class=\"pl\">Repeats<\u002Fspan><span class=\"pv\">Every month<\u002Fspan><i class=\"g i-chev-r\"><\u002Fi><\u002Fdiv>\n<div class=\"sfoot\"><span class=\"sbtn sec\"><span>Cancel<\u002Fspan><\u002Fspan><span class=\"sbtn pri\"><span>Save<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<span class=\"rec\">take this<\u002Fspan>\n<ul class=\"spec\">\n<li><b>The two text fields keep their place at the top<\u002Fb>, so the sheet a person already knows has grown rather than changed.<\u002Fli>\n<li><b>When and Repeats carry their values on the row.<\u002Fb> A row that opens something should say what it currently holds, or the sheet makes you open two things to read one fact.<\u002Fli>\n<li><b>Both open the same picker<\u002Fb>, which is section 5: When lands on the grid, Repeats lands on the same sheet scrolled to its own block. One sheet, two doors.<\u002Fli>\n<li><b>Save writes once.<\u002Fb> A title change and a date change made together are one write, which matters because the date path and the rename path are otherwise two different routes on the server.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag i\"><b>Web<\u002Fb><span>the same four, in a modal<\u002Fspan><\u002Fdiv>\n<div class=\"crop\" style=\"padding:var(--space-6) var(--gutter-screen)\">\n<div style=\"font-size:13.5px;line-height:1.7;color:var(--text-secondary)\">The web row has had an edit control since 007 and the same rule about one way out. It takes the same four fields in the existing modal rather than a sheet.<br><br><b style=\"color:var(--text-primary)\">The difference is the picker.<\u002Fb> A phone gets a sheet; the desk gets the month grid inline in the modal, because there is room and because a second layer over a modal is the thing the people work already avoided.<br><br><b style=\"color:var(--text-primary)\">Android is the iOS sheet<\u002Fb> at Material's radii, which the kit already handles. No third drawing.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"sechead\"><h2>5. The picker<\u002Fh2><u>the grid, with the hour and the recurrence inside it<\u002Fu><\u002Fdiv>\n<p class=\"snote\">The grid is the front door. A person reading a month knows where they are and when they are without having to trust the product's arithmetic, and the two things that used to be separate screens, the hour and the recurrence, open inside the same sheet.<\u002Fp>\n<p class=\"snote\"><b>The recurrence follows Google Calendar.<\u002Fb> Same presets, same Custom dialog, and the reason is not familiarity: 019 already writes events to a real Google calendar, so a vocabulary that survives that trip is one nobody has to translate. <b>It does not fit the current column<\u002Fb>, which is the last cell in this section and the biggest item in the handoff.<\u002Fp>\n<div class=\"row\">\n<div class=\"cell\"><div class=\"tag m\"><b>As it opens<\u002Fb><span>the month, and two rows that hold their values<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:640px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar hl\"><span class=\"lead\"><span class=\"bc\"><i class=\"g i-chev-l\"><\u002Fi><\u002Fspan><\u002Fspan><h4>Lisbon trip<\u002Fh4><\u002Fdiv>\n<div class=\"body\"><div class=\"r two\"><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Pay the rent<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"scrim\"><\u002Fdiv>\n<div class=\"sheet\">\n<div class=\"grab\"><\u002Fdiv>\n<div class=\"st\">When<\u002Fdiv>\n<p class=\"sintro\">Pay the rent<\u002Fp>\n<div class=\"prow\" style=\"box-shadow:none;padding-bottom:0\"><span class=\"pl\" style=\"font-weight:var(--weight-medium)\">September 2026<\u002Fspan><i class=\"g i-chev-l\"><\u002Fi><i class=\"g i-chev-r\"><\u002Fi><\u002Fdiv>\n<div class=\"pgrid\">\n<u>M<\u002Fu><u>T<\u002Fu><u>W<\u002Fu><u>T<\u002Fu><u>F<\u002Fu><u>S<\u002Fu><u>S<\u002Fu>\n<b class=\"mute\">31<\u002Fb><b>1<\u002Fb><b>2<\u002Fb><b>3<\u002Fb><b>4<\u002Fb><b>5<\u002Fb><b>6<\u002Fb>\n<b>7<\u002Fb><b>8<\u002Fb><b>9<\u002Fb><b>10<\u002Fb><b>11<\u002Fb><b>12<\u002Fb><b>13<\u002Fb>\n<b>14<\u002Fb><b>15<\u002Fb><b>16<\u002Fb><b>17<\u002Fb><b>18<\u002Fb><b>19<\u002Fb><b>20<\u002Fb>\n<b>21<\u002Fb><b class=\"today\">22<\u002Fb><b>23<\u002Fb><b>24<\u002Fb><b class=\"on\">25<\u002Fb><b>26<\u002Fb><b>27<\u002Fb>\n<b>28<\u002Fb><b>29<\u002Fb><b>30<\u002Fb><b class=\"mute\">1<\u002Fb><b class=\"mute\">2<\u002Fb><b class=\"mute\">3<\u002Fb><b class=\"mute\">4<\u002Fb>\n<\u002Fdiv>\n<div class=\"prow\" style=\"margin-top:6px\"><i class=\"g i-clock\"><\u002Fi><span class=\"pl\">Time<\u002Fspan><span class=\"pv\">All day<\u002Fspan><i class=\"g i-chev-d\"><\u002Fi><\u002Fdiv>\n<div class=\"prow\"><i class=\"g i-cal\"><\u002Fi><span class=\"pl\">Repeats<\u002Fspan><span class=\"pv\">Never<\u002Fspan><i class=\"g i-chev-d\"><\u002Fi><\u002Fdiv>\n<div class=\"sfoot\"><span class=\"sbtn dgr\"><span>Clear<\u002Fspan><\u002Fspan><span class=\"sbtn pri\"><span>Save<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<span class=\"rec\">recommended<\u002Fspan>\n<ul class=\"spec\">\n<li><b>Today is outlined, the pick is filled.<\u002Fb> Two different facts, so two different marks: a ring for where you are, ink for what you chose. A single highlight for both is how a picker loses today the moment you tap anything.<\u002Fli>\n<li><b>The two rows below carry their current values and a chevron that points down<\u002Fb>, not right, because they open in place. Nothing in this sheet navigates.<\u002Fli>\n<li><b>Clear is a first-class control.<\u002Fb> Today there is no way to remove a date at all, so the one thing this must not ship without is the way out. It clears the date, the hour and the recurrence together, which is what a person means by \"never mind\".<\u002Fli>\n<li>Leading and trailing days are <code>--text-tertiary<\u002Fcode> and still tappable, so a date at the turn of the month does not need the arrows.<\u002Fli>\n<li><b>Week starts on<\u002Fb> comes from section 3, which is why that setting exists.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag m\"><b>Time, open<\u002Fb><span>All day, then the wheel<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:820px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar hl\"><span class=\"lead\"><span class=\"bc\"><i class=\"g i-chev-l\"><\u002Fi><\u002Fspan><\u002Fspan><h4>Lisbon trip<\u002Fh4><\u002Fdiv>\n<div class=\"body\"><\u002Fdiv>\n<div class=\"scrim\"><\u002Fdiv>\n<div class=\"sheet\">\n<div class=\"grab\"><\u002Fdiv>\n<div class=\"st\">When<\u002Fdiv>\n<div class=\"prow\" style=\"box-shadow:none;padding-bottom:0\"><span class=\"pl\" style=\"font-weight:var(--weight-medium)\">September 2026<\u002Fspan><i class=\"g i-chev-l\"><\u002Fi><i class=\"g i-chev-r\"><\u002Fi><\u002Fdiv>\n<div class=\"pgrid\">\n<u>M<\u002Fu><u>T<\u002Fu><u>W<\u002Fu><u>T<\u002Fu><u>F<\u002Fu><u>S<\u002Fu><u>S<\u002Fu>\n<b>21<\u002Fb><b class=\"today\">22<\u002Fb><b>23<\u002Fb><b>24<\u002Fb><b class=\"on\">25<\u002Fb><b>26<\u002Fb><b>27<\u002Fb>\n<b>28<\u002Fb><b>29<\u002Fb><b>30<\u002Fb><b class=\"mute\">1<\u002Fb><b class=\"mute\">2<\u002Fb><b class=\"mute\">3<\u002Fb><b class=\"mute\">4<\u002Fb>\n<\u002Fdiv>\n<div class=\"prow\" style=\"margin-top:6px\"><i class=\"g i-clock\"><\u002Fi><span class=\"pl\">Time<\u002Fspan><span class=\"pv\">9:00<\u002Fspan><i class=\"g i-chev-d\"><\u002Fi><\u002Fdiv>\n<div class=\"exp\">\n<span class=\"opt\"><s>All day<\u002Fs><\u002Fspan>\n<span class=\"wheel\"><span class=\"band\"><\u002Fspan><span class=\"col\"><span>08<\u002Fspan><span class=\"on\">09<\u002Fspan><span>10<\u002Fspan><\u002Fspan><span class=\"col\"><span>55<\u002Fspan><span class=\"on\">00<\u002Fspan><span>05<\u002Fspan><\u002Fspan><\u002Fspan>\n<span class=\"opt\"><s>Ends at<\u002Fs><em>10:00<\u002Fem><i class=\"g i-chev-r\"><\u002Fi><\u002Fspan>\n<\u002Fdiv>\n<div class=\"prow\"><i class=\"g i-cal\"><\u002Fi><span class=\"pl\">Repeats<\u002Fspan><span class=\"pv\">Never<\u002Fspan><i class=\"g i-chev-d\"><\u002Fi><\u002Fdiv>\n<div class=\"sfoot\"><span class=\"sbtn dgr\"><span>Clear<\u002Fspan><\u002Fspan><span class=\"sbtn pri\"><span>Save<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<ul class=\"spec\">\n<li><b>All day sits above the wheel and greys it<\u002Fb> rather than removing it, so the control does not jump and the hour you had is still visible while it is switched off. Tapping the wheel turns All day back off, which means there are two ways to the same state and neither is hidden.<\u002Fli>\n<li><b>Five-minute steps.<\u002Fb> Twelve values an hour is enough for anything somebody would put on a task, and a minute wheel with sixty rows is a scroll nobody finishes.<\u002Fli>\n<li><b>Setting a time opens Ends at.<\u002Fb> It is not a row you have to find: the moment an hour exists the question of how long becomes askable, and before that it is meaningless. On a task the row is absent entirely, because a due date has no end.<\u002Fli>\n<li>The platform's own wheel, not one drawn here. It reads the locale, so a 12-hour account gets am and pm and a third column without this design saying anything about it.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag m\"><b>Repeats, open<\u002Fb><span>the presets, on Google's shape<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:850px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar hl\"><span class=\"lead\"><span class=\"bc\"><i class=\"g i-chev-l\"><\u002Fi><\u002Fspan><\u002Fspan><h4>Lisbon trip<\u002Fh4><\u002Fdiv>\n<div class=\"body\"><\u002Fdiv>\n<div class=\"scrim\"><\u002Fdiv>\n<div class=\"sheet\">\n<div class=\"grab\"><\u002Fdiv>\n<div class=\"st\">When<\u002Fdiv>\n<div class=\"prow\" style=\"box-shadow:none;padding-bottom:0\"><span class=\"pl\" style=\"font-weight:var(--weight-medium)\">September 2026<\u002Fspan><i class=\"g i-chev-l\"><\u002Fi><i class=\"g i-chev-r\"><\u002Fi><\u002Fdiv>\n<div class=\"pgrid\">\n<u>M<\u002Fu><u>T<\u002Fu><u>W<\u002Fu><u>T<\u002Fu><u>F<\u002Fu><u>S<\u002Fu><u>S<\u002Fu>\n<b>21<\u002Fb><b class=\"today\">22<\u002Fb><b>23<\u002Fb><b>24<\u002Fb><b class=\"on\">25<\u002Fb><b>26<\u002Fb><b>27<\u002Fb>\n<b>28<\u002Fb><b>29<\u002Fb><b>30<\u002Fb><b class=\"mute\">1<\u002Fb><b class=\"mute\">2<\u002Fb><b class=\"mute\">3<\u002Fb><b class=\"mute\">4<\u002Fb>\n<\u002Fdiv>\n<div class=\"prow\" style=\"margin-top:6px\"><i class=\"g i-clock\"><\u002Fi><span class=\"pl\">Time<\u002Fspan><span class=\"pv\">9:00<\u002Fspan><i class=\"g i-chev-d\"><\u002Fi><\u002Fdiv>\n<div class=\"prow\"><i class=\"g i-cal\"><\u002Fi><span class=\"pl\">Repeats<\u002Fspan><span class=\"pv\">Monthly<\u002Fspan><i class=\"g i-chev-d\"><\u002Fi><\u002Fdiv>\n<div class=\"exp tight\">\n<span class=\"opt\"><s>Never<\u002Fs><\u002Fspan>\n<span class=\"opt\"><s>Daily<\u002Fs><\u002Fspan>\n<span class=\"opt\"><s>Weekly on Friday<\u002Fs><\u002Fspan>\n<span class=\"opt\"><s>Every weekday<\u002Fs><em>Mon to Fri<\u002Fem><\u002Fspan>\n<span class=\"opt on\"><s>Monthly on the fourth Friday<\u002Fs><i class=\"g i-check\"><\u002Fi><\u002Fspan>\n<span class=\"opt\"><s>Annually on 25 September<\u002Fs><\u002Fspan>\n<span class=\"opt\"><s>Custom<\u002Fs><i class=\"g i-chev-r\"><\u002Fi><\u002Fspan>\n<\u002Fdiv>\n<div class=\"sfoot\"><span class=\"sbtn dgr\"><span>Clear<\u002Fspan><\u002Fspan><span class=\"sbtn pri\"><span>Save<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<span class=\"rec\">the recurring config<\u002Fspan>\n<ul class=\"spec\">\n<li><b>Google Calendar's own list, because half of these rows are going to Google anyway.<\u002Fb> 019 already round-trips events to a real calendar, so a set of presets that cannot survive that trip would be a set we have to translate and lose things in.<\u002Fli>\n<li><b>Every preset names what it inherited from the date above it.<\u002Fb> Weekly on Friday, monthly on the fourth Friday, annually on 25 September, all read off the 25th being selected in the grid. That is why the block sits under the month rather than on a screen of its own: change the date and every line rewrites.<\u002Fli>\n<li><b>Monthly means the fourth Friday, not the 25th.<\u002Fb> Those are different rules and the product has to pick one for the preset; the nth-weekday reading is what Google leads with and what people mean by \"the monthly team thing\". Day-of-month lives in Custom.<\u002Fli>\n<li><b>Custom is the last row and opens a second sheet<\u002Fb>, which is the one place in this design that navigates. It has to: it holds an interval, a set of weekdays and an end condition, and none of that collapses into a row.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rowlabel\">Custom<u>and the column it does not fit in<\u002Fu><\u002Fdiv>\n<div class=\"row\">\n<div class=\"cell\"><div class=\"tag m\"><b>Custom<\u002Fb><span>interval, days, and an end<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:620px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar hl\"><span class=\"lead\"><span class=\"bc\"><i class=\"g i-chev-l\"><\u002Fi><\u002Fspan><\u002Fspan><h4>Lisbon trip<\u002Fh4><\u002Fdiv>\n<div class=\"body\"><\u002Fdiv>\n<div class=\"scrim\"><\u002Fdiv>\n<div class=\"sheet\">\n<div class=\"grab\"><\u002Fdiv>\n<div class=\"st\">Custom<\u002Fdiv>\n<div class=\"cust\"><span class=\"cl\">Repeat every<\u002Fspan><span class=\"numbox\">2<\u002Fspan><span class=\"selbox\">weeks<i class=\"g i-chev-d\"><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"cust\" style=\"box-shadow:none;padding-bottom:0\"><span class=\"cl\">Repeat on<\u002Fspan><\u002Fdiv>\n<div class=\"dows\"><b>M<\u002Fb><b>T<\u002Fb><b>W<\u002Fb><b>T<\u002Fb><b class=\"on\">F<\u002Fb><b>S<\u002Fb><b>S<\u002Fb><\u002Fdiv>\n<div class=\"cust\" style=\"box-shadow:none;padding-bottom:2px\"><span class=\"cl\" style=\"color:var(--text-tertiary);font-size:13px\">ENDS<\u002Fspan><\u002Fdiv>\n<div class=\"cust\"><span class=\"rad on\"><\u002Fspan><span class=\"cl\">Never<\u002Fspan><\u002Fdiv>\n<div class=\"cust\"><span class=\"rad\"><\u002Fspan><span class=\"cl\">On<\u002Fspan><span class=\"selbox\">25 Dec 2026<i class=\"g i-chev-d\"><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"cust\" style=\"box-shadow:none\"><span class=\"rad\"><\u002Fspan><span class=\"cl\">After<\u002Fspan><span class=\"numbox\">13<\u002Fspan><span style=\"font-size:13px;color:var(--text-secondary)\">times<\u002Fspan><\u002Fdiv>\n<div class=\"sfoot\"><span class=\"sbtn sec\"><span>Cancel<\u002Fspan><\u002Fspan><span class=\"sbtn pri\"><span>Done<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<ul class=\"spec\">\n<li><b>Four controls and nothing else.<\u002Fb> Interval, weekdays, and one of three endings. Google's dialog has exactly this and has had for a decade, which is a stronger argument than anything this page could reason out.<\u002Fli>\n<li><b>Repeat on appears only when the unit is weeks.<\u002Fb> At months the row is replaced by the anchor choice, day of the month or the nth weekday, which is the pair the presets could not show.<\u002Fli>\n<li><b>After N times is the one people forget and the one that saves arithmetic<\u002Fb>: a twelve-week course, a course of antibiotics, six physio sessions. It is also the value the current schema has no room for at all.<\u002Fli>\n<li>Cancel and Done rather than Clear and Save: this sheet edits a rule and hands it back, it does not write the row.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\" style=\"max-width:520px\"><div class=\"tag m\"><b>The cost<\u002Fb><span>decided: it becomes a rule<\u002Fspan><\u002Fdiv>\n<div class=\"crop\" style=\"width:520px;padding:var(--space-6) var(--gutter-screen)\">\n<div style=\"font-size:13.5px;line-height:1.7;color:var(--text-secondary)\"><b style=\"color:var(--text-primary)\">Settled: recurrence becomes an RRULE.<\u002Fb> This list does not fit the column and the gap is not small. <code>repeats<\u002Fcode> is an enum of day, weekday, week, two_weeks, month and year, with <code>repeats_until<\u002Fcode> beside it. That holds four of the seven presets and none of Custom.<br><br>What has nowhere to go today: <b style=\"color:var(--text-primary)\">an interval<\u002Fb> (every 2 weeks exists as a value, every 3 does not), <b style=\"color:var(--text-primary)\">a set of weekdays<\u002Fb> (Monday and Thursday is unsayable), <b style=\"color:var(--text-primary)\">a monthly anchor<\u002Fb> (the 25th versus the fourth Friday, which is the difference between two real rules), and <b style=\"color:var(--text-primary)\">an occurrence count<\u002Fb>.<br><br><b style=\"color:var(--text-primary)\">One column holding an RRULE<\u002Fb>, RFC 5545, rather than four new columns. Three reasons: it is exactly the expressiveness this dialog needs and no more; <b style=\"color:var(--text-primary)\">it is what Google speaks<\u002Fb>, so 019's connector stops translating and starts passing through; and the six current enum values map into it losslessly, so the migration is a mechanical one-way rewrite with no data to reconcile.<br><br>The existing values, for the migration: <code>day<\u002Fcode> is <code>FREQ=DAILY<\u002Fcode>, <code>weekday<\u002Fcode> is <code>FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR<\u002Fcode>, <code>week<\u002Fcode> is <code>FREQ=WEEKLY<\u002Fcode>, <code>two_weeks<\u002Fcode> is <code>FREQ=WEEKLY;INTERVAL=2<\u002Fcode>, <code>month<\u002Fcode> is <code>FREQ=MONTHLY<\u002Fcode> and <code>year<\u002Fcode> is <code>FREQ=YEARLY<\u002Fcode>. <code>repeats_until<\u002Fcode> becomes <code>UNTIL<\u002Fcode>.<br><br><b style=\"color:var(--text-primary)\">What stays true either way:<\u002Fb> a repeating row is still one row, the calendar still draws it on every matching day, and this sheet still cannot edit a single occurrence.<\u002Fdiv>\n<\u002Fdiv>\n<ul class=\"spec\">\n<li><b>This is the largest thing on the page and it came from a preset list.<\u002Fb> Worth saying plainly: adopting Google's recurrence vocabulary was a schema decision wearing the clothes of a menu, and it has been taken.<\u002Fli>\n<li><b>The model's tools inherit it too.<\u002Fb> <code>add_content<\u002Fcode> and <code>add_note<\u002Fcode> take <code>repeats<\u002Fcode> as the enum; they would take a rule string instead, which is a better fit for what a model reads out of \"every other Tuesday\" and currently has to round to something wrong.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rowlabel\">Two shapes that lost<u>kept for the record<\u002Fu><\u002Fdiv>\n<div class=\"row\">\n<div class=\"cell\"><div class=\"tag i\"><b>Relatives as the front door<\u002Fb><span>Today, Tomorrow, This weekend<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:470px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar hl\"><h4>Lisbon trip<\u002Fh4><\u002Fdiv>\n<div class=\"body\"><\u002Fdiv>\n<div class=\"scrim\"><\u002Fdiv>\n<div class=\"sheet\">\n<div class=\"grab\"><\u002Fdiv>\n<div class=\"st\">When<\u002Fdiv>\n<div class=\"prow\"><span class=\"pl\">Today<\u002Fspan><span class=\"pv\">Tue 22<\u002Fspan><\u002Fdiv>\n<div class=\"prow\"><span class=\"pl\">Tomorrow<\u002Fspan><span class=\"pv\">Wed 23<\u002Fspan><\u002Fdiv>\n<div class=\"prow on\"><span class=\"pl\">This weekend<\u002Fspan><span class=\"pv\">Sat 26<\u002Fspan><i class=\"g tick i-check\"><\u002Fi><\u002Fdiv>\n<div class=\"prow\"><span class=\"pl\">Next week<\u002Fspan><span class=\"pv\">Mon 28<\u002Fspan><\u002Fdiv>\n<div class=\"prow\"><span class=\"pl\">Pick a day<\u002Fspan><i class=\"g i-chev-r\"><\u002Fi><\u002Fdiv>\n<div class=\"sfoot\"><span class=\"sbtn dgr\"><span>Clear<\u002Fspan><\u002Fspan><span class=\"sbtn pri\"><span>Save<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<ul class=\"spec\"><li>Genuinely faster for the four answers it lists, and the date beside each label is what made it safe.<\u002Fli><li><b>But it puts the grid one step further away for everything else<\u002Fb>, and it cannot show a month, which is what you want the moment the answer is not one of four.<\u002Fli><li>Its b
