est idea survives: the relatives can sit as a strip above the grid later, if the grid alone proves slow.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag i\"><b>A fortnight on a rail<\u002Fb><span>horizontal, compact<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:470px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar hl\"><h4>Lisbon trip<\u002Fh4><\u002Fdiv>\n<div class=\"body\"><\u002Fdiv>\n<div class=\"scrim\"><\u002Fdiv>\n<div class=\"sheet\">\n<div class=\"grab\"><\u002Fdiv>\n<div class=\"st\">When<\u002Fdiv>\n<div class=\"pstrip\"><b><u>Tue<\u002Fu><s>22<\u002Fs><\u002Fb><b><u>Wed<\u002Fu><s>23<\u002Fs><\u002Fb><b><u>Thu<\u002Fu><s>24<\u002Fs><\u002Fb><b class=\"on\"><u>Fri<\u002Fu><s>25<\u002Fs><\u002Fb><b><u>Sat<\u002Fu><s>26<\u002Fs><\u002Fb><b><u>Sun<\u002Fu><s>27<\u002Fs><\u002Fb><b><u>Mon<\u002Fu><s>28<\u002Fs><\u002Fb><\u002Fdiv>\n<div class=\"prow\"><span class=\"pl\">Pick a day<\u002Fspan><span class=\"pv\">Fri 25 Sep<\u002Fspan><i class=\"g i-chev-r\"><\u002Fi><\u002Fdiv>\n<div class=\"prow\"><span class=\"pl\">Add a time<\u002Fspan><i class=\"g i-chev-r\"><\u002Fi><\u002Fdiv>\n<div class=\"sfoot\"><span class=\"sbtn dgr\"><span>Clear<\u002Fspan><\u002Fspan><span class=\"sbtn pri\"><span>Save<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<span class=\"verdict no\">a horizontal gesture inside a vertical one<\u002Fspan>\n<ul class=\"spec\"><li>Compact, and it borrows the Timeline's shape, so it costs nothing to learn.<\u002Fli><li><b>A scrolling rail inside a sheet is the conflict the content row's swipe already fails on<\u002Fb>, and it shows seven days where the grid shows thirty.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"sechead\"><h2>6. The other ways in<\u002Fh2><u>the sheet is one door of four<\u002Fu><\u002Fdiv>\n<div class=\"row\">\n<div class=\"cell\"><div class=\"tag m\"><b>Saying it<\u002Fb><span>already possible, not yet said back<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:400px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar hl\"><h4>Lisbon trip<\u002Fh4><\u002Fdiv>\n<div class=\"body\"><div class=\"turns\">\n<div class=\"you\">push rent to friday<\u002Fdiv>\n<div class=\"ol\">Moved it to Friday.<div class=\"pills\"><span class=\"pill2\"><i class=\"g i-cal\"><\u002Fi>Pay the rent<em>Fri 25<\u002Fem><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<ul class=\"spec\">\n<li><b>The tool already exists.<\u002Fb> <code>edit_content<\u002Fcode> takes all three dates, added in 019 for exactly this reason: a row filed without a time had no way to get one.<\u002Fli>\n<li>The reply is verb-first with no subject, as the readme requires. The pill is the existing filed pill with the date as its value, so tapping it opens the same When sheet.<\u002Fli>\n<li><b>What it cannot do is clear a date.<\u002Fb> A null through the tool layer reads as \"not stated\" rather than \"remove it\", which is the same ambiguity <code>parseDates<\u002Fcode> already navigates. Clearing stays a sheet action.<\u002Fli>\n<li><b>And it may overwrite a date a person set by hand<\u002Fb>, where the dump clearly states a new one. There is no stickiness rule, unlike notes, where corrections beat inference.<\u002Fli>\n<li><b>So the change has to be visible, and the mechanism already exists.<\u002Fb> A row whose date the model moved takes the change mark: the moss ground settling to transparent over 1400ms, which the content row already draws and whose comment reads <i>offload did this, you didn't<\u002Fi>. It also lands in Activity, so a date that moved while you were not looking is recoverable rather than merely noticed.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag m\"><b>At filing<\u002Fb><span>on the pill offload already draws<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:400px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar hl\"><h4>Today<\u002Fh4><\u002Fdiv>\n<div class=\"body\"><div class=\"turns\">\n<div class=\"you\">rent is due friday and I need to book istanbul before the trip<\u002Fdiv>\n<div class=\"ol\">Filed both.<div class=\"pills\"><span class=\"pill2\"><i class=\"g i-cal\"><\u002Fi>Pay the rent<em>Fri 25<\u002Fem><\u002Fspan><span class=\"pill2\"><i class=\"g i-cal\"><\u002Fi>Book the Istanbul stay<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<span class=\"rec\">the restraint is the point<\u002Fspan>\n<ul class=\"spec\">\n<li><b>The dated pill shows its date; the undated one shows nothing and asks nothing.<\u002Fb> The second row genuinely has no date, and inventing a prompt for one is exactly what principle 04 forbids.<\u002Fli>\n<li>So this entry point is <b>a correction path, not a capture path<\u002Fb>: it exists so a wrong inference is one tap from being right, in the seconds when you still remember what you meant.<\u002Fli>\n<li>Tapping either pill opens the When sheet against that row. <b>No new component<\u002Fb>: the pill is the filed pill and the value slot already exists.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag m\"><b>The action sheet<\u002Fb><span>one row added<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:400px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar hl\"><h4>Lisbon trip<\u002Fh4><\u002Fdiv>\n<div class=\"body\"><div class=\"r two\"><span class=\"cbx\"><\u002Fspan><span class=\"tx\"><span class=\"t\">Pay the rent<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"scrim\"><\u002Fdiv>\n<div class=\"sheet\">\n<div class=\"grab\"><\u002Fdiv>\n<div class=\"st\">Pay the rent<\u002Fdiv>\n<div class=\"prow\"><i class=\"g i-cal\"><\u002Fi><span class=\"pl\">When<\u002Fspan><span class=\"pv\">Fri 25<\u002Fspan><\u002Fdiv>\n<div class=\"prow\"><i class=\"g i-pencil\"><\u002Fi><span class=\"pl\">Edit<\u002Fspan><\u002Fdiv>\n<div class=\"prow\"><i class=\"g i-users\"><\u002Fi><span class=\"pl\">Move to another thread<\u002Fspan><\u002Fdiv>\n<div class=\"prow\"><i class=\"g i-trash\"><\u002Fi><span class=\"pl\" style=\"color:var(--text-danger)\">Delete<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<ul class=\"spec\">\n<li><b>When sits above Edit<\u002Fb>, and it carries its current value where the other rows carry nothing. A row that shows an answer belongs above rows that only open something.<\u002Fli>\n<li>The long press already opens this sheet and it already lists what this account may do, so authorship is handled: <b>When appears only where the pencil appears<\u002Fb>, which is <code>canDelete<\u002Fcode>.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"sechead\"><h2>7. The two digests<\u002Fh2><u>no per-item pushes<\u002Fu><\u002Fdiv>\n<p class=\"snote\">One send in the morning for today, one in the evening for tomorrow. A due date is not an alarm; it is something to plan around, and something that pushes the moment it becomes true teaches people to swipe it away.<\u002Fp>\n<p class=\"snote\"><b>A date does not get announced. A reminder does.<\u002Fb> <code>is_reminder<\u002Fcode> gates both sends, so a row is in a digest only where the model read the dump as asking to be told, and <b>most dated rows are silent<\u002Fb>. \"Rent is due Friday\" is a fact about rent; \"remind me to pay the rent Friday\" is a request. The flag is the difference and it has been sitting in the schema unread since 001.<\u002Fp>\n<p class=\"snote\"><b>Two consequences, and the second is a risk worth naming.<\u002Fb> Most mornings send nothing at all, which makes an empty digest the normal state rather than an edge case. And <b>a person can set a date but cannot ask to be reminded of it<\u002Fb>: the flag has no person-facing writer, so the only way to be told about something is to have phrased the original dump as a request. That is a coherent position, and it is also the first thing somebody will write in about.<\u002Fp>\n<table class=\"mx\">\n<tbody><tr><th>Send<\u002Fth><th>When<\u002Fth><th>Carries<\u002Fth><th>Skipped when<\u002Fth><\u002Ftr>\n<tr><td><b>Today<\u002Fb><\u002Ftd><td>The morning hour, in the account's zone. <b>8:00<\u002Fb> by default, settable.<\u002Ftd><td>Everything due today, and everything still overdue, as one line each.<\u002Ftd><td>Nothing is due and nothing is overdue. <b>No empty digest, ever.<\u002Fb><\u002Ftd><\u002Ftr>\n<tr><td><b>Tomorrow<\u002Fb><\u002Ftd><td>The evening hour. <b>19:00<\u002Fb> by default, settable.<\u002Ftd><td>What is due tomorrow, and a repeating item coming round.<\u002Ftd><td>Nothing is due tomorrow. Also skipped if tomorrow's list is identical to what this morning already said.<\u002Ftd><\u002Ftr>\n<tr><td><b>A share, a request<\u002Fb><\u002Ftd><td>When it happens.<\u002Ftd><td>One person, one thread.<\u002Ftd><td>Never batched. <b>A person waiting is not a digest item<\u002Fb>, and 022 already decided the answer lives on the card.<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<div class=\"rowlabel\">Three voices for the morning send<u>same eight rows underneath each one<\u002Fu><\u002Fdiv>\n<div class=\"row\">\n<div class=\"cell\"><div class=\"tag i\"><b>Voice A<\u002Fb><span>the list<\u002Fspan><\u002Fdiv>\n<div class=\"stage\"><div class=\"nios\"><div class=\"in\"><span class=\"mk\"><s><\u002Fs><\u002Fspan><div class=\"cm\"><div class=\"hd\"><u>offload<\u002Fu><em>8:00<\u002Fem><\u002Fdiv><div class=\"ti\">Due today<\u002Fdiv><div class=\"bd\">Pay the rent, Tom's birthday, send the deposit.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<ul class=\"spec\"><li><b>Says everything without being opened<\u002Fb>, which is what the notification rules already ask for.<\u002Fli><li>Falls apart at eight rows: iOS clamps the body to four lines on a banner and one in the list, so the eighth thing is a truncation.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag i\"><b>Voice B<\u002Fb><span>the count<\u002Fspan><\u002Fdiv>\n<div class=\"stage\"><div class=\"nios\"><div class=\"in\"><span class=\"mk\"><s><\u002Fs><\u002Fspan><div class=\"cm\"><div class=\"hd\"><u>offload<\u002Fu><em>8:00<\u002Fem><\u002Fdiv><div class=\"ti\">Three due today<\u002Fdiv><div class=\"bd\">Pay the rent, and two more.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<ul class=\"spec\"><li>Scales to any number and never truncates.<\u002Fli><li><b>But three is not information.<\u002Fb> It makes you open the app to learn what offload already knows, which the notification guidance names as the failure.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag m\"><b>Voice C<\u002Fb><span>one template, three arms<\u002Fspan><\u002Fdiv>\n<div class=\"stage\"><div class=\"nios\"><div class=\"in\"><span class=\"mk\"><s><\u002Fs><\u002Fspan><div class=\"cm\"><div class=\"hd\"><u>offload<\u002Fu><em>8:00<\u002Fem><\u002Fdiv><div class=\"ti\">Due today<\u002Fdiv><div class=\"bd\">Pay the rent, Ana's ferry times, and three more. One is from last week.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<span class=\"rec\">settled<\u002Fspan>\n<ul class=\"spec\">\n<li><b>One is named. Two to four are listed. Five or more name the first two and count the rest.<\u002Fb> Stated thresholds, so the copy is testable rather than a judgement made per send.<\u002Fli>\n<li><b>Overdue is a second sentence, not a second notification.<\u002Fb> Two pushes in one morning is two pushes.<\u002Fli>\n<li><b>The sent wording is stored.<\u002Fb> Section 9 keeps each line verbatim, so what a person reads back a week later is what their phone showed them rather than a re-render from today's rows.<\u002Fli>\n<li><b>Another member's row is named with its author<\u002Fb>, as <i>Ana's ferry times<\u002Fi>. A shared thread's rows reach your digest because <code>listAgenda<\u002Fcode> reads membership, and an unattributed line makes somebody else's errand look like yours. Yours are never possessive, so the possessive itself carries the meaning.<\u002Fli>\n<li>Title is verb-free and subject-free, which is the readme's rule holding: <b>Due today<\u002Fb>, never \"You have 3 tasks due\".<\u002Fli>\n<li><b>Tapping any digest opens Today<\u002Fb>, not the record and not a filtered list. Today is where the rows are and where a person was heading anyway.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rowlabel\">Both sends, both platforms<u>and the one-item case, which is the only one with actions<\u002Fu><\u002Fdiv>\n<div class=\"row\">\n<div class=\"cell\"><div class=\"tag m\"><b>Morning, several<\u002Fb><span>no actions<\u002Fspan><\u002Fdiv>\n<div class=\"stage a\"><div class=\"nand\"><div class=\"hd\"><s><b><\u002Fb><\u002Fs><u>offload<\u002Fu><span class=\"dot\"><\u002Fspan><em>8:00<\u002Fem><span class=\"cv\"><\u002Fspan><\u002Fdiv><div class=\"ti\">Due today<\u002Fdiv><div class=\"bd\">Pay the rent, Tom's birthday, and three more. One is from last week.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<ul class=\"spec\"><li><b>A digest carries no action buttons<\u002Fb>, because Done is about one thing and a digest is about five. An action that has to pick one arbitrarily is worse than no action.<\u002Fli><li>Tapping it opens the Due sheet in section 9, which is the screen that can act on all five.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag m\"><b>Morning, exactly one<\u002Fb><span>Done and Tomorrow<\u002Fspan><\u002Fdiv>\n<div class=\"stage\"><div class=\"nios\"><div class=\"in\"><span class=\"mk\"><s><\u002Fs><\u002Fspan><div class=\"cm\"><div class=\"hd\"><u>offload<\u002Fu><em>8:00<\u002Fem><\u002Fdiv><div class=\"ti\">Due today<\u002Fdiv><div class=\"bd\">Pay the rent.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"acts\"><b>Done<\u002Fb><b>Tomorrow<\u002Fb><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<span class=\"rec\">the rule that reconciles both answers<\u002Fspan>\n<ul class=\"spec\">\n<li><b>When the digest holds one thing it is not a digest, and it gets the two verbs.<\u002Fb> Done ticks it; Tomorrow moves the date by a day. Both are unambiguous because there is only one row they could mean.<\u002Fli>\n<li>iOS draws these only when the banner is pulled down, as <code>UNNotificationAction<\u002Fcode>s in a registered category. Android draws them in the card. <b>Two categories to register, not one<\u002Fb>: one with actions, one without.<\u002Fli>\n<li><b>Tomorrow writes a date, so it is <code>edit_content<\u002Fcode>'s path and not a snooze.<\u002Fb> There is no notification-level snooze anywhere in this design; moving the date is the only thing that moves the notification.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag m\"><b>Evening, tomorrow<\u002Fb><span>and the repeating item<\u002Fspan><\u002Fdiv>\n<div class=\"stage night\"><div class=\"nios\"><div class=\"in\"><span class=\"mk\"><s><\u002Fs><\u002Fspan><div class=\"cm\"><div class=\"hd\"><u>offload<\u002Fu><em>19:00<\u002Fem><\u002Fdiv><div class=\"ti\">Tomorrow<\u002Fdiv><div class=\"bd\">Dentist at 9:00, and the rent. Yoga is back on Tuesday.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<ul class=\"spec\"><li><b>Tomorrow is the whole title.<\u002Fb> It reads as a heading over the list, and it does not need the word due because half of what it carries is events rather than tasks.<\u002Fli><li>An event with an hour says the hour. A task says nothing about time even when it has one, because an hour on a task is when it is wanted by, not when it starts.<\u002Fli><li><span class=\"ask\">to confirm<\u002Fspan> I have read \"a day ahead for tomorrow\" as <b>a second send in the evening<\u002Fb>. The alternative is one morning send carrying both days, which is fewer interruptions and a longer message.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rowlabel\">The two that are not about dates<u>they arrive when they happen<\u002Fu><\u002Fdiv>\n<div class=\"row\">\n<div class=\"cell\"><div class=\"tag m\"><b>A share request<\u002Fb><\u002Fdiv>\n<div class=\"stage\"><div class=\"nios\"><div class=\"in\"><span class=\"mk\"><s><\u002Fs><\u002Fspan><div class=\"cm\"><div class=\"hd\"><u>offload<\u002Fu><em>now<\u002Fem><\u002Fdiv><div class=\"ti\">Ana wants to connect<\u002Fdiv><div class=\"bd\">Answer on her card in My people.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"acts\"><b>Open<\u002Fb><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<ul class=\"spec\"><li><b>Open, and nothing else.<\u002Fb> 022 decided a request is answered on its card, and accepting a person from a lock screen is the one place that decision should not be one tap.<\u002Fli><li>Names the person, because a request with no name is a request you have to open to understand.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag m\"><b>Added to a shared thread<\u002Fb><\u002Fdiv>\n<div class=\"stage a\"><div class=\"nand\"><div class=\"hd\"><s><b><\u002Fb><\u002Fs><u>offload<\u002Fu><span class=\"dot\"><\u002Fspan><em>now<\u002Fem><span class=\"cv\"><\u002Fspan><\u002Fdiv><div class=\"ti\">Ana added two things to Lisbon trip<\u002Fdiv><div class=\"bd\">Ferry times, and a place in Alfama.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<ul class=\"spec\"><li><b>Coalesced per thread per person, on a short window.<\u002Fb> Somebody tidying a shared list should cost one notification, not eleven.<\u002Fli><li>No actions. Tapping opens the thread, which is where both things are.<\u002Fli><li>This is the only notification whose body is <b>another person's words<\u002Fb>, so it is clamped hard and never used as a title.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag i\"><b>Not sent<\u002Fb><span>deliberately<\u002Fspan><\u002Fdiv>\n<div class=\"crop\" style=\"padding:var(--space-6) var(--gutter-screen)\">\n<div style=\"font-size:13.5px;line-height:1.75;color:var(--text-secondary)\"><b style=\"color:var(--text-primary)\">A question offload is waiting on.<\u002Fb> 018's questions sit in the conversation and expire. Pushing one turns a thing offload wondered into a thing you owe it.<br><br><b style=\"color:var(--text-primary)\">A calendar event starting.<\u002Fb> The calendar app the event came from already did this, and 019 was careful not to become a second one.<br><br><b style=\"color:var(--text-primary)\">Anything at the moment a date passes.<\u002Fb> A task does not become urgent at midnight.<br><br><b style=\"color:var(--text-primary)\">A declined request.<\u002Fb> The people work already settled this: a decline looks like silence, which is the only version that does not turn a no into a notification.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"sechead\"><h2>8. Switching them off<\u002Fh2><u>in Settings, and in the OS where the OS allows it<\u002Fu><\u002Fdiv>\n<p class=\"snote\">Every type above is individually refusable. <b>This is a preferences page, not the notifications page 022 ruled out<\u002Fb>: that decision was about a list of things that happened, which this is not.<\u002Fp>\n<div class=\"row\">\n<div class=\"cell\"><div class=\"tag m\"><b>Settings<\u002Fb><span>five switches and an hour<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:560px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar hl\"><span class=\"lead\"><span class=\"bc\"><i class=\"g i-chev-l\"><\u002Fi><\u002Fspan><\u002Fspan><h4>Notifications<\u002Fh4><\u002Fdiv>\n<div class=\"body\">\n<div class=\"glab\">DATES<\u002Fdiv>\n<div class=\"sgroup\">\n<div class=\"srow\"><span class=\"txt\"><span class=\"t\">Due today<\u002Fspan><span class=\"n\">One message each morning.<\u002Fspan><\u002Fspan><span class=\"tog\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"srow\"><span class=\"txt\"><span class=\"t\">In the morning at<\u002Fspan><\u002Fspan><span class=\"val\">8:00<\u002Fspan><span class=\"cv\"><i class=\"g i-chev-r\"><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"srow\"><span class=\"txt\"><span class=\"t\">Coming tomorrow<\u002Fspan><span class=\"n\">One message each evening.<\u002Fspan><\u002Fspan><span class=\"tog\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"srow\"><span class=\"txt\"><span class=\"t\">In the evening at<\u002Fspan><\u002Fspan><span class=\"val\">19:00<\u002Fspan><span class=\"cv\"><i class=\"g i-chev-r\"><\u002Fi><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"glab\">PEOPLE<\u002Fdiv>\n<div class=\"sgroup\">\n<div class=\"srow\"><span class=\"txt\"><span class=\"t\">Connection requests<\u002Fspan><\u002Fspan><span class=\"tog\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"srow\"><span class=\"txt\"><span class=\"t\">Added to a shared thread<\u002Fspan><\u002Fspan><span class=\"tog off\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"glab\">ON THIS PHONE<\u002Fdiv>\n<div class=\"sgroup\">\n<div class=\"srow\"><span class=\"txt\"><span class=\"t\">System settings<\u002Fspan><span class=\"n\">Sounds, the lock screen, and turning offload off entirely.<\u002Fspan><\u002Fspan><span class=\"cv\"><i class=\"g i-chev-r\"><\u002Fi><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<ul class=\"spec\">\n<li><b>The hour rows sit under the switch they belong to<\u002Fb> and grey out with it, rather than living in a third group about time.<\u002Fli>\n<li>Labels match the notification titles word for word, so the switch that stops <b>Due today<\u002Fb> is called Due today.<\u002Fli>\n<li><b>The hour is in the account's zone<\u002Fb>, which is the section 3 default, not the device's. A digest that moves when you fly is a digest that arrives at 3am.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag m\"><b>Android<\u002Fb><span>the same five, as channels<\u002Fspan><\u002Fdiv>\n<div class=\"crop\" style=\"padding:var(--space-6) var(--gutter-screen)\">\n<div style=\"font-size:13.5px;line-height:1.7;color:var(--text-secondary)\">Each switch above is a <b style=\"color:var(--text-primary)\">NotificationChannel<\u002Fb>, so Android's own app settings shows the same four and can turn each off outside the app.<br><br><b style=\"color:var(--text-primary)\">due_today<\u002Fb> · Due today<br><b style=\"color:var(--text-primary)\">coming_tomorrow<\u002Fb> · Coming tomorrow<br><b style=\"color:var(--text-primary)\">people_requests<\u002Fb> · Connection requests<br><b style=\"color:var(--text-primary)\">shared_activity<\u002Fb> · Added to a shared thread<br><br><b style=\"color:var(--text-danger)\">A channel cannot be renamed or re-enabled by the app once it exists.<\u002Fb> The ids above are permanent from first install, and a channel the person switched off stays off however the app is updated. Worth getting the names right once.<\u002Fdiv>\n<\u002Fdiv>\n<ul class=\"spec\"><li>The in-app switch and the channel have to agree in both directions, so the page reads the channel state on open rather than trusting a stored preference.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag m\"><b>iOS<\u002Fb><span>an asymmetry worth stating<\u002Fspan><\u002Fdiv>\n<div class=\"crop\" style=\"padding:var(--space-6) var(--gutter-screen)\">\n<div style=\"font-size:13.5px;line-height:1.7;color:var(--text-secondary)\"><b style=\"color:var(--text-danger)\">iOS has no per-category switches in Settings.<\u002Fb> The system offers allow or do not allow, plus delivery style and scheduled summary. There is no Android-style list.<br><br>So on iOS <b style=\"color:var(--text-primary)\">the in-app page is the only place a person can refuse one kind and keep another<\u002Fb>, which makes it load-bearing rather than a convenience.<br><br>The existing rule holds underneath: a denied system permission gets nothing, no second ask, and Settings gains one line saying what is off and how to turn it back on.<\u002Fdiv>\n<\u002Fdiv>\n<ul class=\"spec\"><li>Categories are still registered on iOS, but for <b>actions<\u002Fb> rather than for switches: the one-item digest and the share request are the two that carry any.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"sechead\"><h2>9. The bell<\u002Fh2><u>a record of what was sent, and of what was not<\u002Fu><\u002Fdiv>\n<p class=\"snote\">Both Today screens carry a bell with a comment saying it is there for the day notifications land. It opens <b>Activity<\u002Fb>: everything offload has told you, in order, <b>plus the things it decided quietly and never told you about<\u002Fb>. That second half is what makes it worth building, because a product whose rule is \"a decline looks like silence\" accumulates a lot of silence, and none of it is currently recoverable.<\u002Fp>\n<p class=\"snote\"><b>This is a reversal of a decision from 022 and worth saying so plainly.<\u002Fb> That work refused a notifications page on the grounds that it would be \"a page that exists to hold a dot\", and it was right: a request answered on its own card leaves nothing for a list to show. <b>What changes is that there is now a record with content in it<\u002Fb>, some of which exists nowhere else in the product, and which is the only way to read your notifications when notifications are off.<\u002Fp>\n<div class=\"row\">\n<div class=\"cell\"><div class=\"tag m\"><b>Activity<\u002Fb><span>sent and unsent, newest first<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:760px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar\"><span class=\"lead\"><span class=\"bc\"><i class=\"g i-list\"><\u002Fi><\u002Fspan><\u002Fspan><h4>Today<\u002Fh4><span class=\"tools\"><span class=\"bc\"><i class=\"g i-bell\"><\u002Fi><span class=\"ndot\"><\u002Fspan><\u002Fspan><span class=\"bc\"><i class=\"g i-gear\"><\u002Fi><\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"body\"><\u002Fdiv>\n<div class=\"scrim\"><\u002Fdiv>\n<div class=\"sheet\" style=\"padding-left:0;padding-right:0\">\n<div class=\"grab\"><\u002Fdiv>\n<div class=\"st\" style=\"padding:0 var(--gutter-screen)\">Activity<\u002Fdiv>\n<div class=\"gl\">TODAY<\u002Fdiv>\n<div class=\"arow\"><span class=\"al\"><i class=\"g i-bell\"><\u002Fi><\u002Fspan><span class=\"ax\"><span class=\"at\">Due today<\u002Fspan><span class=\"ab\">Pay the rent, Tom's birthday, and three more. One is from last week.<\u002Fspan><\u002Fspan><span class=\"aw\">8:00<\u002Fspan><\u002Fdiv>\n<div class=\"arow\"><span class=\"al\"><i class=\"g i-users\"><\u002Fi><\u002Fspan><span class=\"ax\"><span class=\"at\">Ana added two things to Lisbon trip<\u002Fspan><span class=\"ab\">Ferry times, and a place in Alfama.<\u002Fspan><\u002Fspan><span class=\"aw\">7:12<\u002Fspan><\u002Fdiv>\n<div class=\"gl\">YESTERDAY<\u002Fdiv>\n<div class=\"arow\"><span class=\"al\"><i class=\"g i-bell\"><\u002Fi><\u002Fspan><span class=\"ax\"><span class=\"at\">Tomorrow<\u002Fspan><span class=\"ab\">Dentist at 9:00, and the rent.<\u002Fspan><\u002Fspan><span class=\"aw\">19:00<\u002Fspan><\u002Fdiv>\n<div class=\"arow\"><span class=\"al q\"><i class=\"g i-x\"><\u002Fi><\u002Fspan><span class=\"ax\"><span class=\"at\">Your invite to Sam expired<\u002Fspan><span class=\"ab\">Thirty days, no answer.<\u002Fspan><span class=\"aquiet\">NOT SENT<\u002Fspan><\u002Fspan><span class=\"aw\">16:40<\u002Fspan><\u002Fdiv>\n<div class=\"arow\"><span class=\"al q\"><i class=\"g i-users\"><\u002Fi><\u002Fspan><span class=\"ax\"><span class=\"at\">Ana declined Berlin in October<\u002Fspan><span class=\"ab\">Nothing was sent at the time.<\u002Fspan><span class=\"aquiet\">NOT SENT<\u002Fspan><\u002Fspan><span class=\"aw\">11:05<\u002Fspan><\u002Fdiv>\n<div class=\"gl\">EARLIER<\u002Fdiv>\n<div class=\"arow\"><span class=\"al q\"><i class=\"g i-bell\"><\u002Fi><\u002Fspan><span class=\"ax\"><span class=\"at\">Coming tomorrow was off<\u002Fspan><span class=\"ab\">Two things were due on Saturday.<\u002Fspan><span class=\"aquiet warn\">NOT SENT<\u002Fspan><\u002Fspan><span class=\"aw\">Fri<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<span class=\"rec\">recommended<\u002Fspan>\n<ul class=\"spec\">\n<li><b>A sent row and an unsent row are the same row with a different lead.<\u002Fb> Filled circle for something that reached the phone, hollow for something that did not, plus the mark. One shape, so the list reads as one record rather than two lists stapled together.<\u002Fli>\n<li><b>NOT SENT is a fact, not an apology.<\u002Fb> Amber where a setting caused it, plain grey where the product chose silence by design. The amber one is the only row that is arguably actionable, and tapping it opens the setting that suppressed it.<\u002Fli>\n<li><b>The digest row holds what was said, not what is true now.<\u002Fb> The wording is stored verbatim, so a digest that named five things still reads that way after three are ticked. <b>The notification itself opens Today<\u002Fb>; this row is the record of it, and the two are different taps on purpose.<\u002Fli>\n<li><b>No Due sheet.<\u002Fb> A forward-looking \"what is due\" view is the Timeline's job and building a second one was the weaker half of the earlier draft.<\u002Fli>\n<li><b>A dot, never a count.<\u002Fb> Something new since you last opened it. A number here would make this an inbox to clear, and nothing in it is a task.<\u002Fli>\n<li><b>Thirty days, then it purges.<\u002Fb> The same figure as the invite expiry, which keeps one retention number in the product rather than two. <b>So this is a recent record, not an archive<\u002Fb>, and the empty state has to be true of an account that has simply been quiet for a month as well as one that is new.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag m\"><b>What goes in it<\u002Fb><span>four kinds, and one of them is new<\u002Fspan><\u002Fdiv>\n<div class=\"crop\" style=\"padding:var(--space-5) 0\">\n<div class=\"arow\"><span class=\"al\"><i class=\"g i-bell\"><\u002Fi><\u002Fspan><span class=\"ax\"><span class=\"at\">Sent, and about dates<\u002Fspan><span class=\"ab\">The morning and evening digests, exactly as they were worded.<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"arow\"><span class=\"al\"><i class=\"g i-users\"><\u002Fi><\u002Fspan><span class=\"ax\"><span class=\"at\">Sent, and about people<\u002Fspan><span class=\"ab\">A connection request, and somebody adding to a thread you share.<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"arow\"><span class=\"al q\"><i class=\"g i-x\"><\u002Fi><\u002Fspan><span class=\"ax\"><span class=\"at\">Silent by design<\u002Fspan><span class=\"ab\">An invite that expired. A calendar write still waiting on them. A question that went unanswered and closed.<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"arow\" style=\"box-shadow:none\"><span class=\"al q\"><i class=\"g i-bell\"><\u002Fi><\u002Fspan><span class=\"ax\"><span class=\"at\">Silent by setting<\u002Fspan><span class=\"ab\">A digest a switch suppressed, or one the system permission refused.<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<ul class=\"spec\">\n<li><b>The third kind is the one that does not exist anywhere today.<\u002Fb> An expired invite, a calendar write nobody approved, a question that timed out: each was a deliberate silence, and each is currently unrecoverable by the person it concerned.<\u002Fli>\n<li><b>The fourth kind is why this survives a person turning notifications off.<\u002Fb> That was the request, and it is also the honest answer to iOS having no per-category switches: whatever the system allows through, the record is complete.<\u002Fli>\n<li><span class=\"verdict yes\">settled<\u002Fspan> <b>A decline is recorded.<\u002Fb> The people work made a decline indistinguishable from silence, and that rule holds where it was aimed: nothing is sent, nothing interrupts, and re-requesting stays rate limited on the server. <b>A line in a record somebody opened deliberately is not a notification.<\u002Fb><\u002Fli>\n<li><b>So it is worded flatly and offers nothing.<\u002Fb> \"Ana declined Berlin in October\", and underneath, that nothing was sent at the time. No retry, no explanation, no softening: a no that arrives with a button is a no the product is arguing with.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div class=\"cell\"><div class=\"tag m\"><b>Nothing yet<\u002Fb><span>every account, week one<\u002Fspan><\u002Fdiv>\n<div class=\"ph\" style=\"height:640px\">\n<div class=\"sb\"><span>9:41<\u002Fspan><u><span class=\"sig\"><\u002Fspan><span class=\"bat\"><\u002Fspan><\u002Fu><\u002Fdiv>\n<div class=\"bar\"><span class=\"lead\"><span class=\"bc\"><i class=\"g i-list\"><\u002Fi><\u002Fspan><\u002Fspan><h4>Today<\u002Fh4><span class=\"tools\"><span class=\"bc\"><i class=\"g i-bell\"><\u002Fi><\u002Fspan><span class=\"bc\"><i class=\"g i-gear\"><\u002Fi><\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"body\"><\u002Fdiv>\n<div class=\"scrim\"><\u002Fdiv>\n<div class=\"sheet\" style=\"padding-left:0;padding-right:0\">\n<div class=\"grab\"><\u002Fdiv>\n<div class=\"st\" style=\"padding:0 var(--gutter-screen)\">Activity<\u002Fdiv>\n<div class=\"emptybox\"><b>Nothing yet<\u002Fb><span>What offload sends you is kept here, and so is what it decided not to send.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<ul class=\"spec\">\n<li><b>The second line is the whole pitch for the screen<\u002Fb>, and it is the only place a person will ever be told that the silences are recorded. It has to be in the empty state, because after the first week nobody reads one.<\u002Fli>\n<li>No button. There is nothing to do here.<\u002Fli>\n<li><b>Web gets the same list as a pane<\u002Fb>, reached from the sidebar rather than a bell, since the web shell has none. Web still sends no notifications in this pass, which makes the record the only thing web has, and that is an argument for it rather than against.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"sechead\"><h2>10. What this asks of code<\u002Fh2><u>settled above, open below<\u002Fu><\u002Fdiv>\n<table class=\"mx\">\n<tbody><tr><th>#<\u002Fth><th>Item<\u002Fth><th>Where<\u002Fth><\u002Ftr>\n<tr><td>1<\u002Ftd><td><b><code>accounts.time_zone<\u002Fcode>, <code>accounts.last_seen_time_zone<\u002Fcode>, <code>accounts.follow_device<\u002Fcode>.<\u002Fb> The first is read by <code>dates.ts<\u002Fcode> and by the prompt's <b>today<\u002Fb>, which that file already names as the two places that change.<\u002Ftd><td>migration, <code>accounts<\u002Fcode>, <code>dates.ts<\u002Fcode>, the filing prompt<\u002Ftd><\u002Ftr>\n<tr><td>2<\u002Ftd><td><b>A person-facing write path for dates.<\u002Fb> Everything today goes through the model's tool layer under a job. A sheet tap is neither, so it needs the ordinary authenticated route that <code>edit_content<\u002Fcode>'s internals already back, taking title, body, the three dates, <code>repeats<\u002Fcode> and <code>repeats_until<\u002Fcode> in <b>one write<\u002Fb>.<\u002Ftd><td><code>routes/threads.ts<\u002Fcode><\u002Ftd><\u002Ftr>\n<tr><td>3<\u002Ftd><td><b>Clearing a date.<\u002Fb> Null through the tool layer means \"not stated\". The person-facing route needs an explicit clear, or a date can be set and never removed.<\u002Ftd><td>same route<\u002Ftd><\u002Ftr>\n<tr><td>4<\u002Ftd><td><b>Recurrence becomes an RRULE column.<\u002Fb> The enum holds four of the seven presets and none of Custom: no interval, no weekday set, no monthly anchor, no occurrence count. RFC 5545 is exactly the expressiveness the dialog needs, it is what Google speaks so 019 stops translating, and the six existing values map into it losslessly. <b>Decided. The largest item here, and the one to schedule first<\u002Fb>, since items 5 and 6 both sit on top of it.<\u002Ftd><td>migration, <code>schema.ts<\u002Fcode>, <code>connectors/write.ts<\u002Fcode><\u002Ftd><\u002Ftr>\n<tr><td>5<\u002Ftd><td><b><code>edit_content<\u002Fcode> gains the recurrence field<\u002Fb>, and <code>add_content<\u002Fcode> and <code>add_note<\u002Fcode> take a rule rather than the enum. The edit tool never took <code>repeats<\u002Fcode> at all, so today a recurrence can be created and never changed, by anyone.<\u002Ftd><td><code>routes/tools.ts<\u002Fcode>, <code>harness/tools.py<\u002Fcode><\u002Ftd><\u002Ftr>\n<tr><td>6<\u002Ftd><td><b>The content row draws its date, colour-coded, on all three surfaces.<\u002Fb> Prerequisite for sections 4 and 9. The late / soon / later boundary is <b>today plus three days<\u002Fb>, in the account's zone, computed once and shared.<\u002Ftd><td><code>ContentRow.tsx<\u002Fcode>, <code>ContentRowView.tsx<\u002Fcode>, the Android twin<\u002Ftd><\u002Ftr>\n<tr><td>7<\u002Ftd><td><b>An hour on a due date is legal.<\u002Fb> <code>dates.ts<\u002Fcode>'s comment saying a due date has no time anybody expects to see is now wrong and wants amending. No column changes; <code>attrs.all_day<\u002Fcode> already carries the distinction.<\u002Ftd><td><code>threads/dates.ts<\u002Fcode>, a comment<\u002Ftd><\u002Ftr>\n<tr><td>8<\u002Ftd><td><b>Two scheduled sends per account per day<\u002Fb>, in the account's zone, skipped when empty. The jobs table already does daily chains with <code>runAfter<\u002Fcode> and a day-keyed idempotency key.<\u002Ftd><td><code>jobs/queue.ts<\u002Fcode>, a new <code>account.digest<\u002Fcode> kind<\u002Ftd><\u002Ftr>\n<tr><td>9<\u002Ftd><td><b>Push tokens, and two registered categories per platform.<\u002Fb> One with actions, one without. Android needs the four channel ids fixed before first install, because a channel cannot be renamed once it exists.<\u002Ftd><td>new table, <code>apps/mobile<\u002Fcode><\u002Ftd><\u002Ftr>\n<tr><td>10<\u002Ftd><td><b>An activity table, written by every send and by four silent outcomes.<\u002Fb> This is the largest new thing on the list and the only one with no existing shape: an expired invite, a waiting calendar write, a closed question and a suppressed digest each need a writer at the point the silence happens, not a reconstruction afterwards.<\u002Ftd><td>new table, <code>people.daily<\u002Fcode>, <code>connectors/<\u002Fcode>, <code>questions.ts<\u002Fcode>, the digest job<\u002Ftd><\u002Ftr>\n<tr><td>11<\u002Ftd><td><b>The sent copy is stored verbatim<\u002Fb> on the activity row, rather than re-rendered from the rows it named. A digest that said five things is still that sentence after two of them are ticked. Purged at <b>thirty days<\u002Fb>, matching the invite expiry.<\u002Ftd><td>same table<\u002Ftd><\u002Ftr>\n<tr><td>12<\u002Ftd><td><b>The digest reads <code>is_reminder<\u002Fcode>.<\u002Fb> The query is the date range and the flag, so the filing prompt's decision to set it is now load bearing and wants a principle and eval cases of its own.<\u002Ftd><td>digest job, <code>prompts/<\u002Fcode>, <code>evals/principles/<\u002Fcode><\u002Ftd><\u002Ftr>\n<tr><td>13<\u002Ftd><td><b>A model-moved date draws the change mark and writes an activity row.<\u002Fb> Both mechanisms exist; what is new is that an <code>edit_content<\u002Fcode> touching a date is a thing worth recording, where until now only creation was.<\u002Ftd><td><code>ContentRow.tsx<\u002Fcode>, the activity writer<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<ul class=\"spec\">\n<li><span class=\"verdict yes\">everything on this page is now settled<\u002Fspan> Nothing below is a question. The four items are consequences of the calls made, and each one is a thing code has to decide <i>how<\u002Fi> to do rather than <i>whether<\u002Fi>.<\u002Fli>\n<li><b>The gate is the headline.<\u002Fb> <code>is_reminder<\u002Fcode> decides what is announced, so the digest job's query is <code>due_at<\u002Fcode> in range <b>and<\u002Fb> <code>is_reminder = true<\u002Fcode>. Everything else in this design works whether that flag is on or off; the volume of notifications does not.<\u002Fli>\n<li><b>The filing prompt now carries a decision it has never had to make.<\u002Fb> Marking <code>is_reminder<\u002Fcode> was free when nothing read it. It is now the difference between a person being told and not being told, which makes it worth a principle and an eval case, in the same way principle 04 governs the dates themselves.<\u002Fli>\n<li><b>A person cannot ask to be reminded.<\u002Fb> The flag has no person-facing writer by decision, so the bell mark in section 4 reports it and nothing sets it. If that proves wrong it is one switch in a sheet that already exists, which is a cheap thing to be wrong about.<\u002Fli>\n<li><b>Nothing is sticky.<\u002Fb> The model may move a date a person set, where the dump states a new one, so the change mark and the Activity row are the whole defence. Both already exist.<\u002Fli>\n<\u002Ful>\n\n<\u002Fdiv>\n<\u002Fbody><\u002Fhtml>"
  </script>
