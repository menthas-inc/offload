  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

              const { done, value } = await reader.read();

              chunks.push(value);
              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html data-theme=\"light\"><head><meta charset=\"utf-8\"><title>A thread's map, final<\u002Ftitle>\n<style>/* offload webfonts. Two faces only, served as static instances from assets/fonts, the same\n   five files and the same five rules the web app declares (22 September 2026). Instrument Sans\n   is the whole interface; Literata is the voice offload speaks in. Numerals use Instrument Sans\n   with tabular figures, so there is no third face.\n   Static instances lose two things the variable CDN files had: Instrument Sans has no 700, so\n   anything asking for bold resolves to 600; and Literata has no optical size axis, so the\n   display sizes of the serif are drawn from the text master until the variable file is in. */\n@font-face{font-family:\"Instrument Sans\";src:url(\"88528c17-c586-47e1-a136-a5480d40a76d\") format(\"truetype\");font-weight:400;font-style:normal;font-display:swap}\n@font-face{font-family:\"Instrument Sans\";src:url(\"bf8621cd-84cd-499b-b97f-8370614a36e1\") format(\"truetype\");font-weight:500;font-style:normal;font-display:swap}\n@font-face{font-family:\"Instrument Sans\";src:url(\"4a83f92a-1456-4f5b-9af0-7a86ab4179d1\") format(\"truetype\");font-weight:600 700;font-style:normal;font-display:swap}\n@font-face{font-family:\"Literata\";src:url(\"36119637-9a7c-4d7d-8d1b-69d4c10da47c\") format(\"truetype\");font-weight:400;font-style:normal;font-display:swap}\n@font-face{font-family:\"Literata\";src:url(\"2dae4d4f-a2d2-4324-955d-3f416c269dec\") format(\"truetype\");font-weight:500 700;font-style:normal;font-display:swap}\n\n:root{\n  /* Base neutrals, pure achromatic. offload is black on white; grey does the work. */\n  --paper:#FFFFFF;\n  --ink-50:#F8F8F8;\n  --ink-100:#F2F2F2;\n  --ink-150:#EAEAEA;\n  --ink-200:#DEDEDE;\n  --ink-300:#C4C4C4;\n  --ink-400:#9E9E9E;\n  --ink-500:#7A7A7A;\n  --ink-600:#5C5C5C;\n  --ink-700:#3A3A3A;\n  --ink-800:#232323;\n  --ink-900:#141414;\n  --ink-950:#0B0B0B;\n\n  /* Accent, moss. One accent only, used at low volume. */\n  --moss-50:#F2F6F3;\n  --moss-100:#E4EDE7;\n  --moss-200:#C7DACD;\n  --moss-500:#4E8060;\n  --moss-600:#3F6B4F;\n  --moss-700:#2F5240;\n\n  /* Second accent, ink blue. Cool, so it never competes with moss.\n     One job: this needs you. Waiting, unresolved, or about to expire. */\n  --blue-50:#F4F7FF;\n  --blue-100:#E8EEFF;\n  --blue-200:#C9D6FA;\n  --blue-500:#4A68DE;\n  --blue-600:#3355D6;\n  --blue-700:#2440A8;\n  --blue-900:#1B2E7A;\n\n  /* Semantics, pitched at the same depth and saturation as the two accents,\n     so a warning sits beside moss and blue without looking washed out. */\n  --amber-100:#FFF1CC;\n  --amber-600:#F0A81E;\n  --amber-700:#7A4E02;\n  --amber-on:#0B0B0B; /* text colour on --amber-600, ink, never white */\n  --text-on-solid:#FFFFFF; /* text on moss/blue/clay fills, identical in both themes */\n  --clay-100:#FBE6E1;\n  --clay-200:#F3C6BC;\n  --clay-600:#C0392B;\n  --clay-700:#93261A;\n\n  /* Semantic aliases, always prefer these in components. */\n  --text-primary:var(--ink-950);\n  --text-secondary:var(--ink-600);\n  --text-tertiary:#6E6E6E; /* 4.5:1 on every light surface; --ink-400 was 2.55 and failed */\n  --text-inverse:var(--paper);\n  --text-accent:var(--moss-600);\n  --text-attention:var(--blue-600);\n  --text-on-attention:var(--blue-900);\n  --text-link:var(--ink-950);\n  --text-danger:var(--clay-600);\n\n  --surface-page:#FAF9F7;\n  --surface-raised:var(--paper);\n  /* The phone's bottom plate and a raised conversation: the ground the prism\n     field sits on, and by definition the colour its veil is made of. Kept as\n     one token so the two can never disagree. */\n  --surface-plate:var(--paper);\n  --surface-sunken:var(--ink-50);\n  --surface-card:var(--paper);\n  --surface-fill:var(--ink-100);\n  --surface-fill-strong:var(--ink-150);\n  --surface-inverse:var(--ink-950);\n  --surface-accent-soft:var(--moss-50);\n  --surface-attention-soft:var(--blue-100);\n  --surface-attention:var(--blue-600);\n  /* Amber has meant \"offload noticed this\" since the kits drew a Noticed\n     memory, and had no alias to say so: every use reached for the ramp, which\n     the rules forbid and the lint file could not catch because there was\n     nothing to point at. 015's rail is the second surface to need it, so the\n     alias is the fix rather than a third literal. */\n  --surface-noticed:var(--amber-600);\n  /* 023's date chip: the two soft grounds a row's nearness is drawn on. Amber\n     rather than blue for soon, because blue is the attention colour and would\n     read as offload asking for something; clay for late, the pair a failure\n     already uses. Minted because the ramps had no alias and code may not\n     consume a ramp. */\n  --surface-noticed-soft:var(--amber-100);\n  --surface-danger-soft:var(--clay-100);\n  --surface-scrim:rgba(11,11,11,0.35);\n  --surface-scrim-soft:rgba(11,11,11,0.16);\n  --surface-chrome:var(--surface-raised);\n  --surface-input:var(--ink-100);\n  --surface-chrome-strong:var(--surface-raised);\n\n  --border-hairline:var(--ink-150);\n  --border-strong:#8C8C8C; /* 3:1 on every light surface: fields, checkboxes, outlined buttons */\n  --border-focus:var(--blue-500);\n  --border-accent:var(--moss-200);\n  --border-attention:var(--blue-200);\n  --border-danger:var(--clay-200);\n  /* The edge of a raised cell that has to read at 49px. Light leans on the drop shadow and\n     takes the hairline; dark has no drop shadow, so the edge carries the card alone and\n     needs a step more. One alias so the two themes cannot drift apart by hand. */\n  --border-lift:var(--border-hairline);\n  /* A day, or a thing, carrying something that needs an answer. The ink amber in each\n     scope rather than the fill: --amber-600 as a 1px ring on paper measures 2.03:1. */\n  --border-decision:var(--amber-700);\n  /* The ink-weight counterpart to --surface-noticed, for a mark offload noticed drawn on a\n     raised surface rather than as a fill: --surface-noticed measures 2.03:1 on paper. Sits\n     beside its surface token the way --text-accent sits beside --surface-accent-soft. */\n  --text-noticed:var(--amber-700);\n  /* The plane a photo is shown on, over whatever was on screen. Not --surface-scrim, which\n     is 0.35 and dims what is behind it: this is a surface in its own right. Light dims\n     towards ink and reads as depth. Dark is OPAQUE, because a translucent plane in dark has\n     nowhere to go: --surface-page at 92% over --surface-page measures 1.00:1, and even the\n     darkest value reaches only 1.11:1. What says a viewer is open there is that the screen\n     behind it is gone. */\n  --surface-viewer:color-mix(in srgb,var(--surface-inverse) 90%,transparent);\n\n  --state-hover:rgba(11,11,11,0.04);\n  --state-press:rgba(11,11,11,0.08);\n  --state-selected:var(--ink-100);\n  --state-disabled-text:var(--ink-400);\n  --state-disabled-surface:var(--ink-100);\n}\n\n\n/* Light, restated as a scope so a document can pin itself to it. Same values as\n   :root; needed because the semantic aliases resolve where they are declared. */\n[data-theme=\"light\"]{\n  --paper:#FFFFFF;\n  --ink-50:#F8F8F8;--ink-100:#F2F2F2;--ink-150:#EAEAEA;--ink-200:#DEDEDE;--ink-300:#C4C4C4;\n  --ink-400:#9E9E9E;--ink-500:#7A7A7A;--ink-600:#5C5C5C;--ink-700:#3A3A3A;--ink-800:#232323;\n  --ink-900:#141414;--ink-950:#0B0B0B;\n  --moss-50:#F2F6F3;--moss-100:#E4EDE7;--moss-200:#C7DACD;--moss-500:#4E8060;--moss-600:#3F6B4F;--moss-700:#2F5240;\n  --blue-50:#F4F7FF;--blue-100:#E8EEFF;--blue-200:#C9D6FA;--blue-500:#4A68DE;--blue-600:#3355D6;\n  --blue-700:#2440A8;--blue-900:#1B2E7A;\n  --amber-100:#FFF1CC;--amber-600:#F0A81E;--amber-700:#7A4E02;--amber-on:#0B0B0B;--text-on-solid:#FFFFFF;\n  --clay-100:#FBE6E1;--clay-200:#F3C6BC;--clay-600:#C0392B;--clay-700:#93261A;\n  --text-primary:var(--ink-950);--text-secondary:var(--ink-600);--text-tertiary:#6E6E6E; /* 4.5:1 on every light surface; --ink-400 was 2.55 and failed */\n  --text-inverse:var(--paper);--text-accent:var(--moss-600);--text-attention:var(--blue-600);\n  --text-on-attention:var(--blue-900);--text-link:var(--ink-950);--text-danger:var(--clay-600);\n  --surface-page:#FAF9F7;--surface-raised:var(--paper);--surface-plate:var(--paper);--surface-sunken:var(--ink-50);\n  --surface-card:var(--paper);--surface-fill:var(--ink-100);--surface-fill-strong:var(--ink-150);\n  --surface-inverse:var(--ink-950);--surface-accent-soft:var(--moss-50);\n  --surface-attention-soft:var(--blue-100);--surface-attention:var(--blue-600);\n  --surface-noticed:var(--amber-600);--surface-noticed-soft:var(--amber-100);--surface-danger-soft:var(--clay-100);\n  --surface-scrim:rgba(11,11,11,0.35);--surface-scrim-soft:rgba(11,11,11,0.16);\n  --surface-chrome:var(--surface-raised);--surface-chrome-strong:var(--surface-raised);\n  --surface-input:var(--ink-100);\n  --border-hairline:var(--ink-150);--border-strong:#8C8C8C; /* 3:1 on every light surface: fields, checkboxes, outlined buttons */--border-focus:var(--blue-500);\n  --border-accent:var(--moss-200);--border-attention:var(--blue-200);--border-danger:var(--clay-200);\n  --border-lift:var(--border-hairline);--border-decision:var(--amber-700);--text-noticed:var(--amber-700);\n  --surface-viewer:color-mix(in srgb,var(--surface-inverse) 90%,transparent);\n  --state-hover:rgba(11,11,11,0.04);--state-press:rgba(11,11,11,0.08);\n  --state-selected:var(--ink-100);--state-disabled-text:var(--ink-400);--state-disabled-surface:var(--ink-100);\n  --shadow-1:0 1px 2px rgba(11,11,11,0.04);--shadow-2:0 4px 16px -4px rgba(11,11,11,0.08);\n  --shadow-3:0 12px 32px -8px rgba(11,11,11,0.12);--shadow-sheet:0 -8px 40px -12px rgba(11,11,11,0.14);\n  color-scheme:light;\n}\n\n/* Dark, charcoal with lifted surfaces. Applied by [data-theme=\"dark\"] on <html>,\n   or by the system setting when the app is left on Auto. Every alias is restated\n   so it resolves against these base values rather than the ones on :root. */\n[data-theme=\"dark\"]{\n  --paper:#191919;\n  --ink-50:#212121;--ink-100:#232323;--ink-150:#2C2C2C;--ink-200:#383838;--ink-300:#4A4A4A;\n  --ink-400:#767676;--ink-500:#969696;--ink-600:#B3B3B3;--ink-700:#C2C2C2;--ink-800:#D8D8D8;\n  --ink-900:#E4E4E4;--ink-950:#EDEDED;\n\n  /* The semantics do NOT shift with the theme: a moss chip is the same moss at\n     midnight as at noon. Only the tints (50/100) darken, because a tint is a\n     surface, and a surface has to belong to the page it sits on. */\n  --moss-50:#182E20;--moss-100:#1E3928;--moss-200:#2C5A3F;--moss-500:#4E8060;--moss-600:#3F6B4F;--moss-700:#5A8E6C;\n  --blue-50:#161F42;--blue-100:#1E2A57;--blue-200:#334388;--blue-500:#4A68DE;--blue-600:#3355D6;\n  --blue-700:#5273E8;--blue-900:#D6DEFF;\n  --amber-100:#3E2E08;--amber-600:#F0A81E;--amber-700:#F6C86A;--amber-on:#0B0B0B;--text-on-solid:#FFFFFF;\n  --clay-100:#3E1915;--clay-200:#6B2A22;--clay-600:#C0392B;--clay-700:#F9A99E;\n\n  --text-primary:var(--ink-950);--text-secondary:var(--ink-600);--text-tertiary:#959595; /* 4.5:1 on every dark surface, including the input */\n  --text-inverse:#191919;--text-accent:#82BC97;--text-attention:#95A9F7;\n  --text-on-attention:#D6DEFF;--text-link:var(--ink-950);--text-danger:#F28679;\n\n  --surface-page:#1C1B19;--surface-raised:#212121;\n  --surface-plate:#0F0F11; /* = --prism-veil-rgb; the plate is darker than a card on purpose */\n  --surface-card:#212121;--surface-sunken:#101010;\n  --surface-fill:var(--ink-100);--surface-fill-strong:var(--ink-150);--surface-inverse:var(--ink-950);\n  --surface-accent-soft:var(--moss-50);--surface-attention-soft:var(--blue-100);\n  --surface-attention:var(--blue-600);--surface-noticed:var(--amber-600);--surface-noticed-soft:var(--amber-100);\n  --surface-danger-soft:var(--clay-100);--surface-scrim:rgba(0,0,0,0.55);\n  --surface-scrim-soft:rgba(0,0,0,0.50);\n  --surface-chrome:var(--surface-raised);--surface-chrome-strong:var(--surface-raised);\n  --surface-input:#2E2E2E;\n\n  --border-hairline:var(--ink-150);--border-strong:#777777;--border-focus:var(--blue-500);\n  --border-accent:var(--moss-200);--border-attention:var(--blue-200);--border-danger:var(--clay-200);\n  /* A step up from the hairline, because dark has no drop shadow: --shadow-1 is none here,\n     so the edge is the whole of the lift. 1.94:1 against the page against the hairline's 1.23. */\n  --border-lift:var(--ink-300);--border-decision:var(--amber-700);--text-noticed:var(--amber-700);\n  --surface-viewer:var(--surface-plate); /* opaque: a mix of the page measures 1.00:1 against it */\n\n  --state-hover:rgba(255,255,255,0.06);--state-press:rgba(255,255,255,0.10);\n  --state-selected:var(--ink-100);--state-disabled-text:var(--ink-400);--state-disabled-surface:var(--ink-100);\n\n  /* Shadows do nothing on dark; surfaces separate by value instead. */\n  --shadow-1:none;--shadow-2:0 1px 0 rgba(255,255,255,0.04);--shadow-3:0 8px 28px rgba(0,0,0,0.6);\n  --shadow-sheet:0 -10px 34px -10px rgba(0,0,0,0.65);\n  color-scheme:dark;\n}\n\n/* Labels, 26 September 2026. Ten solids a person's label is drawn in, with --text-on-solid on\n   every one at 4.6:1 or better. Identical in both themes, as moss and blue are: on the dark page\n   they measure about 3.7:1, which clears the 3:1 a shape needs, and a label's words always sit on\n   the solid, never on the page. The hues keep clear of moss, blue, amber and clay. The number is\n   the order a new label takes the next free one in, spaced so the first three are far apart:\n   cerulean, rose, leaf, grape, copper, teal, fuchsia, olive, iris, jade.\n   --surface-accent is the solid accent as a surface, which two components paint (023). */\n:root,[data-theme=\"light\"],[data-theme=\"dark\"]{\n  --label-1:#0C7BB0;--label-2:#C6467B;--label-3:#5D7F00;--label-4:#8D5CC5;--label-5:#B25D25;\n  --label-6:#088285;--label-7:#AD4EAC;--label-8:#7D7616;--label-9:#6F67CB;--label-10:#06855A;\n  --surface-accent:var(--moss-600);\n}\n\n/* A glyph drawn on a well or beside a row: the app's iconOnWell, in both themes (1 October). */\n:root,[data-theme=\"light\"],[data-theme=\"dark\"]{--icon-on-well:var(--text-secondary)}\n\n:root{\n  --font-core:\"Instrument Sans\",\"Helvetica Neue\",Helvetica,sans-serif;\n  /* The voice offload speaks in. Upright, low contrast, warm, easy to read\n     in a chat, not editorial. */\n  --font-quiet:\"Literata\",Georgia,serif;\n\n  --weight-regular:400;\n  --weight-medium:500;\n  --weight-semibold:600;\n\n  /* Larger text scales type and nothing else: every width, gutter, radius and\n     icon stays a literal pixel. Read this where a one-off literal has to move\n     with the type; the eight size tokens are overridden outright below. */\n  --type-scale:1;\n\n  /* Mobile-first scale. Sizes are literal px, not a ratio. */\n  --size-display:34px;\n  --size-title-1:26px;\n  --size-title-2:21px;\n  --size-title-3:17px;\n  --size-body:16px;\n  --size-body-sm:14px;\n  --size-label:13px;\n  --size-caption:12px;\n\n  --leading-display:1.06;\n  --leading-title:1.2;\n  --leading-body:1.45;\n  --leading-tight:1.3;\n\n  --tracking-display:-0.022em;\n  --tracking-title:-0.014em;\n  --tracking-body:-0.006em;\n  /* No uppercase role remains in the interface. Kept only for a rare tracked-out\n     wordmark or print setting; never for UI labels. */\n  --tracking-caps:0.08em;\n\n  /* Composite text roles */\n  --text-display:var(--weight-semibold) var(--size-display)/var(--leading-display) var(--font-core);\n  --text-title-1:var(--weight-semibold) var(--size-title-1)/var(--leading-title) var(--font-core);\n  --text-title-2:var(--weight-semibold) var(--size-title-2)/var(--leading-title) var(--font-core);\n  --text-title-3:var(--weight-medium) var(--size-title-3)/var(--leading-tight) var(--font-core);\n  --text-body-role:var(--weight-regular) var(--size-body)/var(--leading-body) var(--font-core);\n  --text-body-sm-role:var(--weight-regular) var(--size-body-sm)/var(--leading-tight) var(--font-core);\n  --text-label-role:var(--weight-medium) var(--size-label)/var(--leading-tight) var(--font-core);\n  --text-caption-role:var(--weight-regular) var(--size-caption)/var(--leading-tight) var(--font-core);\n  --text-quiet-role:var(--weight-regular) var(--size-body)/var(--leading-body) var(--font-quiet);\n  /* Numerals. No mono face, Instrument Sans with tabular figures, so\n     timestamps and counts hold their column. */\n  --text-numeric-role:var(--weight-regular) var(--size-caption)/var(--leading-tight) var(--font-core);\n}\n\n/* Larger text, the Settings choice. Whole pixels at 1.15 rather than calc() on\n   the base sizes: the token generator resolves values for clients that cannot\n   follow a var(), and React Native cannot parse a calc. Scoped without :root on\n   purpose, since the generator reads every :root block as the light theme and\n   would take these as the base. */\n[data-type=\"large\"]{\n  --type-scale:1.15;\n  --size-display:39px;\n  --size-title-1:30px;\n  --size-title-2:24px;\n  --size-title-3:20px;\n  --size-body:18px;\n  --size-body-sm:16px;\n  --size-label:15px;\n  --size-caption:14px;\n}\n\n:root{\n  --space-0:0px;\n  --space-1:2px;\n  --space-2:4px;\n  --space-3:6px;\n  --space-4:8px;\n  --space-5:12px;\n  --space-6:16px;\n  --space-7:20px;\n  --space-8:24px;\n  --space-9:32px;\n  --space-10:40px;\n  --space-11:56px;\n  --space-12:72px;\n\n  /* Layout constants */\n  --gutter-screen:20px;       /* left/right padding on every mobile screen */\n  --gutter-section:32px;      /* vertical rhythm between screen sections */\n  --row-height:56px;          /* standard list row */\n  --row-height-lg:72px;       /* row with two lines of text */\n  --tap-min:44px;             /* minimum TOUCH target. A control may be drawn\n                                 smaller if its hit area still reaches this. */\n  --appbar-height:52px;\n  --tabbar-height:64px;\n  --composer-height:52px;\n  --breakpoint-sm:600px;      /* one pane, phone layout below this */\n  --breakpoint-md:900px;\n  --breakpoint-lg:1180px;     /* ut:cubic-bezier(0.4,0,0.2,1); /* @kind other */\n  --ease-entrance:cubic-bezier(0.16,1,0.3,1); /* @kind other */\n  --transition-ui:var(--duration-fast) var(--ease-out); /* @kind other */\n  --press-scale:0.98; /* @kind other */\n}\n\n/* Reduced motion is a cut. Not a shorter slide, not a cross-fade: the new state is simply\n   there. Panes, the iOS push, Material's shared axis, the drawn tick, the toast rise and\n   every hover transition all stop moving. 0.01ms rather than 0 so animation-end still\n   fires and nothing that waits on it gets stuck. */\n@media (prefers-reduced-motion: reduce){\n  *,*::before,*::after{\n    animation-duration:0.01ms !important;\n    animation-iteration-count:1 !important;\n    animation-delay:0ms !important;\n    transition-duration:0.01ms !important;\n    transition-delay:0ms !important;\n    scroll-behavior:auto !important;\n  }\n}\n\n:root{\n  /* The prism field. Phones only.\n\n     A baked texture held frozen, warped for a moment when offload files\n     something. The web atmosphere on the marketing surfaces is a different\n     thing built from live washes and a WebGL shader; this is its descendant,\n     reduced to what a phone can afford.\n\n     None of these are suggestions. The density and the veil pair were measured\n     together against `--text-tertiary`, which sits at exactly 4.5:1 on paper\n     and has no headroom, so moving one without re-measuring the other takes a\n     tab label under the floor. */\n\n  /* The texture's own opacity, before density. */\n  --prism-alpha:0.36; /* @kind other */\n  --prism-density:1.4; /* @kind other */\n\n  /* What the fill is made of. White on paper; on dark it has to be the dark\n     ground, or the grade lifts the tab strip to grey exactly where it should be\n     disappearing. Space-separated so it can carry an alpha per stop. */\n  --prism-veil-rgb:255 255 255; /* @kind other */\n\n  /* The fill between the field and any text. Graded, not flat: a flat fill at\n     --prism-veil-full leaves the field at a sixth of its strength, and no\n     density can buy that back, because the fill eats whatever density adds. */\n  /* The thinnest the fill gets, across the middle band where only the composer\n     pill sits and the pill is opaque anyway. */\n  --prism-veil-top:0.38; /* @kind other */\n  /* The fill is FULL at both edges and thin only in between. Since the field's\n     own profile now closes symmetrically at both ends, the veil is no longer\n     what does the fading: its remaining job is contrast over the tab labels,\n     which sit across the lower third. So it thins early and closes again before\n     them, and stays full at the top where the field is already zero. */\n  --prism-veil-edge:16%; /* @kind other */\n  /* By the time text appears. */\n  --prism-veil-full:0.86; /* @kind other */\n  /* The thin band, then full again by here, clear of any label.\n\n     --prism-veil-reach is the one stop that is not free to move: full fill has\n     to be reached above the tab labels, which start at 64% of the band. That\n     makes 0 to 64% the visible window, and everything else is derived from it.\n     The thin band is centred in that window and its two ramps are the same\n     length, 16% either side of the 32% midpoint, and PrismField shapes the\n     field's own alpha to the same window. Both layers symmetric about the same\n     centre is what makes the COMPOSITE symmetric: tuning either one alone does\n     not, since what the eye sees is the product of the two. */\n  --prism-veil-hold:48%; /* @kind other */\n  --prism-veil-reach:64%; /* @kind other */\n\n  /* Live shader per arrival, and the clock eases to a stop over the last of it. */\n  --prism-run:2000ms; /* @kind other */\n  --prism-settle:700ms; /* @kind other */\n  /* Displacement amplitude, in texture pixels. */\n  --prism-warp:11; /* @kind other */\n\n  /* Written by PrismField itself as the list scrolls, clamped inside the\n     texture's 16% horizontal overhang. Declared -content:center;gap:8px;border-radius:99px;background:var(--surface-fill);color:var(--text-primary);font:var(--weight-medium) 15px/1 var(--font-core);cursor:pointer}.btn .g{width:16px;height:16px}\n.btn.pri{background:var(--surface-inverse);color:#fff}.btn.pri .g{background:#fff}\n/* plat */\n.plat{position:sticky;top:12px;z-index:1000;display:inline-flex;gap:2px;padding:3px;border-radius:99px;background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--border-hairline),var(--shadow-2);margin:0 0 8px}\n.plat button{height:32px;padding:0 16px;border-radius:99px;border:0;background:transparent;font:var(--weight-medium) 13px/1 var(--font-core);color:var(--text-secondary);cursor:pointer}\n.plat button.on{background:var(--surface-inverse);color:var(--text-inverse)}\n.wsb{display:none}\n[data-plat=android] .ph:not(.web){width:412px}\n[data-plat=android] .st{padding:12px 20px 6px;font:var(--weight-medium) 13px/1 var(--font-core)}\n[data-plat=android] .ab{height:64px}[data-plat=android] .ab b{text-align:left;font-size:22px;font-weight:400}\n[data-plat=android] .seg{padding:0;background:transparent;box-shadow:inset 0 0 0 1px #79786F}[data-plat=android] .seg span{width:44px;height:32px}[data-plat=android] .seg span.on{background:var(--surface-accent-soft);color:var(--moss-700);box-shadow:none}\n[data-plat=android] .chip{border-radius:8px}[data-plat=android] .tile{border-radius:8px}\n[data-plat=android] .plate{border-radius:28px 28px 0 0;padding-bottom:20px}\n[data-plat=android] .callout{border-radius:16px}[data-plat=android] .cb span{height:36px}\n[data-plat=android] .isheet{border-radius:28px 28px 0 0;background:#F6F5F2}[data-plat=android] .btn{height:40px;font-size:14px}[data-plat=android] .btn:not(.pri){background:transparent;box-shadow:inset 0 0 0 1px #79786F}\n/* web */\n.ph.web,[data-plat=web] .ph{width:960px;height:640px;border-radius:14px;display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}\n.ph.web .st,[data-plat=web] .ph .st,.ph.web .plate,[data-plat=web] .ph .plate{display:none}\n.ph.web .wsb,[data-plat=web] .wsb{display:flex;grid-row:1/-1;flex-direction:column;gap:2px;padding:18px 10px;background:#161614;color:#EDEDED}\n.wsb b{font:var(--weight-semibold) 17px/1 var(--font-core);padding:0 10px 18px}\n.wsb span{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;font:var(--weight-medium) 13.5px/1 var(--font-core);color:#B3B3B3;position:relative}.wsb span .g{width:16px;height:16px}\n.wsb span.on{background:#262624;color:#fff}.wsb span.on:before{content:\"\";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--blue-600)}\n.ph.web .ab,[data-plat=web] .ph .ab{height:56px;padding:0 32px}.ph.web .ab b,[data-plat=web] .ph .ab b{text-align:left}\n[data-plat=web] .ph .body:not(.full),.ph.web:not(.wide) .body:not(.full){width:100%;max-width:680px;justify-self:center}\n.ph.web:not(.wide) .mchips{padding:12px 24px}.ph.mid{width:1000px}\n[data-plat=web] .ph .mchips{padding:12px 24px}\n.ph.web .scrim,[data-plat=web] .ph .scrim{display:none}\n.ph.web .isheet,[data-plat=web] .ph .isheet{left:auto;top:0;width:360px;border-radius:0;box-shadow:-1px 0 0 var(--border-hairline),var(--shadow-2);padding:24px;transform:translateX(105%)}\n.ph.web.on-sheet .isheet,[data-plat=web] .ph.on-sheet .isheet{transform:none}\n.ph.web .isheet .grab,[data-plat=web] .ph .isheet .grab{display:none}\n.ph.wide{width:1240px;height:700px;grid-template-columns:200px minmax(0,1fr) 460px}\n.ph.wide .ab{grid-column:2}.ph.wide .body{grid-column:2;max-width:none;padding:0 16px}\n.ph.wide .side{grid-column:3;grid-row:1/-1;position:relative;box-shadow:inset 1px 0 0 var(--border-hairline)}\n.ph.wide .side .map{position:absolute;inset:0}\n.ph.wide .r{cursor:default}\n.dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 20px;max-width:760px;font:var(--weight-regular) 14px/1.55 var(--font-core);color:var(--text-secondary);margin:0}.dl dt{color:var(--text-primary);font-weight:500}.dl dd{margin:0}\n<\u002Fstyle><\u002Fhead><body>\n<div class=\"plat\" id=\"plat\"><button data-p=\"ios\">iOS<\u002Fbutton><button data-p=\"android\">Android<\u002Fbutton><button data-p=\"web\">Web<\u002Fbutton><\u002Fdiv>\n<h1>A thread's map<\u002Fh1>\n<p class=\"lede\">Final view for approval. A thread with at least one point (a saved place, a link with a location, an event with a venue, offload's or a connected calendar's) gets a List | Map switch in its app bar. On the web, a window 1200px or wider shows the map as a column beside the list instead. The map is MapTiler Streets on every surface, drawn by MapLibre.<\u002Fp>\n<p class=\"secp\">The tiles here are OpenStreetMap's standard style standing in for MapTiler Streets, which needs a key to preview. Pins, callouts, chips and the sheet are offload's own, so they look exactly like this on MapTiler. Every frame is live: tap the switch, a pin, the map, Open.<\u002Fp>\n\n<div class=\"sec\"><h2>1 · List | Map<\u002Fh2><u>phones, and the web below 1200px<\u002Fu><\u002Fdiv>\n<p class=\"secp\">The switch is there only when the thread has a point. Map replaces the page body below the app bar; the thread's name moves into the app bar; the label chips float over the map and filter the pins. The composer stays. The choice is remembered per thread on the device.<\u002Fp>\n<div class=\"pair\"><div><p class=\"cap\">Live: start on the list<\u002Fp><div class=\"ph\" id=\"a1\"><\u002Fdiv><\u002Fdiv><div><p class=\"cap\">Live: on the map, Open tapped<\u002Fp><div class=\"ph\" id=\"a2\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<div class=\"sec\"><h2>2 · The map column<\u002Fh2><u>web, 1200px and wider<\u002Fu><\u002Fdiv>\n<p class=\"secp\">The pane splits: the list keeps its width on the left, the map takes a 460px column on the right, full height and sticky. No switch in the head. Hover a row to lift its pin; tap a pin to open its callout and highlight its row. Open shows the sheet as the side pane over the map column.<\u002Fp>\n<div class=\"pair\"><div><p class=\"cap\">Live: hover a row, tap a pin<\u002Fp><div class=\"ph web wide\" id=\"c1\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"pair\" style=\"margin-top:28px\"><div><p class=\"cap\">Live: the same thread below 1200px, back to the List | Map switch<\u002Fp><div class=\"ph web mid\" id=\"c2\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<div class=\"sec\"><h2>3 · Rules<\u002Fh2><\u002Fdiv>\n<dl class=\"dl\">\n<dt>What puts a pin<\u002Fdt><dd>A saved place; a link with a location (offload reads it from the page: an Airbnb, a restaurant, a hotel); an event with a venue, offload's own or from a connected calendar the thread shows. A place offload could not locate is not drawn and stays in the list as it is.<\u002Fdd>\n<dt>Approximate places<\u002Fdt><dd>A listing that only gives an area until it is booked (Casa Alfama here) is a soft circle in the label's colour instead of a pin: 16% fill, a 1.5px ring at 70%, about 300m across; picked, the ring is 2.5px and the fill 26%. Its callout sits on the centre, and the sheet's Address reads <i>Approximate, Alfama<\u002Fi>. It becomes a pin when an exact address arrives.<\u002Fdd>\n<dt>The switch earns<\u002Fdt><dd>When at least one live thing in the thread has a point. Losing the last one removes the switch and returns the thread to List. The Places section in the list is retired: located things sit in Everything in here like anything else.<\u002Fdd>\n<dt>Pins<\u002Fdt><dd>16px dots with a white ring, 24px when picked, each inside a 44px target. The label's colour; two labels split down the middle; three or more show the first two; none is ink. Events are rounded squares. Overlapping pins group into an ink count dot until zoomed apart.<\u002Fdd>\n<dt>Callout<\u002Fdt><dd>Name, kind and labels, then <i>Directions<\u002Fi> and <i>Open<\u002Fi>. Tapping the map closes it; tapping another pin moves it.<\u002Fdd>\n<dt>Directions<\u002Fdt><dd>Opens the device's maps app with the place as the destination: Apple Maps on iOS, or a choice when Google Maps is installed; Google Maps on Android; Google Maps in a new tab on the web.<\u002Fdd>\n<dt>Open<\u002Fdt><dd>The thing's sheet, the same as tapping its row: a half sheet over the map on the phones, dimming it at 35%; the side pane on the web. Header with the type tile, name, kind and thread, and a close. Rows for When, Address, Link, Labels and Added by. Two equal buttons: <i>Directions<\u002Fi> filled, and <i>Open link<\u002Fi> for a link or <i>Edit<\u002Fi> otherwise.<\u002Fdd>\n<dt>Filtering<\u002Fdt><dd>The chips are the thread's own filter, with the same pick in list and map. A filter that leaves no pins shows the thread's whole area with <i>Nothing under Food on the map.<\u002Fi><\u002Fdd>\n<dt>Framing<\u002Fdt><dd>The map opens fitted to every pin, never closer than street level. A picked pin's callout is kept inside the frame.<\u002Fdd>\n<dt>Attribution<\u002Fdt><dd><i>© MapTiler © OpenStreetMap contributors<\u002Fi>, small, bottom right, always shown, as both licences require.<\u002Fdd>\n<dt>Stack<\u002Fdt><dd>MapLibre on all three (maplibre-gl-js; @maplibre/maplibre-react-native in an Expo dev build), MapTiler Streets, and Streets Dark in the dark theme. Place lookup moves to MapTiler Geocoding, so one supplier draws and finds. MapTiler bills per map created, so the web keeps one map alive across threads and swaps its pins.<\u002Fdd>\n<\u002Fdl>\n\n\n<script>\nconst g=n=>`<span class=\"g\" style=\"--ic:url(../assets/icons/${n}.svg)\"><\u002Fspan>`;\nconst LB={Stay:'var(--label-1)',Food:'var(--label-5)',Saturday:'var(--label-4)'};\nconst P=[\n {id:'alfama',t:'Casa Alfama',k:'Airbnb link',ic:'link',ll:[38.7113,-9.1301],l:['Stay'],approx:1,addr:'Approximate, Alfama',url:'airbnb.com/rooms/48213907',by:'Ana',when:'Thu 9 to Sun 12 Oct'},\n {id:'market',t:'Time Out Market',k:'Place',ic:'map-pin',ll:[38.7069,-9.1459],l:['Food'],addr:'Av. 24 de Julho 49, Cais do Sodré',by:'Tom'},\n {id:'fado',t:'Fado at Tasca do Chico',k:'Event · Sat 21:30',ic:'calendar',ll:[38.7123,-9.1446],l:['Saturday'],ev:1,addr:'R. do Diário de Notícias 39, Bairro Alto',when:'Sat 11 Oct, 21:30',by:'you'},\n {id:'lxf',t:'LX Factory',k:'Place',ic:'map-pin',ll:[38.7036,-9.1784],l:['Food','Saturday'],addr:'R. Rodrigues de Faria 103, Alcântara',by:'Ana'},\n {id:'belem',t:'Pastéis de Belém',k:'Link',ic:'link',ll:[38.6975,-9.2033],l:['Food'],addr:'R. de Belém 84, Belém',url:'pasteisdebelem.pt',by:'Tom'},\n {id:'maat',t:'MAAT',k:'Place',ic:'map-pin',ll:[38.6957,-9.1946],l:[],addr:'Av. Brasília, Belém',by:'you'},\n];\nconst byId=id=>P.find(p=>p.id===id);\nconst pinHtml=(p,sel)=>{const a=p.l[0]?LB[p.l[0]]:'var(--ink-900)';const b=p.l[1]?LB[p.l[1]]:a;return `<span class=\"pin ${p.ev?'ev':''} ${sel?'sel':''}\" data-pin=\"${p.id}\" style=\"--a:${a};--b:${b}\"><\u002Fspan>`};\nconst lm=l=>`<span class=\"lm\" style=\"--c:${LB[l]}\">${l}<\u002Fspan>`;\nconst st=`<div class=\"st\"><span>9:41<\u002Fspan><span>&bull;&bull;&bull;<\u002Fspan><\u002Fdiv>`;\nconst seg=on=>`<span class=\"seg\" role=\"tablist\"><span class=\"${on==='list'?'on':''}\" data-v=\"list\">${g('list')}<\u002Fspan><span class=\"${on==='map'?'on':''}\" data-v=\"map\">${g('map-pin')}<\u002Fspan><\u002Fspan>`;\nconst ab=(title,right)=>`<div class=\"ab\">${g('chevron-left')}<b>${title||''}<\u002Fb>${right||''}${g('share-2')}${g('ellipsis')}<\u002Fdiv>`;\nconst head=`<div class=\"head\"><h3>Lisbon trip<\u002Fh3><div class=\"ppl\"><span class=\"pc\">${g('users')}Ana<\u002Fspan><span class=\"pc\">${g('users')}Tom<\u002Fspan><span class=\"pc out\">${g('share-2')}Share<\u002Fspan><\u002Fdiv><p class=\"stand\">Flights are booked. The stay in Alfama needs a yes from Tom, and Saturday is still open after LX Factory.<\u002Fp><\u002Fdiv>`;\nconst chipsRow=`<span class=\"chip on\">All <em>9<\u002Fem><\u002Fspan><span class=\"chip\"><i style=\"--c:${LB.Stay}\"><\u002Fi>Stay<\u002Fspan><span class=\"chip\"><i style=\"--c:${LB.Food}\"><\u002Fi>Food<\u002Fspan><span class=\"chip\"><i style=\"--c:${LB.Saturday}\"><\u002Fi>Saturday<\u002Fspan>`;\nconst chips=`<div class=\"chips\">${chipsRow}<\u002Fdiv>`;\nconst mchips=`<div class=\"mchips\">${chipsRow.replace(' <em>9<\u002Fem>','')}<\u002Fdiv>`;\nconst row=(p,o={})=>`<div class=\"r ${o.nb?'nb':''}\" ${p.id?`data-row=\"${p.id}\"`:''}><span class=\"tile\">${g(p.ic)}<\u002Fspan><div class=\"bd\"><b>${p.t}<\u002Fb><s>${p.k}${p.l.map(lm).join('')}<\u002Fs><\u002Fdiv><span class=\"chev\">${g('chevron-right')}<\u002Fspan><\u002Fdiv>`;\nconst nopin={t:\"Ana's cousin's tasca\",k:'Place · no address',ic:'map-pin',l:['Food']};\nconst rows=`<div class=\"sh\">Everything in here <em>9<\u002Fem><\u002Fdiv>`+[P[0],P[2],P[1],nopin,P[3],P[4]].map((p,i,a)=>row(p,{nb:i===a.length-1})).join('');\nconst todo=`<div class=\"sh\">To do <em>2<\u002Fem><\u002Fdiv>`+row({t:'Ask Tom about Casa Alfama',k:'Friday',ic:'square-check-big',l:['Stay']})+row({t:'Book the fado table',k:'no date',ic:'square-check-big',l:['Saturday']},{nb:1});\nconst plate=`<div class=\"plate\"><div class=\"pill\"><s>Dump anything<\u002Fs>${g('mic')}<\u002Fdiv><\u002Fdiv>`;\nconst wsb=`<div class=\"wsb\"><b>offload<\u002Fb><span>${g('sun')}Today<\u002Fspan><span class=\"on\">${g('lasso')}My threads<\u002Fspan><span>${g('brain')}Memories<\u002Fspan><span style=\"margin-top:auto\">${g('bell')}Activity<\u002Fspan><span>${g('settings')}Settings<\u002Fspan><\u002Fdiv>`;\n\nconst MAPS=[];\nconst pinIcon=(p,sel)=>L.divIcon({className:'',html:pinHtml(p,sel),iconSize:sel?[24,24]:[16,16]});\nconst callIcon=s=>L.divIcon({className:'',iconSize:[228,0],iconAnchor:[114,s.approx?14:24],html:`<div class=\"callout\" style=\"transform:translateY(-100%)\"><b>${s.t}<\u002Fb><s>${s.k}${s.l.map(lm).join('')}<\u002Fs><div class=\"cb\"><span class=\"pri\">${g('compass')}Directions<\u002Fspan><span class=\"open\" data-id=\"${s.id}\">Open<\u002Fspan><\u002Fdiv><\u002Fdiv>`});\nfunction fitOne(o){const el=o.el;if(!el.offsetWidth)return;o.m.invalidateSize();const H=el.offsetHeight,W=el.offsetWidth;\n o.m.fitBounds(L.latLngBounds(P.map(p=>p.ll)),{paddingTopLeft:[28,o.sel?Math.min(190,Math.round(H*.4)):70],paddingBottomRight:[28,40],maxZoom:15,animate:false});\n if(o.sel){const pt=o.m.latLngToContainerPoint(byId(o.sel).ll);let dx=0;if(pt.x<126)dx=pt.x-126;else if(pt.x>W-126)dx=pt.x-(W-126);if(dx)o.m.panBy([dx,0],{animate:false})}}\nfunction setSel(o,id,pan){o.sel=id;Object.keys(o.pins).forEach(k=>o.pins[k].setIcon(pinIcon(byId(k),k===id)));Object.keys(o.circles||{}).forEach(k=>o.circles[k].setStyle(k===id?{weight:2.5,opacity:1,fillOpacity:.26}:{weight:1.5,opacity:.7,fillOpacity:.16}));if(o.call){o.m.removeLayer(o.call);o.call=null}\n const ph=o.el.closest('.ph');ph.querySelectorAll('.r.hl').forEach(r=>r.classList.remove('hl'));if(ph.dataset)ph.dataset.sel=id||'';\n if(!id)return;const p=byId(id);o.call=L.marker(p.ll,{zIndexOffset:1000,icon:callIcon(p)}).addTo(o.m);\n const r=ph.querySelector(`[data-row=\"${id}\"]`);if(r)r.classList.add('hl');\n if(pan){const W=o.el.offsetWidth,pt=o.m.latLngToContainerPoint(p.ll);let dx=0,dy=0;if(pt.x<126)dx=pt.x-126;else if(pt.x>W-126)dx=pt.x-(W-126);if(pt.y<190)dy=pt.y-190;if(dx||dy)o.m.panBy([dx,dy])}}\nfunction initMap(el,sel){\n const m=L.map(el,{zoomControl:false,scrollWheelZoom:false,maxZoom:15});\n const tl=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:15,crossOrigin:true}).addTo(m);\n tl.on('tileload',e=>{const img=e.tile;try{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);const d=x.getImageData(0,0,256,256).data;let y=0,w=0;for(let i=0;i<d.length;i+=32){if(d[i]>200&&d[i+1]>170&&d[i+2]<90)y++;if(d[i]===255&&d[i+1]===255&&d[i+2]===255)w++}if(y>200||w>2400){img.style.visibility='hidden';img.parentNode&&(img.parentNode.style.background='#eeeae2')}}catch(_){}});\n m.attributionControl.setPrefix(false);\n const o={m,el,pins:{},sel:null,call:null};\n o.circles={};\n P.forEach(p=>{if(p.approx){const col=getComputedStyle(document.body).getPropertyValue(LB[p.l[0]].slice(4,-1)).trim()||'#0C7BB0';const c=L.circle(p.ll,{radius:320,color:col,weight:1.5,opacity:.7,fillColor:col,fillOpacity:.16,bubblingMouseEvents:false}).addTo(m);c.on('click',()=>setSel(o,p.id,true));o.circles[p.id]=c;return}\n  const mk=L.marker(p.ll,{icon:pinIcon(p,false)}).addTo(m);o.pins[p.id]=mk;mk.on('click',ev=>{L.DomEvent.stopPropagation(ev);setSel(o,p.id,true)})});\n m.on('click',()=>setSel(o,null));\n MAPS.push(o);o.sel=sel||null;fitOne(o);if(sel)setSel(o,sel,false);return o;}\nfunction killMaps(ph){for(let i=MAPS.length-1;i>=0;i--)if(ph.contains(MAPS[i].el)){MAPS[i].m.remove();MAPS.splice(i,1)}}\nfunction openSheet(ph,p){let sc=ph.querySelector(':scope>.scrim');if(!sc){sc=document.createElement('div');sc.className='scrim';ph.appendChild(sc);sc.onclick=()=>ph.classList.remove('on-sheet')}\n let sh=ph.querySelector(':scope>.isheet');if(!sh){sh=document.createElement('div');sh.className='isheet';ph.appendChild(sh)}\n const rows=[p.when?['calendar','When',p.when]:null,['map-pin','Address',p.addr],p.url?['link','Link',p.url]:null,['tag','Labels',p.l.length?p.l.map(lm).join(''):'<span style=\"color:var(--text-tertiary)\">None<\u002Fspan>'],['users','Added by',p.by]].filter(Boolean);\n sh.innerHTML=`<div class=\"grab\"><\u002Fdiv><div class=\"ih\"><span class=\"tile\">${g(p.ic)}<\u002Fspan><div class=\"tt\"><h4>${p.t}<\u002Fh4><div class=\"ik\">${p.k.split(' · ')[0]} · Lisbon trip<\u002Fdiv><\u002Fdiv><span class=\"ix\">${g('x')}<\u002Fspan><\u002Fdiv><div class=\"irows\">${rows.map(r=>`<div class=\"ir\">${g(r[0])}<span class=\"k\">${r[1]}<\u002Fspan><span class=\"v\">${r[2]}<\u002Fspan><\u002Fdiv>`).join('')}<\u002Fdiv><div class=\"ifoot\"><span class=\"btn pri\">${g('compass')}Directions<\u002Fspan>${p.url?`<span class=\"btn\">${g('arrow-up-right')}Open link<\u002Fspan>`:`<span class=\"btn\">${g('pencil')}Edit<\u002Fspan>`}<\u002Fdiv>`;\n sh.querySelector('.ix').onclick=()=>ph.classList.remove('on-sheet');\n requestAnimationFrame(()=>requestAnimationFrame(()=>ph.classList.add('on-sheet')))}\ndocument.addEventListener('click',e=>{const op=e.target.closest('.open');if(!op)return;e.stopPropagation();openSheet(op.closest('.ph'),byId(op.dataset.id))},true);\n\nfunction drawA(ph){killMaps(ph);ph.classList.remove('on-sheet');const v=ph.dataset.v;\n const body=v==='map'?`<div class=\"body full\"><div class=\"fullmap\" style=\"position:absolute;inset:0\"><div class=\"map\" style=\"position:absolute;inset:0\"><\u002Fdiv><\u002Fdiv>${mchips}<\u002Fdiv>`:`<div class=\"body\">${head}${chips}${todo}${rows}<\u002Fdiv>`;\n ph.innerHTML=wsb+st+ab(v==='map'?'Lisbon trip':'',seg(v))+body+plate;\n ph.querySelectorAll('.seg [data-v]').forEach(s=>s.onclick=()=>{ph.dataset.v=s.dataset.v;drawA(ph)});\n const el=ph.querySelector('.map');if(el)requestAnimationFrame(()=>{const o=initMap(el,ph.dataset.sel||null);if(ph.dataset.open){const p=byId(ph.dataset.open);delete ph.dataset.open;setTimeout(()=>openSheet(ph,p),350)}});}\nfunction drawC(ph){killMaps(ph);\n ph.innerHTML=wsb+ab('')+`<div class=\"body\">${head}${chips}${todo}${rows}<\u002Fdiv><div class=\"side\"><div class=\"map\"><\u002Fdiv>${mchips.replace('class=\"mchips\"','class=\"mchips\" style=\"padding:12px 16px\"')}<\u002Fdiv>`;\n const el=ph.querySelector('.map');requestAnimationFrame(()=>{const o=initMap(el,null);\n  ph.querySelectorAll('[data-row]').forEach(r=>{const id=r.dataset.row;\n   r.onmouseenter=()=>{if(!o.pins[id])return o.circles[id]&&o.circles[id].setStyle({fillOpacity:.3});const pe=o.pins[id].getElement();pe&&pe.firstChild&&pe.firstChild.classList.add('hov')};\n   r.onmouseleave=()=>{if(!o.pins[id])return o.circles[id]&&o.circles[id].setStyle({fillOpacity:o.sel===id?.26:.16});const pe=o.pins[id].getElement();pe&&pe.firstChild&&pe.firstChild.classList.remove('hov')};\n   r.onclick=()=>setSel(o,id,true)})})}\nconst a1=document.getElementById('a1');a1.dataset.v='list';drawA(a1);\nconst a2=document.getElementById('a2');a2.dataset.v='map';a2.dataset.sel='alfama';a2.dataset.open='alfama';drawA(a2);\ndrawC(document.getElementById('c1'));\nconst c2=document.getElementById('c2');c2.dataset.v='list';drawA(c2);\n\nconst fit=()=>MAPS.forEach(fitOne);\nlet PLAT=localStorage.getItem('maps-platform')||'ios';\nconst render=()=>{document.body.dataset.plat=PLAT;document.querySelectorAll('#plat button').forEach(x=>x.classList.toggle('on',x.dataset.p===PLAT));setTimeout(()=>MAPS.forEach(o=>{fitOne(o);if(o.sel)setSel(o,o.sel,false)}),60)};\ndocument.querySelectorAll('#plat button').forEach(x=>x.onclick=()=>{PLAT=x.dataset.p;localStorage.setItem('maps-platform',PLAT);render()});\nrender();window.addEventListener('load',fit);\nlet rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(fit,200)});\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
