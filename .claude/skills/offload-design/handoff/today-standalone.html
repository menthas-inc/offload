document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html data-theme=\"light\"><head><meta charset=\"utf-8\"><title>Today<\u002Ftitle>\n<style>/* offload webfonts. Two faces only, served as static instances from assets/fonts, the same\n   five files and the same five rules the web app declares (22 September 2026). Instrument Sans\n   is the whole interface; Literata is the voice offload speaks in. Numerals use Instrument Sans\n   with tabular figures, so there is no third face.\n   Static instances lose two things the variable CDN files had: Instrument Sans has no 700, so\n   anything asking for bold resolves to 600; and Literata has no optical size axis, so the\n   display sizes of the serif are drawn from the text master until the variable file is in. */\n@font-face{font-family:\"Instrument Sans\";src:url(\"66ceb83c-97e4-4e07-92b6-9f2fe8f1cb63\") format(\"truetype\");font-weight:400;font-style:normal;font-display:swap}\n@font-face{font-family:\"Instrument Sans\";src:url(\"0c5c57fa-1360-4756-b5ca-8ca9441ef8aa\") format(\"truetype\");font-weight:500;font-style:normal;font-display:swap}\n@font-face{font-family:\"Instrument Sans\";src:url(\"25c8baa3-2421-4b99-b9af-78e4fc107546\") format(\"truetype\");font-weight:600 700;font-style:normal;font-display:swap}\n@font-face{font-family:\"Literata\";src:url(\"9755269c-7d42-4f7f-b993-fc8b42b7b3ea\") format(\"truetype\");font-weight:400;font-style:normal;font-display:swap}\n@font-face{font-family:\"Literata\";src:url(\"20bf42ae-1718-42f4-84c6-94280435ea6e\") format(\"truetype\");font-weight:500 700;font-style:normal;font-display:swap}\n\n:root{\n  /* Base neutrals, pure achromatic. offload is black on white; grey does the work. */\n  --paper:#FFFFFF;\n  --ink-50:#F8F8F8;\n  --ink-100:#F2F2F2;\n  --ink-150:#EAEAEA;\n  --ink-200:#DEDEDE;\n  --ink-300:#C4C4C4;\n  --ink-400:#9E9E9E;\n  --ink-500:#7A7A7A;\n  --ink-600:#5C5C5C;\n  --ink-700:#3A3A3A;\n  --ink-800:#232323;\n  --ink-900:#141414;\n  --ink-950:#0B0B0B;\n\n  /* Accent, moss. One accent only, used at low volume. */\n  --moss-50:#F2F6F3;\n  --moss-100:#E4EDE7;\n  --moss-200:#C7DACD;\n  --moss-500:#4E8060;\n  --moss-600:#3F6B4F;\n  --moss-700:#2F5240;\n\n  /* Second accent, ink blue. Cool, so it never competes with moss.\n     One job: this needs you. Waiting, unresolved, or about to expire. */\n  --blue-50:#F4F7FF;\n  --blue-100:#E8EEFF;\n  --blue-200:#C9D6FA;\n  --blue-500:#4A68DE;\n  --blue-600:#3355D6;\n  --blue-700:#2440A8;\n  --blue-900:#1B2E7A;\n\n  /* Semantics, pitched at the same depth and saturation as the two accents,\n     so a warning sits beside moss and blue without looking washed out. */\n  --amber-100:#FFF1CC;\n  --amber-600:#F0A81E;\n  --amber-700:#7A4E02;\n  --amber-on:#0B0B0B; /* text colour on --amber-600, ink, never white */\n  --text-on-solid:#FFFFFF; /* text on moss/blue/clay fills, identical in both themes */\n  --clay-100:#FBE6E1;\n  --clay-200:#F3C6BC;\n  --clay-600:#C0392B;\n  --clay-700:#93261A;\n\n  /* Semantic aliases, always prefer these in components. */\n  --text-primary:var(--ink-950);\n  --text-secondary:var(--ink-600);\n  --text-tertiary:#6E6E6E; /* 4.5:1 on every light surface; --ink-400 was 2.55 and failed */\n  --text-inverse:var(--paper);\n  --text-accent:var(--moss-600);\n  --text-attention:var(--blue-600);\n  --text-on-attention:var(--blue-900);\n  --text-link:var(--ink-950);\n  --text-danger:var(--clay-600);\n\n  --surface-page:#FAF9F7;\n  --surface-raised:var(--paper);\n  /* The phone's bottom plate and a raised conversation: the ground the prism\n     field sits on, and by definition the colour its veil is made of. Kept as\n     one token so the two can never disagree. */\n  --surface-plate:var(--paper);\n  --surface-sunken:var(--ink-50);\n  --surface-card:var(--paper);\n  --surface-fill:var(--ink-100);\n  --surface-fill-strong:var(--ink-150);\n  --surface-inverse:var(--ink-950);\n  --surface-accent-soft:var(--moss-50);\n  --surface-attention-soft:var(--blue-100);\n  --surface-attention:var(--blue-600);\n  /* Amber has meant \"offload noticed this\" since the kits drew a Noticed\n     memory, and had no alias to say so: every use reached for the ramp, which\n     the rules forbid and the lint file could not catch because there was\n     nothing to point at. 015's rail is the second surface to need it, so the\n     alias is the fix rather than a third literal. */\n  --surface-noticed:var(--amber-600);\n  /* 023's date chip: the two soft grounds a row's nearness is drawn on. Amber\n     rather than blue for soon, because blue is the attention colour and would\n     read as offload asking for something; clay for late, the pair a failure\n     already uses. Minted because the ramps had no alias and code may not\n     consume a ramp. */\n  --surface-noticed-soft:var(--amber-100);\n  --surface-danger-soft:var(--clay-100);\n  --surface-scrim:rgba(11,11,11,0.35);\n  --surface-scrim-soft:rgba(11,11,11,0.16);\n  --surface-chrome:var(--surface-raised);\n  --surface-input:var(--ink-100);\n  --surface-chrome-strong:var(--surface-raised);\n\n  --border-hairline:var(--ink-150);\n  --border-strong:#8C8C8C; /* 3:1 on every light surface: fields, checkboxes, outlined buttons */\n  --border-focus:var(--blue-500);\n  --border-accent:var(--moss-200);\n  --border-attention:var(--blue-200);\n  --border-danger:var(--clay-200);\n  /* The edge of a raised cell that has to read at 49px. Light leans on the drop shadow and\n     takes the hairline; dark has no drop shadow, so the edge carries the card alone and\n     needs a step more. One alias so the two themes cannot drift apart by hand. */\n  --border-lift:var(--border-hairline);\n  /* A day, or a thing, carrying something that needs an answer. The ink amber in each\n     scope rather than the fill: --amber-600 as a 1px ring on paper measures 2.03:1. */\n  --border-decision:var(--amber-700);\n  /* The ink-weight counterpart to --surface-noticed, for a mark offload noticed drawn on a\n     raised surface rather than as a fill: --surface-noticed measures 2.03:1 on paper. Sits\n     beside its surface token the way --text-accent sits beside --surface-accent-soft. */\n  --text-noticed:var(--amber-700);\n  /* The plane a photo is shown on, over whatever was on screen. Not --surface-scrim, which\n     is 0.35 and dims what is behind it: this is a surface in its own right. Light dims\n     towards ink and reads as depth. Dark is OPAQUE, because a translucent plane in dark has\n     nowhere to go: --surface-page at 92% over --surface-page measures 1.00:1, and even the\n     darkest value reaches only 1.11:1. What says a viewer is open there is that the screen\n     behind it is gone. */\n  --surface-viewer:color-mix(in srgb,var(--surface-inverse) 90%,transparent);\n\n  --state-hover:rgba(11,11,11,0.04);\n  --state-press:rgba(11,11,11,0.08);\n  --state-selected:var(--ink-100);\n  --state-disabled-text:var(--ink-400);\n  --state-disabled-surface:var(--ink-100);\n}\n\n\n/* Light, restated as a scope so a document can pin itself to it. Same values as\n   :root; needed because the semantic aliases resolve where they are declared. */\n[data-theme=\"light\"]{\n  --paper:#FFFFFF;\n  --ink-50:#F8F8F8;--ink-100:#F2F2F2;--ink-150:#EAEAEA;--ink-200:#DEDEDE;--ink-300:#C4C4C4;\n  --ink-400:#9E9E9E;--ink-500:#7A7A7A;--ink-600:#5C5C5C;--ink-700:#3A3A3A;--ink-800:#232323;\n  --ink-900:#141414;--ink-950:#0B0B0B;\n  --moss-50:#F2F6F3;--moss-100:#E4EDE7;--moss-200:#C7DACD;--moss-500:#4E8060;--moss-600:#3F6B4F;--moss-700:#2F5240;\n  --blue-50:#F4F7FF;--blue-100:#E8EEFF;--blue-200:#C9D6FA;--blue-500:#4A68DE;--blue-600:#3355D6;\n  --blue-700:#2440A8;--blue-900:#1B2E7A;\n  --amber-100:#FFF1CC;--amber-600:#F0A81E;--amber-700:#7A4E02;--amber-on:#0B0B0B;--text-on-solid:#FFFFFF;\n  --clay-100:#FBE6E1;--clay-200:#F3C6BC;--clay-600:#C0392B;--clay-700:#93261A;\n  --text-primary:var(--ink-950);--text-secondary:var(--ink-600);--text-tertiary:#6E6E6E; /* 4.5:1 on every light surface; --ink-400 was 2.55 and failed */\n  --text-inverse:var(--paper);--text-accent:var(--moss-600);--text-attention:var(--blue-600);\n  --text-on-attention:var(--blue-900);--text-link:var(--ink-950);--text-danger:var(--clay-600);\n  --surface-page:#FAF9F7;--surface-raised:var(--paper);--surface-plate:var(--paper);--surface-sunken:var(--ink-50);\n  --surface-card:var(--paper);--surface-fill:var(--ink-100);--surface-fill-strong:var(--ink-150);\n  --surface-inverse:var(--ink-950);--surface-accent-soft:var(--moss-50);\n  --surface-attention-soft:var(--blue-100);--surface-attention:var(--blue-600);\n  --surface-noticed:var(--amber-600);--surface-noticed-soft:var(--amber-100);--surface-danger-soft:var(--clay-100);\n  --surface-scrim:rgba(11,11,11,0.35);--surface-scrim-soft:rgba(11,11,11,0.16);\n  --surface-chrome:var(--surface-raised);--surface-chrome-strong:var(--surface-raised);\n  --surface-input:var(--ink-100);\n  --border-hairline:var(--ink-150);--border-strong:#8C8C8C; /* 3:1 on every light surface: fields, checkboxes, outlined buttons */--border-focus:var(--blue-500);\n  --border-accent:var(--moss-200);--border-attention:var(--blue-200);--border-danger:var(--clay-200);\n  --border-lift:var(--border-hairline);--border-decision:var(--amber-700);--text-noticed:var(--amber-700);\n  --surface-viewer:color-mix(in srgb,var(--surface-inverse) 90%,transparent);\n  --state-hover:rgba(11,11,11,0.04);--state-press:rgba(11,11,11,0.08);\n  --state-selected:var(--ink-100);--state-disabled-text:var(--ink-400);--state-disabled-surface:var(--ink-100);\n  --shadow-1:0 1px 2px rgba(11,11,11,0.04);--shadow-2:0 4px 16px -4px rgba(11,11,11,0.08);\n  --shadow-3:0 12px 32px -8px rgba(11,11,11,0.12);--shadow-sheet:0 -8px 40px -12px rgba(11,11,11,0.14);\n  color-scheme:light;\n}\n\n/* Dark, charcoal with lifted surfaces. Applied by [data-theme=\"dark\"] on <html>,\n   or by the system setting when the app is left on Auto. Every alias is restated\n   so it resolves against these base values rather than the ones on :root. */\n[data-theme=\"dark\"]{\n  --paper:#191919;\n  --ink-50:#212121;--ink-100:#232323;--ink-150:#2C2C2C;--ink-200:#383838;--ink-300:#4A4A4A;\n  --ink-400:#767676;--ink-500:#969696;--ink-600:#B3B3B3;--ink-700:#C2C2C2;--ink-800:#D8D8D8;\n  --ink-900:#E4E4E4;--ink-950:#EDEDED;\n\n  /* The semantics do NOT shift with the theme: a moss chip is the same moss at\n     midnight as at noon. Only the tints (50/100) darken, because a tint is a\n     surface, and a surface has to belong to the page it sits on. */\n  --moss-50:#182E20;--moss-100:#1E3928;--moss-200:#2C5A3F;--moss-500:#4E8060;--moss-600:#3F6B4F;--moss-700:#5A8E6C;\n  --blue-50:#161F42;--blue-100:#1E2A57;--blue-200:#334388;--blue-500:#4A68DE;--blue-600:#3355D6;\n  --blue-700:#5273E8;--blue-900:#D6DEFF;\n  --amber-100:#3E2E08;--amber-600:#F0A81E;--amber-700:#F6C86A;--amber-on:#0B0B0B;--text-on-solid:#FFFFFF;\n  --clay-100:#3E1915;--clay-200:#6B2A22;--clay-600:#C0392B;--clay-700:#F9A99E;\n\n  --text-primary:var(--ink-950);--text-secondary:var(--ink-600);--text-tertiary:#959595; /* 4.5:1 on every dark surface, including the input */\n  --text-inverse:#191919;--text-accent:#82BC97;--text-attention:#95A9F7;\n  --text-on-attention:#D6DEFF;--text-link:var(--ink-950);--text-danger:#F28679;\n\n  --surface-page:#1C1B19;--surface-raised:#212121;\n  --surface-plate:#0F0F11; /* = --prism-veil-rgb; the plate is darker than a card on purpose */\n  --surface-card:#212121;--surface-sunken:#101010;\n  --surface-fill:var(--ink-100);--surface-fill-strong:var(--ink-150);--surface-inverse:var(--ink-950);\n  --surface-accent-soft:var(--moss-50);--surface-attention-soft:var(--blue-100);\n  --surface-attention:var(--blue-600);--surface-noticed:var(--amber-600);--surface-noticed-soft:var(--amber-100);\n  --surface-danger-soft:var(--clay-100);--surface-scrim:rgba(0,0,0,0.55);\n  --surface-scrim-soft:rgba(0,0,0,0.50);\n  --surface-chrome:var(--surface-raised);--surface-chrome-strong:var(--surface-raised);\n  --surface-input:#2E2E2E;\n\n  --border-hairline:var(--ink-150);--border-strong:#777777;--border-focus:var(--blue-500);\n  --border-accent:var(--moss-200);--border-attention:var(--blue-200);--border-danger:var(--clay-200);\n  /* A step up from the hairline, because dark has no drop shadow: --shadow-1 is none here,\n     so the edge is the whole of the lift. 1.94:1 against the page against the hairline's 1.23. */\n  --border-lift:var(--ink-300);--border-decision:var(--amber-700);--text-noticed:var(--amber-700);\n  --surface-viewer:var(--surface-plate); /* opaque: a mix of the page measures 1.00:1 against it */\n\n  --state-hover:rgba(255,255,255,0.06);--state-press:rgba(255,255,255,0.10);\n  --state-selected:var(--ink-100);--state-disabled-text:var(--ink-400);--state-disabled-surface:var(--ink-100);\n\n  /* Shadows do nothing on dark; surfaces separate by value instead. */\n  --shadow-1:none;--shadow-2:0 1px 0 rgba(255,255,255,0.04);--shadow-3:0 8px 28px rgba(0,0,0,0.6);\n  --shadow-sheet:0 -10px 34px -10px rgba(0,0,0,0.65);\n  color-scheme:dark;\n}\n\n/* Labels, 26 September 2026. Ten solids a person's label is drawn in, with --text-on-solid on\n   every one at 4.6:1 or better. Identical in both themes, as moss and blue are: on the dark page\n   they measure about 3.7:1, which clears the 3:1 a shape needs, and a label's words always sit on\n   the solid, never on the page. The hues keep clear of moss, blue, amber and clay. The number is\n   the order a new label takes the next free one in, spaced so the first three are far apart:\n   cerulean, rose, leaf, grape, copper, teal, fuchsia, olive, iris, jade.\n   --surface-accent is the solid accent as a surface, which two components paint (023). */\n:root,[data-theme=\"light\"],[data-theme=\"dark\"]{\n  --label-1:#0C7BB0;--label-2:#C6467B;--label-3:#5D7F00;--label-4:#8D5CC5;--label-5:#B25D25;\n  --label-6:#088285;--label-7:#AD4EAC;--label-8:#7D7616;--label-9:#6F67CB;--label-10:#06855A;\n  --surface-accent:var(--moss-600);\n}\n\n:root{\n  --font-core:\"Instrument Sans\",\"Helvetica Neue\",Helvetica,sans-serif;\n  /* The voice offload speaks in. Upright, low contrast, warm, easy to read\n     in a chat, not editorial. */\n  --font-quiet:\"Literata\",Georgia,serif;\n\n  --weight-regular:400;\n  --weight-medium:500;\n  --weight-semibold:600;\n\n  /* Larger text scales type and nothing else: every width, gutter, radius and\n     icon stays a literal pixel. Read this where a one-off literal has to move\n     with the type; the eight size tokens are overridden outright below. */\n  --type-scale:1;\n\n  /* Mobile-first scale. Sizes are literal px, not a ratio. */\n  --size-display:34px;\n  --size-title-1:26px;\n  --size-title-2:21px;\n  --size-title-3:17px;\n  --size-body:16px;\n  --size-body-sm:14px;\n  --size-label:13px;\n  --size-caption:12px;\n\n  --leading-display:1.06;\n  --leading-title:1.2;\n  --leading-body:1.45;\n  --leading-tight:1.3;\n\n  --tracking-display:-0.022em;\n  --tracking-title:-0.014em;\n  --tracking-body:-0.006em;\n  /* No uppercase role remains in the interface. Kept only for a rare tracked-out\n     wordmark or print setting; never for UI labels. */\n  --tracking-caps:0.08em;\n\n  /* Composite text roles */\n  --text-display:var(--weight-semibold) var(--size-display)/var(--leading-display) var(--font-core);\n  --text-title-1:var(--weight-semibold) var(--size-title-1)/var(--leading-title) var(--font-core);\n  --text-title-2:var(--weight-semibold) var(--size-title-2)/var(--leading-title) var(--font-core);\n  --text-title-3:var(--weight-medium) var(--size-title-3)/var(--leading-tight) var(--font-core);\n  --text-body-role:var(--weight-regular) var(--size-body)/var(--leading-body) var(--font-core);\n  --text-body-sm-role:var(--weight-regular) var(--size-body-sm)/var(--leading-tight) var(--font-core);\n  --text-label-role:var(--weight-medium) var(--size-label)/var(--leading-tight) var(--font-core);\n  --text-caption-role:var(--weight-regular) var(--size-caption)/var(--leading-tight) var(--font-core);\n  --text-quiet-role:var(--weight-regular) var(--size-body)/var(--leading-body) var(--font-quiet);\n  /* Numerals. No mono face, Instrument Sans with tabular figures, so\n     timestamps and counts hold their column. */\n  --text-numeric-role:var(--weight-regular) var(--size-caption)/var(--leading-tight) var(--font-core);\n}\n\n/* Larger text, the Settings choice. Whole pixels at 1.15 rather than calc() on\n   the base sizes: the token generator resolves values for clients that cannot\n   follow a var(), and React Native cannot parse a calc. Scoped without :root on\n   purpose, since the generator reads every :root block as the light theme and\n   would take these as the base. */\n[data-type=\"large\"]{\n  --type-scale:1.15;\n  --size-display:39px;\n  --size-title-1:30px;\n  --size-title-2:24px;\n  --size-title-3:20px;\n  --size-body:18px;\n  --size-body-sm:16px;\n  --size-label:15px;\n  --size-caption:14px;\n}\n\n:root{\n  --space-0:0px;\n  --space-1:2px;\n  --space-2:4px;\n  --space-3:6px;\n  --space-4:8px;\n  --space-5:12px;\n  --space-6:16px;\n  --space-7:20px;\n  --space-8:24px;\n  --space-9:32px;\n  --space-10:40px;\n  --space-11:56px;\n  --space-12:72px;\n\n  /* Layout constants */\n  --gutter-screen:20px;       /* left/right padding on every mobile screen */\n  --gutter-section:32px;      /* vertical rhythm between screen sections */\n  --row-height:56px;          /* standard list row */\n  --row-height-lg:72px;       /* row with two lines of text */\n  --tap-min:44px;             /* minimum TOUCH target. A control may be drawn\n                                 smaller if its hit area still reaches this. */\n  --appbar-height:52px;\n  --tabbar-height:64px;\n  --composer-height:52px;\n  --breakpoint-sm:600px;      /* one pane, phone layout below this */\n  --breakpoint-md:900px;\n  --breakpoint-lg:1180px;     /* the web shell's two-pane layout */\n  --breakpoint-xl:1440px;\n  --content-max:520px;        /* readable measure on tablet/web */\n}\n\n:root{\n  --radius-xs:6px;\n  --radius-sm:10px;\n  --radius-md:14px;\n  --radius-lg:20px;\n  --radius-xl:28px;\n  --radius-pill:999px;\n  --radius-card:var(--radius-md);\n  --radius-sheet:24px;\n  --radius-field:var(--radius-sm);\n  --border-width:1px;\n}\n\n:root{\n  /* offload separates surfaces with hairlines first, shadow second. */\n  --shadow-none:none;\n  --shadow-1:0 1px 2px rgba(11,11,11,0.04);\n  --shadow-2:0 4px 16px -4px rgba(11,11,11,0.08);\n  --shadow-3:0 12px 32px -8px rgba(11,11,11,0.12);\n  --shadow-sheet:0 -8px 40px -12px rgba(11,11,11,0.14);\n  --shadow-focus:0 0 0 3px rgba(11,11,11,0.10);\n  --blur-chrome:saturate(140%) blur(14px); /* @kind other */\n  --scrim-fade:linear-gradient(to top,rgba(255,255,255,1) 0%,rgba(255,255,255,0.92) 55%,rgba(255,255,255,0) 100%); /* @kind other */\n}\n\n:root{\n  --duration-instant:80ms; /* @kind other */\n  --duration-fast:140ms; /* @kind other */\n  --duration-base:200ms; /* @kind other */\n  --duration-slow:280ms; /* @kind other */\n  --duration-sheet:340ms; /* @kind other */\n  /* A dragged sheet moves on a spring from the release speed, not on a duration (30 September).\n     --duration-sheet and --ease-entrance now govern only the plate sliding off for a screen\n     sheet. Unitless; read by the phones' spring, not by CSS. */\n  --spring-sheet-stiffness:380; /* @kind other */\n  --spring-sheet-damping:36; /* @kind other */\n  /* The change mark, and the only duration this long: a moss ground settling to\n     transparent on something that arrived while somebody was looking at the screen.\n     Not an interaction, so it does not belong on the 140/200/280 ladder. Reduced\n     motion cuts it to nothing rather than shortening it, like everything else. */\n  --duration-mark:1400ms; /* @kind other */\n  --ease-out:cubic-bezier(0.22,0.85,0.24,1); /* @kind other */\n  --ease-in-out:cubic-bezier(0.4,0,0.2,1); /* @kind other */\n  --ease-entrance:cubic-bezier(0.16,1,0.3,1); /* @kind other */\n  --transition-ui:var(--duration-fast) var(--ease-out); /* @kind other */\n  --press-scale:0 auto;font:var(--weight-medium) 13px/1 var(--font-core);color:var(--text-accent)}\n.sh4 .hint{margin-left:auto;font:var(--weight-regular) 12.5px/1 var(--font-core);color:var(--text-tertiary)}\n.r3.todo.add{grid-template-columns:22px minmax(0,1fr) auto}\n.addt{align-self:center;height:28px;display:inline-flex;align-items:center;gap:3px;padding:0 10px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--border-strong);background:var(--surface-raised);font:var(--weight-medium) 12.5px/1 var(--font-core)}.addt .g{width:13px;height:13px}\n.plm{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:var(--radius-xs);background:var(--surface-accent-soft);color:var(--moss-700);font:var(--weight-medium) 12px/1 var(--font-core)}\n.thh{padding:10px 14px 0;font:var(--weight-semibold) 12px/1 var(--font-core);color:var(--text-secondary);display:flex;align-items:center;gap:6px}.thh .g{width:13px;height:13px}\n.pf{padding:10px 14px;font:var(--weight-regular) 13px/1 var(--font-core);color:var(--text-tertiary);box-shadow:inset 0 1px 0 var(--border-hairline);display:flex;justify-content:space-between}.pf span:last-child{color:var(--text-accent);font-weight:500}\n.tmr{font:var(--weight-regular) 13.5px/1.4 var(--font-core);color:var(--text-secondary)}.tmr b{font-weight:500;color:var(--text-primary)}\n.t-card .dc{background:var(--surface-raised)}\n.ph.and .evc{border-radius:16px;background:var(--a-c-low)}.ph.and .evc.nxt2{background:var(--surface-raised)}\n.nxl2{font:var(--weight-semibold) 20px/1.25 var(--font-core);letter-spacing:-.01em;flex:0 0 auto}.nxl2 span{color:var(--blue-600)}\n.stp .tx div{font-variant-numeric:tabular-nums}\n.thc{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px 0 7px;border-radius:99px;background:var(--surface-accent-soft);color:var(--text-accent);font:var(--weight-medium) 12.5px/1 var(--font-core);white-space:nowrap;cursor:pointer;vertical-align:middle}.thc .g{width:13px;height:13px}.thc:hover{background:var(--moss-100)}\n.why .thc{margin-left:2px}.evc .thc{align-self:flex-start;margin-top:2px}\na{color:var(--text-accent)}a:hover{color:var(--moss-700)}\n<\u002Fstyle><\u002Fhead><body><div class=\"wrap\">\n<h1>Today<\u002Fh1>\n<p class=\"lede\">The final pass. <b>Needs you<\u002Fb> on top when something is waiting on you, then the day: one line for what's next, the day's events as a strip, <b>To do<\u002Fb>, and <b>If you have time<\u002Fb>. Arrows move between days. <b>Customize Today<\u002Fb> opens from the app bar. Earlier rounds are in <a href=\"today-five-directions.html\">Today: five directions<\u002Fa>.<\u002Fp>\n<div class=\"plat\" id=\"plat\"><button data-p=\"ios\">iOS<\u002Fbutton><button data-p=\"android\">Android<\u002Fbutton><button data-p=\"web\">Web<\u002Fbutton><\u002Fdiv>\n\n<div class=\"sechead\"><h2>1. The page<\u002Fh2><u>Tuesday, 10:30<\u002Fu><\u002Fdiv>\n<div class=\"row\" style=\"gap:40px;margin-top:14px\"><div class=\"cell\"><div class=\"state\">Something needs you<\u002Fdiv><div class=\"dev\" id=\"pMain\"><\u002Fdiv><\u002Fdiv><div class=\"cell\"><div class=\"state\">A usual day: nothing needs you<\u002Fdiv><div class=\"dev\" id=\"pQuiet\"><\u002Fdiv><\u002Fdiv><div class=\"cell\"><div class=\"state\">Customize Today<\u002Fdiv><div class=\"dev\" id=\"pEdit\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"why2\" style=\"margin-top:8px;color:var(--text-tertiary)\">Each phone scrolls.<\u002Fp>\n<div class=\"why2\" style=\"margin-top:10px\"><ul>\n<li><b>Needs you<\u002Fb> holds interruptions only: an account issue, a person waiting, a question offload asked, a tip. When there are none, it is not drawn.<\u002Fli>\n<li><b>Customize Today<\u002Fb> opens from the sliders in the app bar, drawn on Today only. Three sections to drag and switch; changes apply as you make them.<\u002Fli>\n<li>The sliders glyph is Lucide's <code>sliders-horizontal<\u002Fcode>, now in the system with <code>mail<\u002Fcode> for the forwarding tip.<\u002Fli><\u002Ful><\u002Fdiv>\n\n<div class=\"sechead\"><h2>2. Needs you, card by card<\u002Fh2><u>one shape, four kinds<\u002Fu><\u002Fdiv>\n<p class=\"why2\">The kind and how long it has waited, a title, one line of context, and the actions that settle it. Order: account issues, people waiting, questions (a question about a forwarded email included), then one tip. The forwarding tip copies the address; a filed or failed email stays in Activity. One card shows with the rest stacked under it; settle or swipe it and the next comes up, and the clock puts it off until tomorrow.<\u002Fp>\n<div class=\"gal\" id=\"gal\"><\u002Fdiv>\n\n<div class=\"sechead\"><h2>3. The day<\u002Fh2><u>expect, then do<\u002Fu><\u002Fdiv>\n<div class=\"why2\"><ul>\n<li><b>The next event, in one line<\u002Fb>: <i>Call with Ana <span style=\"color:var(--blue-600)\">in 1h 30m<\u002Fspan><\u002Fi>. The countdown is blue. On another day it names the first event and its hour.<\u002Fli>\n<li><b>The day's events<\u002Fb> as a strip of small cards you scroll sideways. Past ones fade, the next is raised. A tap opens the event in the calendar app; offload does not edit it here.<\u002Fli>\n<li><b>To do<\u002Fb>: late first with its late chip (past three, the rest fold into <i>3 more late<\u002Fi>), then to-dos with a time, carrying their hour, then the rest due that day.<\u002Fli>\n<li><b>If you have time<\u002Fb>: on Today only, up to three to-dos with no date, picked by offload, each with <i>+ Today<\u002Fi> to take it on for the day.<\u002Fli>\n<li>Sections with nothing in them are not drawn. There is no line for tomorrow; the arrow is one tap away.<\u002Fli><\u002Ful><\u002Fdiv>\n\n<div class=\"sechead\"><h2>4. Moving between days<\u002Fh2><u>arrows, and a swipe across the day<\u002Fu><\u002Fdiv>\n<div class=\"row\" style=\"gap:32px;margin-top:14px;align-items:flex-start\">\n<div class=\"cell\"><div class=\"state\">Tomorrow<\u002Fdiv><div class=\"dev\" id=\"pN1\"><\u002Fdiv><\u002Fdiv>\n<div class=\"cell\"><div class=\"state\">Thursday<\u002Fdiv><div class=\"dev\" id=\"pN2\"><\u002Fdiv><\u002Fdiv>\n<div class=\"cell\"><div class=\"state\">Next Monday<\u002Fdiv><div class=\"dev\" id=\"pN3\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"why2\" style=\"margin-top:14px\">Names go <b>Today, Tomorrow, then weekday names to Sunday, then Next Monday to Next Sunday<\u002Fb>, then the date (<i>Wed 15 Oct<\u002Fi>). The back arrow stops at Today. Other days write their date small under the name. Needs you stays on top whichever day is shown, and the page opens on Today again the next time.<\u002Fp>\n\n<div class=\"sechead\"><h2>5. What Customize Today saves<\u002Fh2><u>no model call<\u002Fu><\u002Fdiv>\n<div class=\"row\" style=\"gap:24px;margin-top:10px;align-items:flex-start\">\n<pre class=\"js\">{\n  \"version\": 1,\n  \"sections\": [\n    { \"kind\": \"needs_you\", \"on\": true },\n    { \"kind\": \"day\", \"on\": true },\n    { \"kind\": \"moved\", \"on\": false }\n  ]\n}<\u002Fpre>\n<p class=\"why2\" style=\"margin:0\">One small document per account, synced across devices, read by the server when it builds Today. The sections are a closed set that grows: a new kind ships with a default place and switch, and older layouts get it at its default. What Needs you holds, and what offload picks for If you have time, are the server's rules, not part of the document.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n\n<script>\nconst g=n=>`<i class=\"g\" style=\"--ic:url(../assets/icons/${n}.svg)\"><\u002Fi>`;\nconst L={lis:['Lisbon','var(--label-1)'],par:['Paris','var(--label-2)']};\nconst lb=k=>`<span class=\"lb\" style=\"--l:${L[k][1]}\">${L[k][0]}<\u002Fspan>`;\nconst st=a=>a?`<div class=\"t-st\"><span>10:30<\u002Fspan><i>▾ ▴ ▮<\u002Fi><\u002Fdiv>`:`<div class=\"t-st\"><span>10:30<\u002Fspan><i>●●● ▮<\u002Fi><\u002Fdiv>`;\nconst ab=()=>`<div class=\"t-ab\"><span class=\"mark\"><i class=\"lm\"><\u002Fi>offload<\u002Fspan><span class=\"sp\"><\u002Fspan><span class=\"abi\">${g('sliders-horizontal')}<\u002Fspan><span class=\"abi\">${g('bell')}<b><\u002Fb><\u002Fspan><span class=\"abi\">${g('settings')}<\u002Fspan><\u002Fdiv>`;\nconst plate=`<div class=\"plate\"><div class=\"prism\"><i><\u002Fi><\u002Fdiv><div class=\"cw\"><div class=\"pill\"><s>Dump anything<\u002Fs><span class=\"ib\">${g('mic')}<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"tabs\"><span class=\"on\">${g('sun')}Today<\u002Fspan><span>${g('lasso')}My threads<\u002Fspan><span>${g('cloudy')}Notes<\u002Fspan><\u002Fdiv><\u002Fdiv>`;\nconst C0={\ncal:{k:'broken',ic:'cloud-off',kind:'Calendar',t:'Google Calendar stopped syncing',why:'Events after Sunday are missing from your day.',acts:['Reconnect','Not now']},\nana:{k:'at',ic:'users',kind:'Waiting 2 days',t:'Ana Duarte wants to connect',why:'She shares Europe, October with you.',acts:['Accept','Not now']},\nq:{k:'at',ic:'message-circle',kind:'offload asked',t:'Sintra train: Saturday or Sunday?',why:'Europe, October',acts:['Saturday','Sunday']},\ntip:{k:'tip',ic:'mail',kind:'Tip',t:'Forward emails to offload',why:'Send them to over@to.offload.club from jo@hey.com.',acts:['Copy address','Got it']}};\nconst C=C0;C.ana.why='Shares '+`<span class=\"thc\">${g('lasso')}Europe, October<\u002Fspan>`+' with you';C.q.why=`<span class=\"thc\">${g('lasso')}Europe, October<\u002Fspan>`;\nconst ORDER=['cal','ana','q','tip'];\nconst cardIn=(c,n)=>`<div class=\"kind k-${c.k}\">${g(c.ic)}${c.kind}${n?`<span class=\"n\">${n} of ${ORDER.length}<\u002Fspan>`:''}<\u002Fdiv><div class=\"ttl\">${c.t}<\u002Fdiv><div class=\"why\">${c.why}<\u002Fdiv><div class=\"acts\">${c.acts.map((a,i)=>`<span class=\"${i===0?'pri':''}\">${a}<\u002Fspan>`).join('')}<span class=\"lt\">${g('clock')}<\u002Fspan><\u002Fdiv>`;\nconst stack=(key='cal')=>`<div class=\"ny\"><div class=\"cd b2\"><\u002Fdiv><div class=\"cd b1\"><\u002Fdiv><div class=\"cd top\">${cardIn(C[key],ORDER.indexOf(key)+1)}<\u002Fdiv><\u002Fdiv>`;\nconst mkI=k=>`<span class=\"mkw\"><i class=\"mk ${k}\"><\u002Fi><\u002Fspan>`;\nconst card=rows=>`<div class=\"t-card\">${rows.join('')}<\u002Fdiv>`;\nconst sec=(t,n,body,x='')=>`<div><div class=\"sh4\">${t}${n!=null?`<em>${n}<\u002Fem>`:''}${x}<\u002Fdiv>${body}<\u002Fdiv>`;\nconst THREADS=['Europe, October','Flat','Work','Health','Bookshelf build'];\nconst tc=n=>`<span class=\"thc\">${g('lasso')}${n}<\u002Fspan>`;\nconst tx=s=>THREADS.includes(s)?tc(s):s;\nconst ms=it=>`${tx(it.s)}${it.lb?lb(it.lb):''}`;\nconst todoRow=it=>`<div class=\"r3 todo\">${mkI('task')}<div><b>${it.tt}<\u002Fb><s>${it.d?`<span class=\"dc late\">${g('calendar')}${it.d}<\u002Fspan>`:''}${it.t?`<span class=\"dc\">${g('clock')}${it.t}<\u002Fspan>`:''}${ms(it)}<\u002Fs><\u002Fdiv><\u002Fdiv>`;\nconst addRow=it=>`<div class=\"r3 todo add\">${mkI('task')}<div><b>${it.tt}<\u002Fb><s>${ms(it)}<\u002Fs><\u002Fdiv><span class=\"addt\">${g('plus')}Today<\u002Fspan><\u002Fdiv>`;\nconst evc=e=>`<div class=\"evc ${e.past?'past':''} ${e.next?'nxt2':''}\"><i>${e.t} to ${e.e}<\u002Fi><b>${e.tt}<\u002Fb>${THREADS.includes(e.s)?tc(e.s):`<s>${e.s}<\u002Fs>`}<\u002Fdiv>`;\nconst D={\ntoday:{name:'Today',brief:'Call with Ana <span>in 1h 30m<\u002Fspan>',\n ev:[{t:'9:00',e:'9:30',tt:'Standup',s:'Google, Work',past:1},{t:'12:00',e:'12:30',tt:'Call with Ana',s:'Google, Personal',next:1},{t:'14:00',e:'15:00',tt:'Viewing, Rua da Rosa flat',s:'Flat'},{t:'19:30',e:'22:00',tt:'Dinner, Sam',s:'Google, Personal'}],\n todo:[{tt:'Renew the bike insurance',s:'Flat',d:'Due 5 days ago'},{tt:'Split the flight cost, €214 each',s:'Europe, October',d:'Due 2 days ago'},{tt:'Call the letting agent',s:'Flat',t:'11:00'},{tt:'Send the slides to Priya',s:'Work',t:'16:00'},{tt:'Buy Viva Viagem cards',s:'Europe, October',lb:'lis'},{tt:'Book the Sintra train',s:'Europe, October',lb:'lis'},{tt:'Pay the council tax',s:'Flat'},{tt:'Review the Q4 budget',s:'Work'}],\n spare:[{tt:'Return the drill to Tom',s:'Flat'},{tt:'Fix the bathroom tap',s:'Flat'},{tt:'Draft the offsite agenda',s:'Work'}]},\ntom:{name:'Tomorrow',sub:'Wednesday 1 October',brief:'Dentist <span>at 10:00<\u002Fspan>',\n ev:[{t:'10:00',e:'10:45',tt:'Dentist',s:'Google, Personal',next:1},{t:'13:00',e:'14:00',tt:'Lunch with Maya',s:'Google, Personal'},{t:'19:30',e:'22:00',tt:'Dinner, Sam',s:'Google, Personal'}],\n todo:[{tt:\"Musée d'Orsay tickets\",s:'Europe, October',lb:'par'},{tt:'Return the drill to Tom',s:'Flat'}]},\nthu:{name:'Thursday',sub:'2 October',brief:'Viewing, Rua da Rosa flat <span>at 14:00<\u002Fspan>',\n ev:[{t:'14:00',e:'15:00',tt:'Viewing, Rua da Rosa flat',s:'Flat',next:1}],\n todo:[{tt:'Check in online, TP 1353',s:'Europe, October',lb:'lis',t:'18:00'},{tt:'Pack the charger adapters',s:'Europe, October',lb:'lis'}]},\nmon:{name:'Next Monday',sub:'6 October',brief:'Standup <span>at 9:00<\u002Fspan>',\n ev:[{t:'9:00',e:'9:30',tt:'Standup',s:'Google, Work',next:1},{t:'13:00',e:'13:45',tt:'Physio',s:'Health'}],\n todo:[{tt:'Timber order ready to collect',s:'Bookshelf build',t:'17:00'}]}};\nconst stp=d=>`<div class=\"stp\"><span class=\"b ${d.name==='Today'?'off':''}\">${g('chevron-left')}<\u002Fspan><div class=\"tx\" style=\"text-align:center\"><h4>${d.name}<\u002Fh4>${d.sub?`<div>${d.sub}<\u002Fdiv>`:''}<\u002Fdiv><span class=\"b\">${g('chevron-right')}<\u002Fspan><\u002Fdiv>`;\nconst day=d=>stp(d)+(d.ev.length?`<div class=\"nxl2\">${d.brief}<\u002Fdiv>`+sec('Where you will be',d.ev.length,`<div class=\"evs\">${d.ev.map(evc).join('')}<\u002Fdiv>`):'')+(d.todo.length?sec('To do',d.todo.length,card(d.todo.map(todoRow))):'')+(d.spare?sec('If you have time',null,card(d.spare.map(addRow)),'<span class=\"hint\">picked by offload<\u002Fspan>'):'');\nconst sw=on=>`<span class=\"sw ${on?'':'off'}\"><\u002Fspan>`;\nconst sheetEdit=`<h3>Customize Today<\u002Fh3><div class=\"sub\">Drag to reorder. Switch off to hide.<\u002Fdiv>\n${[['Needs you','Requests, questions, account issues, tips',1],['Your day','Events and to-dos, a day at a time',1],['What moved','Shared threads, since you last looked',0]].map(([n,e,on])=>`<div class=\"srow\"><span class=\"grip\">${g('grip-vertical')}<\u002Fspan><span class=\"n\">${n}<em>${e}<\u002Fem><\u002Fspan>${sw(on)}<\u002Fdiv>`).join('')}\n<div class=\"sfoot2\"><span class=\"pb lead\">Reset<\u002Fspan><span class=\"pb pri\">Done<\u002Fspan><\u002Fdiv>`;\nconst S={\npMain:{gap:16,sc:()=>stack()+day(D.today)},\npQuiet:{gap:16,sc:()=>day(D.today)},\npEdit:{base:'pMain',sheet:sheetEdit,crumb:'Customize Today'},\npN1:{gap:16,sc:()=>stack()+day(D.tom)},\npN2:{gap:16,sc:()=>day(D.thu)},\npN3:{gap:16,sc:()=>day(D.mon)}\n};\nconst content=k=>{const o=S[k];const b=o.base?S[o.base]:o;return {gap:b.gap,html:b.sc()}};\nconst phone=(k,and)=>{const o=S[k];const c=content(k);\nreturn `<div class=\"ph ${and?'and':''}\">${st(and)}${ab()}<div class=\"t-sc scroll\" style=\"gap:${c.gap}px\">${c.html}<\u002Fdiv>${plate}${o.sheet?`<div class=\"scrim\"><\u002Fdiv><div class=\"sh\"><div class=\"grab\"><\u002Fdiv>${o.sheet}<\u002Fdiv>`:''}<\u002Fdiv>`};\nconst web=k=>{const o=S[k];const c=content(k);\nconst side=`<div class=\"wsb\" data-theme=\"dark\"><span class=\"mark\"><i class=\"lm\"><\u002Fi>offload<\u002Fspan>\n<div class=\"it on\">${g('sun')}Today<\u002Fdiv><div class=\"it\">${g('lasso')}My threads<\u002Fdiv><div class=\"it\">${g('cloudy')}Notes<\u002Fdiv><div class=\"it\">${g('bell')}Activity<b><\u002Fb><\u002Fdiv>\n<div class=\"gl\">Pinned<\u002Fdiv><div class=\"it\">${g('lasso')}Europe, October<\u002Fdiv><div class=\"it\">${g('lasso')}Bookshelf build<\u002Fdiv><div class=\"it\">${g('lasso')}Health<\u002Fdiv>\n<span class=\"sp\"><\u002Fspan><div class=\"it\">${g('settings')}Settings<\u002Fdiv><\u002Fdiv>`;\nconst head=`<div class=\"wph\"><h1>Today<\u002Fh1><span class=\"sp\"><\u002Fspan><span class=\"tl2\"><span>${g('sliders-horizontal')}<\u002Fspan><\u002Fspan><\u002Fdiv>`;\nconst p1=`<div class=\"wpane ${o.sheet?'w520':''}\" style=\"overflow-y:auto\"><div class=\"meas\" style=\"gap:${c.gap}px\">${head}${c.html}<\u002Fdiv><\u002Fdiv>`;\nconst p2=o.sheet?`<div class=\"wpane two\"><div class=\"meas\" style=\"gap:0;max-width:560px\">${o.sheet}<\u002Fdiv><\u002Fdiv>`:'';\nreturn `<div class=\"wf\"><div class=\"in\">${side}<div class=\"wmain\"><div class=\"wcr\"><b>Today<\u002Fb>${o.crumb?`${g('chevron-right')}<b>${o.crumb}<\u002Fb>`:''}<span style=\"margin-left:auto\">Tuesday 30 September<\u002Fspan><\u002Fdiv><div class=\"wpanes\">${p1}${p2}<\u002Fdiv><div class=\"wcompw\"><div class=\"wcomp\"><div><s>Dump anything<\u002Fs>${g('paperclip')}${g('mic')}<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>`};\nlet PLAT=localStorage.getItem('today-platform')||'ios';\nconst render=()=>{document.querySelectorAll('.dev').forEach(el=>{el.innerHTML=PLAT==='web'?web(el.id):phone(el.id,PLAT==='android')});\ndocument.getElementById('gal').innerHTML=ORDER.map(k=>`<div class=\"nyc\">${cardIn(C[k],ORDER.indexOf(k)+1)}<\u002Fdiv>`).join('');\ndocument.querySelectorAll('#plat button').forEach(b=>b.classList.toggle('on',b.dataset.p===PLAT))};\ndocument.querySelectorAll('#plat button').forEach(b=>b.onclick=()=>{PLAT=b.dataset.p;localStorage.setItem('today-platform',PLAT);render()});\nrender();\n<\u002Fscript><\u002Fbody><\u002Fhtml>"
  </script>
