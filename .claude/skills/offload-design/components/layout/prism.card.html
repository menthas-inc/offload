<!-- @dsCard group="Components" viewport="900x600" name="Prism field" subtitle="The one piece of decoration: frozen, warps on arrival" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css?v=2">
<style>body{margin:0;padding:0;font:var(--text-body-role);background:var(--surface-page)}
#root{padding:20px;display:flex;flex-direction:column;gap:16px}
.lbl{font:var(--text-caption-role);color:var(--text-tertiary);letter-spacing:var(--tracking-caps);text-transform:uppercase}
.pair{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.stage{width:390px;flex:0 0 auto}
.plate{position:relative;z-index:9;overflow:hidden;background:transparent;border-radius:var(--radius-xl) var(--radius-xl) 0 0;box-shadow:var(--shadow-sheet)}
.fakelist{height:120px;background:var(--surface-page);border:1px dashed var(--border-hairline);border-bottom:none;border-radius:8px 8px 0 0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font:var(--text-caption-role);color:var(--text-tertiary)}
.gatebox{position:relative;height:300px;background:var(--surface-page);border:1px solid var(--border-hairline);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}
button.go{font:var(--weight-medium) var(--size-label)/1 var(--font-core);height:32px;padding:0 var(--space-5);border-radius:var(--radius-sm);border:1px solid transparent;background:var(--surface-inverse);color:var(--text-inverse);cursor:pointer}
.note{font:var(--text-body-sm-role);color:var(--text-secondary);max-width:60ch;line-height:1.5}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script></head>
<body><div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react">
const NS = window.OffloadDesignSystem_dc4a89 || {};
const { PrismField, TabBar, Logo } = NS;

function Demo(){
  const [filed,setFiled] = React.useState(0);
  const [gate,setGate] = React.useState(0);
  return (
    <>
      <p className="note">A baked texture held frozen. Press either button: the field warps for <code>--prism-run</code>, eases its clock to a stop over <code>--prism-settle</code>, and freezes again wherever it landed. Nothing runs at rest.</p>

      <span className="lbl">In a plate &middot; veil graded</span>
      <div className="pair">
        <div className="stage">
          <div className="fakelist">the list never sits on the field</div>
          <div className="plate">
            <PrismField variant="band" veil="graded" pulse={filed} basePath="../../assets/prism" style={{zIndex:0}}/>
            <div style={{position:"relative",zIndex:2}}>
              <div style={{display:"flex",padding:"var(--space-4) var(--gutter-screen) var(--space-5)"}}>
                <span style={{flex:1,minHeight:48,boxSizing:"border-box",display:"flex",alignItems:"center",
                  padding:"0 var(--space-6)",borderRadius:"var(--radius-pill)",background:"var(--surface-input)",
                  border:"1px solid var(--border-focus)",font:"var(--text-body-role)",color:"var(--text-tertiary)"}}>Dump anything</span>
              </div>
              <TabBar style={{background:"transparent",borderTop:"1px solid transparent"}} value="home" items={[
                {value:"home",label:"Today",icon:"sun"},
                {value:"spaces",label:"My threads",icon:"lasso"},
                {value:"thoughts",label:"Memories",icon:"cloudy"}]}/>
            </div>
          </div>
        </div>
        <button type="button" className="go" onClick={()=>setFiled(filed+1)}>Something arrived</button>
      </div>

      <span className="lbl">Behind the gate &middot; veil none</span>
      <div className="pair">
        <div className="stage">
          <div className="gatebox">
            <PrismField key={gate} variant="bloom" veil="none" arriveOnMount basePath="../../assets/prism"
              style={{inset:"auto",left:"-34%",top:"-30%",width:"120%",height:"100%",zIndex:0}}/>
            <span style={{position:"relative",zIndex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:20}}>
              <Logo variant="mark" size={92}/>
              <span style={{font:"var(--weight-semibold) 30px/1 var(--font-core)",letterSpacing:"-0.03em"}}>offload</span>
            </span>
          </div>
        </div>
        <button type="button" className="go" onClick={()=>setGate(gate+1)}>Screen appeared</button>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(
  PrismField
    ? <Demo/>
    : <p className="note">PrismField is not in the compiled bundle yet. It compiles at the end of the turn it was added in; reload after that.</p>
);
</script></body></html>
