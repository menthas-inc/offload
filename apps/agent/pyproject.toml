[project]
name = "offload-agent"
version = "0.0.0"
description = "The agent plane. The only thing in offload that talks to Claude."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "pydantic>=2.9",
  "httpx>=0.27",
  "structlog>=24.4",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

# One entrypoint. There is no HTTP surface in 003 because nothing calls the
# agent plane synchronously; FastAPI becomes a second entrypoint on this same
# image the moment something does.
[project.scripts]
offload-worker = "offload_agent.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offload_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
