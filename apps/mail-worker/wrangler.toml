# 026. The mail Worker: Email Routing on to.offload.club hands every message
# for over@ to this, and it hands the bytes to core-api. It keeps nothing, so
# it declares no KV, R2, D1, queue or any other binding, and a test holds that.
#
# Deployed by the owner, who holds the Cloudflare credentials:
#   pnpm --filter @offload/mail-worker deploy
#   npx wrangler secret put MAIL_INBOUND_SECRET
name = "offload-mail"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
INBOUND_URL = "https://api.offload.club/v1/mail/inbound"
